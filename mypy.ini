[mypy]
python_version = 3.11
check_untyped_defs = True
ignore_missing_imports = True
warn_return_any = False
warn_unused_ignores = False
strict_optional = True

# Per-module overrides
[mypy-app.models.*]
ignore_errors = True  # SQLAlchemy 2.0 mapped_column is hard to type

[mypy-alembic.*]
ignore_errors = True

[mypy-tests.*]
ignore_errors = True
