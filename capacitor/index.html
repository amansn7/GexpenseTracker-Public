<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#14120e" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://your-production-domain.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://your-production-domain.com;" />
  <title>MoneyFlow</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #14120e;
      color: #efe9d8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 20px;
    }
    .loader { text-align: center; }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid #2a2720;
      border-top-color: #d4922a;
      border-radius: 50%;
      animation: spin 700ms linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 13px; color: #8a857a; }
  </style>
</head>
<body>
  <div class="loader">
    <div class="spinner"></div>
    <p>Loading MoneyFlow…</p>
  </div>
</body>
</html>
