[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E731",  # lambda assignment (used in retry logic)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F811"]  # imports not at top, redefined fixtures
"alembic/*" = ["E402"]  # imports not at top
"app/models/*" = ["F401", "F821"]  # unused imports (re-exports), forward refs in relationships
"app/main.py" = ["E402"]  # logging setup before imports
"app/api/emails.py" = ["E402"]  # logging setup before imports
"app/classifier/llm/__init__.py" = ["E402", "F401"]  # lazy imports, re-exports
"app/sync/__init__.py" = ["F401"]  # re-exports
"app/workers/__init__.py" = ["F401"]  # re-exports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
