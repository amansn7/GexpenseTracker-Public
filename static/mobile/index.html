<html lang="en">
<head>

<style id="tokens">
/* Gexpense Hi-Fi — design tokens */
@keyframes tickerFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.ticker-msg { animation: tickerFade 0.45s cubic-bezier(0.4,0.8,0.4,1); }
:root {
  /* brand */
  --brand: #0F8A5F;
  --brand-600: #0B6E4B;
  --brand-700: #095636;
  --brand-50: #E6F4EE;
  --brand-100: #C7E7D8;
  --brand-soft: rgba(15, 138, 95, 0.10);
  --brand-glow: 0 0 0 4px rgba(15, 138, 95, 0.18);

  /* surfaces — light */
  --bg: #F7F7F4;
  --surface: #FFFFFF;
  --surface-2: #F2F2EE;
  --surface-3: #ECECE7;
  --line: rgba(20, 20, 18, 0.08);
  --line-strong: rgba(20, 20, 18, 0.16);

  /* ink */
  --ink: #131313;
  --ink-2: #3D3D3B;
  --ink-3: #6B6B66;
  --ink-4: #A1A19A;
  --ink-5: #C9C9C2;
  --paper: #FFFFFF;

  /* state */
  --ok: #0F8A5F;
  --warn: #C77A0F;
  --err: #C0392B;
  --info: #1F6FEB;

  /* radii */
  --r-sm: 8px;
  --r: 12px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;

  /* shadow */
  --sh-1: 0 1px 2px rgba(20,20,18,0.04), 0 1px 1px rgba(20,20,18,0.04);
  --sh-2: 0 4px 14px rgba(20,20,18,0.06), 0 1px 2px rgba(20,20,18,0.04);
  --sh-3: 0 18px 40px rgba(20,20,18,0.10), 0 4px 10px rgba(20,20,18,0.06);

  /* type */
  --font-sans: 'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', 'JetBrains Mono', ui-monospace, monospace;
  --font-display: 'Geist', 'Inter', system-ui, sans-serif;
}

[data-theme="dark"] {
  --bg: #0B0B0C;
  --surface: #141416;
  --surface-2: #1B1B1E;
  --surface-3: #232327;
  --line: rgba(255,255,255,0.07);
  --line-strong: rgba(255,255,255,0.14);

  --ink: #F4F4F1;
  --ink-2: #D4D4CF;
  --ink-3: #9C9C95;
  --ink-4: #6E6E68;
  --ink-5: #3F3F3B;
  --paper: #131313;

  --brand: #2DBF87;
  --brand-600: #25A372;
  --brand-700: #1E8A5F;
  --brand-50: rgba(45, 191, 135, 0.12);
  --brand-100: rgba(45, 191, 135, 0.22);
  --brand-soft: rgba(45, 191, 135, 0.14);

  --sh-1: 0 1px 2px rgba(0,0,0,0.4);
  --sh-2: 0 4px 14px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.4);
  --sh-3: 0 18px 40px rgba(0,0,0,0.55), 0 4px 10px rgba(0,0,0,0.4);
}

/* base */
* { box-sizing: border-box; }
.app, .app * { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--font-mono); }

/* phone canvas */
.phone {
  width: 390px;
  height: 844px;
  background: var(--bg);
  color: var(--ink);
  border-radius: 48px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--sh-3), inset 0 0 0 1px var(--line);
  display: flex; flex-direction: column;
  transition: background 0.32s cubic-bezier(0.4,0.8,0.4,1), color 0.32s cubic-bezier(0.4,0.8,0.4,1);
}
.phone *, .phone *::before, .phone *::after {
  transition: background-color 0.32s cubic-bezier(0.4,0.8,0.4,1), border-color 0.32s cubic-bezier(0.4,0.8,0.4,1), color 0.32s cubic-bezier(0.4,0.8,0.4,1);
}
.phone .scroll {
  flex: 1; overflow-y: auto;
  padding-bottom: 110px;
  scroll-behavior: smooth;
}
.phone .scroll::-webkit-scrollbar { display: none; }

/* status bar */
.statusbar {
  height: 44px;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 24px;
  font-family: var(--font-sans);
  font-size: 14px; font-weight: 600;
  color: var(--ink);
  flex-shrink: 0;
  position: relative; z-index: 5;
}
.statusbar .icons { display: flex; gap: 5px; align-items: center; }

/* shared building blocks */
.card {
  background: var(--surface);
  border-radius: var(--r-md);
  box-shadow: var(--sh-1);
  border: 1px solid var(--line);
}

.label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
}

.h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.15; }
.h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.body { font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.small { font-size: 12px; color: var(--ink-3); }
.tabular { font-variant-numeric: tabular-nums; }

.btn {
  appearance: none; border: none; cursor: pointer;
  font-family: var(--font-sans); font-weight: 600;
  border-radius: 999px; padding: 12px 18px; font-size: 14px;
  transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 14px rgba(15,138,95,0.25); }
.btn-primary:hover { background: var(--brand-600); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-3); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 500;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line);
  cursor: pointer; user-select: none;
  transition: background 0.15s ease, color 0.15s ease;
}
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.brand { background: var(--brand-50); color: var(--brand); border-color: transparent; }
.chip.brand.on { background: var(--brand); color: #fff; }

.toggle {
  width: 44px; height: 26px; border-radius: 999px;
  background: var(--surface-3); position: relative; cursor: pointer;
  transition: background 0.2s ease;
  flex-shrink: 0;
}
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: var(--sh-1);
  transition: left 0.22s cubic-bezier(0.4, 0.8, 0.4, 1);
}
.toggle.on { background: var(--brand); }
.toggle.on::after { left: 21px; }

.divider { height: 1px; background: var(--line); margin: 12px 0; }

/* category swatches */
.cat {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: grid; place-items: center;
  flex-shrink: 0;
  font-size: 18px;
}
.cat-food   { background: #FEEAD7; color: #B6510D; }
.cat-travel { background: #DCEAFB; color: #1F4FA8; }
.cat-shop   { background: #EDE3FB; color: #5530A8; }
.cat-bills  { background: #E0F2EE; color: #0B6E4B; }
.cat-coffee { background: #F1E4D5; color: #6B4220; }
.cat-grocery{ background: #E5F1D8; color: #4F7218; }
.cat-subs   { background: #FAE0E6; color: #A02446; }
.cat-fuel   { background: #F4E2D7; color: #8C3A14; }
.cat-health { background: #DCEEE7; color: #1A6B53; }
.cat-rent   { background: #E5E5E0; color: #2A2A28; }

[data-theme="dark"] .cat-food   { background: rgba(254,234,215,0.10); color: #F0B583; }
[data-theme="dark"] .cat-travel { background: rgba(220,234,251,0.10); color: #84B0EE; }
[data-theme="dark"] .cat-shop   { background: rgba(237,227,251,0.10); color: #B79BEE; }
[data-theme="dark"] .cat-bills  { background: rgba(224,242,238,0.10); color: var(--brand); }
[data-theme="dark"] .cat-coffee { background: rgba(241,228,213,0.10); color: #C9A37C; }
[data-theme="dark"] .cat-grocery{ background: rgba(229,241,216,0.10); color: #B6CC85; }
[data-theme="dark"] .cat-subs   { background: rgba(250,224,230,0.10); color: #E08FA1; }
[data-theme="dark"] .cat-fuel   { background: rgba(244,226,215,0.10); color: #D49574; }
[data-theme="dark"] .cat-health { background: rgba(220,238,231,0.10); color: #83C2AE; }
[data-theme="dark"] .cat-rent   { background: rgba(229,229,224,0.10); color: var(--ink-2); }

/* badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 999px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase;
}
.badge::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
}
.badge.ok    { background: rgba(15,138,95,0.10);  color: var(--ok); }
.badge.warn  { background: rgba(199,122,15,0.12); color: var(--warn); }
.badge.err   { background: rgba(192,57,43,0.10);  color: var(--err); }
.badge.idle  { background: var(--surface-2);     color: var(--ink-3); }
.badge.info  { background: rgba(31,111,235,0.10); color: var(--info); }

/* bottom nav */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 92px;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  display: flex; align-items: flex-start; justify-content: space-around;
  padding: 10px 12px 0;
  z-index: 10;
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 0;
  color: var(--ink-4);
  cursor: pointer; user-select: none;
  font-size: 10px; font-weight: 500;
  transition: color 0.15s ease;
}
.tab.active { color: var(--ink); }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab.active svg { stroke: var(--brand); }
.tab.active span { color: var(--brand); }

.fab-tab {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto; width: 52px; padding: 0;
}
.fab {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--brand); color: #fff;
  display: grid; place-items: center;
  box-shadow: 0 8px 22px rgba(15,138,95,0.4), 0 2px 4px rgba(15,138,95,0.3);
  transform: translateY(-12px);
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.4, 0.8, 0.4, 1), box-shadow 0.2s;
  border: none;
}
.fab:hover { transform: translateY(-15px) scale(1.04); }
.fab:active { transform: translateY(-10px) scale(0.96); }

/* sheet */
.scrim {
  position: absolute; inset: 0;
  background: rgba(10,10,8,0.32);
  backdrop-filter: blur(2px);
  z-index: 20;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--surface);
  border-radius: 28px 28px 0 0;
  z-index: 21;
  transform: translateY(100%);
  transition: transform 0.42s cubic-bezier(0.22, 1.2, 0.36, 1);
  box-shadow: 0 -10px 40px rgba(0,0,0,0.18);
  max-height: 90%;
  display: flex; flex-direction: column;
}
.sheet.open { transform: translateY(0); }
.sheet .grabber {
  width: 38px; height: 5px; border-radius: 3px;
  background: var(--ink-5);
  margin: 8px auto;
  flex-shrink: 0;
}

/* full-screen overlay (slides up over base screen) */
.overlay-screen {
  position: absolute; inset: 0;
  background: var(--bg);
  z-index: 25;
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0.2, 1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.overlay-screen.open { transform: translateY(0); }

/* toast */
.toast {
  position: absolute; left: 50%; bottom: 110px;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  z-index: 30;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease, transform 0.32s cubic-bezier(0.22, 1.2, 0.36, 1);
  box-shadow: var(--sh-3);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast .check {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--brand); color: #fff;
  display: grid; place-items: center; font-size: 11px;
}

/* keypad (used in quick-add) */
.keypad {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; padding: 10px 18px 14px;
}
.key {
  height: 52px; border-radius: 14px;
  background: var(--surface-2);
  font-size: 22px; font-weight: 500;
  display: grid; place-items: center;
  cursor: pointer; user-select: none;
  border: none; color: var(--ink);
  font-family: var(--font-sans);
  transition: background 0.12s, transform 0.1s;
}
.key:active { background: var(--surface-3); transform: scale(0.95); }

/* progress bar */
.progress {
  height: 8px; border-radius: 999px; background: var(--surface-3);
  overflow: hidden;
}
.progress > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--brand), color-mix(in srgb, var(--brand) 70%, white));
  border-radius: 999px;
  transition: width 1.2s cubic-bezier(0.4, 0.8, 0.4, 1);
}

/* monogram */
.monogram {
  width: 32px; height: 32px;
  border-radius: 9px;
  background: var(--ink); color: var(--bg);
  display: grid; place-items: center;
  font-weight: 700; font-size: 14px; letter-spacing: -0.02em;
  font-family: var(--font-display);
}
.monogram.brand { background: var(--brand); color: #fff; }

/* anim */
@keyframes fade-up {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fade-up 0.5s cubic-bezier(0.4, 0.8, 0.4, 1) both; }
.fade-up-1 { animation-delay: 0.05s; }
.fade-up-2 { animation-delay: 0.12s; }
.fade-up-3 { animation-delay: 0.20s; }
.fade-up-4 { animation-delay: 0.28s; }
.fade-up-5 { animation-delay: 0.36s; }
.fade-up-6 { animation-delay: 0.44s; }
.fade-up-7 { animation-delay: 0.52s; }

@keyframes draw {
  to { stroke-dashoffset: 0; }
}

/* lucide-ish icons via CSS */
.ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

</style>
<style>
  body { margin:0; background: #E8E8E3; font-family: 'Geist', system-ui, sans-serif; }
  [data-app-theme="dark"] body, body[data-app-theme="dark"] { background: #050505; }
  .stage {
    min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 28px 16px 60px;
    box-sizing: border-box;
    gap: 36px;
    flex-wrap: wrap;
  }
  .panel { display:flex; flex-direction: column; align-items: center; gap: 14px; }
  .panel-label {
    font-family: 'Geist', sans-serif;
    font-size: 12px; font-weight: 500;
    color: #6B6B66;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .top {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 16px 24px;
    display:flex; justify-content: space-between; align-items: center;
    pointer-events: none;
    z-index: 50;
  }
  .top > * { pointer-events: auto; }
  .brand-pill {
    display:flex; align-items:center; gap: 10px;
    padding: 8px 14px 8px 8px;
    background: #fff;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    font-family: 'Geist', sans-serif;
  }
  .brand-pill .mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: #0F8A5F; color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 13px;
  }
  .brand-pill .name { font-weight: 600; font-size: 14px; color: #131313; }
  .brand-pill .ver { font-family: 'Geist Mono', monospace; font-size: 11px; color: #6B6B66; padding-left: 8px; border-left: 1px solid rgba(0,0,0,0.08); margin-left:4px; }

  @keyframes blink { 50% { opacity: 0; } }

/* =============================================================
     Theme transition — cinematic lightsaber sequence (1500ms)
     0–120ms    Hilt materializes at click point
     120–330ms  Hilt glides to bottom-left as blade ignites horizontally
     330–480ms  Hold horizontal at bottom — peak bloom + camera shake
     480–1200ms Horizontal upward sweep — bottom→top, paints new theme behind
     1200–1350ms Blade retracts into hilt at top-left
     1350–1500ms Hilt fades out
     Theme state flips at 1200ms (sweep complete).
     Waypoints (--toLeftX, --toBotY, --toTopOnlyY) are computed in JS
     from click coords + frame bbox and passed as CSS vars.
     ============================================================= */
  .saber-stage {
    position: absolute; inset: 0; z-index: 9000;
    pointer-events: none; overflow: hidden; border-radius: inherit;
  }

  /* === Reveal band — new theme paints upward behind the blade === */
  .saber-reveal-band {
    position: absolute; inset: 0;
    background: var(--wipe);
    clip-path: inset(100% 0 0 0);
    will-change: clip-path;
    animation: revealBand 1500ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes revealBand {
    /* hidden through ignite, hold, down-translate, bottom anticipation */
    0%, 52%   { clip-path: inset(100% 0 0 0); opacity: 1; }
    /* upward sweep — band top rises from bottom to top */
    86%       { clip-path: inset(0% 0 0 0); opacity: 1; }
    /* hold fully-covered while underlying UI cross-fades */
    92%       { clip-path: inset(0% 0 0 0); opacity: 1; }
    /* dissolve the overlay so the cross-faded new theme bleeds through */
    100%      { clip-path: inset(0% 0 0 0); opacity: 0; }
  }

  /* === Saber rig — wraps hilt + blade, drives positional choreography === */
  .saber-rig {
    position: absolute;
    left: var(--cx, 50%); top: var(--cy, 50%);
    width: 0; height: 0;
    transform-origin: 0 0;
    opacity: 0;
    will-change: transform, opacity;
    animation: rigJourney 1500ms linear forwards;
  }
  @keyframes rigJourney {
    /* Phase 1 (0–8%): hilt materializes IN PLACE at the right edge,
       click-Y level. Spring overshoot on scale, no translation drift. */
      0% { opacity: 0; transform: translate(var(--toRightX), 0) rotate(0deg) scale(0.35);
           animation-timing-function: cubic-bezier(0.34, 1.4, 0.6, 1); }
      6% { opacity: 1; transform: translate(var(--toRightX), 0) rotate(0deg) scale(1.12); }
      8% { opacity: 1; transform: translate(var(--toRightX), 0) rotate(0deg) scale(1);
           animation-timing-function: cubic-bezier(0.35, 0.85, 0.3, 1); }
    /* Phase 2 (8–22%): beam FORMS — blade extends leftward from emitter
       across the full screen width. Rig stays put; only scaleX of blade animates. */
     22% { opacity: 1; transform: translate(var(--toRightX), 0) rotate(0deg) scale(1);
           animation-timing-function: cubic-bezier(0.4, 0, 0.5, 1); }
    /* Phase 3 (22–30%): hold horizontal — peak bloom moment */
     30% { opacity: 1; transform: translate(var(--toRightX), 0) rotate(0deg) scale(1);
           animation-timing-function: cubic-bezier(0.5, 0, 0.4, 1); }
    /* Phase 4 (30–46%): translate DOWN to bottom (still horizontal).
       Slight forward lean (+2°) sells the downward weight. */
     38% { transform: translate(var(--toRightX), calc(var(--toBotY) * 0.5)) rotate(2deg) scale(1);
           animation-timing-function: cubic-bezier(0.4, 0, 0.5, 1); }
     46% { transform: translate(var(--toRightX), var(--toBotY)) rotate(0.5deg) scale(1);
           animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
    /* Phase 5 (46–52%): anticipation hold at bottom, settles to neutral */
     52% { transform: translate(var(--toRightX), var(--toBotY)) rotate(0deg) scale(1);
           animation-timing-function: cubic-bezier(0.3, 0, 0.4, 1); }
    /* Phase 6 (52–86%): sweep UP to top — leading-edge lean (-3°) shows
       the blade slicing into upward motion; new theme reveals behind it. */

<script>
// Silence harmless ResizeObserver loop warnings (multiple channels — they
// arrive via window error event, console.error, and onerror inconsistently).
// Also wrap ResizeObserver itself with a rAF-debounce so the loop never
// fires "undelivered notifications" in the first place.
(() => {
  const RE = /ResizeObserver loop/;
  const isRO = (msg) => typeof msg === 'string' && RE.test(msg);
  window.addEventListener('error', (e) => {
    if (isRO(e.message) || isRO(e.error?.message)) {
      e.stopImmediatePropagation();
      e.preventDefault();
      return false;
    }
  }, true);
  window.onerror = (msg, src, line, col, err) => {
    if (isRO(msg) || isRO(err?.message)) return true;
  };
  const origErr = console.error;
  console.error = function(...args) {
    if (args.length && isRO(String(args[0]))) return;
    return origErr.apply(this, args);
  };
  const NativeRO = window.ResizeObserver;
  if (NativeRO) {
    window.ResizeObserver = class extends NativeRO {
      constructor(cb) {
        let raf = 0;
        super((entries, observer) => {
          if (raf) cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => { raf = 0; try { cb(entries, observer); } catch {} });
        });
      }
    };
  }
})();
</script>

<script type="text/babel" data-presets="react">
/* Gexpense — Money Flow (simple, at-a-glance) */
const { useState: useStateMF, useEffect: useEffectMF } = React;

const MoneyFlow = () => {
  const [drawn, setDrawn] = useStateMF(false);
  const [period, setPeriod] = useStateMF('Mo'); // 30d | Mo | Yr
  useEffectMF(() => { const t = setTimeout(() => setDrawn(true), 200); return () => clearTimeout(t); }, []);
  // re-trigger bar animation when period changes
  useEffectMF(() => { setDrawn(false); const t = setTimeout(() => setDrawn(true), 60); return () => clearTimeout(t); }, [period]);

  const data = {
    '30d': {
      label: 'last 30 days',
      totalIn: 153100, totalOut: 42180,
      incomes: [
        { k: 'Salary',    v: 142500, sub: 'Acme Corp' },
        { k: 'Freelance', v: 8400,   sub: 'Notion · contract' },
        { k: 'Cashback',  v: 2200,   sub: 'CRED rewards' },
      ],
      outflows: [
        { k: 'Food',          v: 13500, c: '#E07A5F' },
        { k: 'Rent',          v: 10000, c: 'var(--brand)' },
        { k: 'Travel',        v: 8400,  c: '#3D8FB7' },
        { k: 'Shopping',      v: 5900,  c: '#9B6BBF' },
        { k: 'Subscriptions', v: 3200,  c: '#D8A047' },
        { k: 'Other',         v: 1180,  c: 'var(--ink-3)' },
      ],
    },
    'Mo': {
      label: 'April · so far',
      totalIn: 153100, totalOut: 42180,
      incomes: [
        { k: 'Salary',    v: 142500, sub: 'Acme Corp' },
        { k: 'Freelance', v: 8400,   sub: 'Notion · contract' },
        { k: 'Cashback',  v: 2200,   sub: 'CRED rewards' },
      ],
      outflows: [
        { k: 'Food',          v: 13500, c: '#E07A5F' },
        { k: 'Rent',          v: 10000, c: 'var(--brand)' },
        { k: 'Travel',        v: 8400,  c: '#3D8FB7' },
        { k: 'Shopping',      v: 5900,  c: '#9B6BBF' },
        { k: 'Subscriptions', v: 3200,  c: '#D8A047' },
        { k: 'Other',         v: 1180,  c: 'var(--ink-3)' },
      ],
    },
    'Yr': {
      label: '2026 · YTD',
      totalIn: 612400, totalOut: 184820,
      incomes: [
        { k: 'Salary',    v: 570000, sub: 'Acme Corp · 4 mo' },
        { k: 'Freelance', v: 33600,  sub: 'Notion + Linear' },
        { k: 'Cashback',  v: 8800,   sub: 'CRED + Cred Pay' },
      ],
      outflows: [
        { k: 'Rent',          v: 40000, c: 'var(--brand)' },
        { k: 'Food',          v: 52400, c: '#E07A5F' },
        { k: 'Travel',        v: 38600, c: '#3D8FB7' },
        { k: 'Shopping',      v: 21400, c: '#9B6BBF' },
        { k: 'Subscriptions', v: 12800, c: '#D8A047' },
        { k: 'Other',         v: 19620, c: 'var(--ink-3)' },
      ],
    },
  };
  const { label: periodLabel, totalIn, totalOut, incomes, outflows } = data[period];
  const totalSaved = totalIn - totalOut;
  const savedPct = Math.round((totalSaved / totalIn) * 100);
  const spentPct = 100 - savedPct;

  return (
    <div className="card fade-up fade-up-3" style={{padding:18, marginBottom:14}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:14}}>
        <div>
          <div className="label">Money flow · {periodLabel}</div>

          <Chip active={period==='Yr'} onClick={() => setPeriod('Yr')}>Yr</Chip>
        </div>
      </div>

      {/* In → Out totals */}
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
        <div>
          <div className="label" style={{color:'var(--ok)', display:'flex', alignItems:'center', gap:5}}>

        <div style={{textAlign:'right'}}>
          <div className="label" style={{color:'var(--err)', display:'flex', alignItems:'center', gap:5, justifyContent:'flex-end'}}>
            Money out <Icon name="arrowDn" size={11} stroke={2.5}/>
          </div>
          <div className="tabular" style={{fontSize:18, fontWeight:600, marginTop:2}}>₹{totalOut.toLocaleString('en-IN')}</div>
        </div>
      </div>

      {/* Single split bar — Saved | Spent */}
      <div style={{position:'relative', height:36, borderRadius:10, overflow:'hidden', display:'flex', background:'var(--surface-2)'}}>
        <div style={{
          width: drawn ? `${savedPct}%` : '0%',
          background: 'var(--ok)',
          transition: 'width 1.0s cubic-bezier(0.4, 0.8, 0.4, 1)',
          display:'flex', alignItems:'center', paddingLeft:12, color:'#fff', fontSize:12, fontWeight:600
        }}>
          {drawn && savedPct >= 18 && <span>Saved {savedPct}%</span>}
        </div>
        <div style={{
          width: drawn ? `${spentPct}%` : '0%',
          background: 'var(--ink)',
          transition: 'width 1.0s cubic-bezier(0.4, 0.8, 0.4, 1) 0.1s',
          display:'flex', alignItems:'center', justifyContent:'flex-end', paddingRight:12, color:'#fff', fontSize:12, fontWeight:600
        }}>
          {drawn && spentPct >= 14 && <span>Spent {spentPct}%</span>}
        </div>
      </div>
      <div style={{display:'flex', justifyContent:'space-between', marginTop:6, padding:'0 2px'}}>
        <span className="small mono tabular" style={{color:'var(--ok)'}}>₹{(totalSaved/1000).toFixed(1)}k saved</span>
        <span className="small mono tabular" style={{color:'var(--ink-2)'}}>₹{(totalOut/1000).toFixed(1)}k spent</span>
      </div>

      {/* Top sources & sinks */}
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginTop:18, paddingTop:14, borderTop:'1px solid var(--line)'}}>
        {/* In sources */}
        <div>
          <div className="label" style={{marginBottom:8, display:'flex', alignItems:'center', gap:5}}>
            <span style={{width:6, height:6, borderRadius:'50%', background:'var(--ok)'}}/> Where it came from
          </div>
          {incomes.map((i, idx) => {
            const pct = Math.round((i.v / totalIn) * 100);
            return (
              <div key={i.k} style={{marginBottom:10, opacity: drawn ? 1 : 0, transition:`opacity 0.4s ease ${0.3 + idx*0.08}s`}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:3}}>
                  <span style={{fontSize:12, fontWeight:600}}>{i.k}</span>
                  <span className="mono tabular" style={{fontSize:11, color:'var(--ink-2)'}}>₹{(i.v/1000).toFixed(1)}k</span>
                </div>
                <div style={{height:4, borderRadius:2, background:'var(--surface-2)', overflow:'hidden'}}>
                  <div style={{width: drawn ? `${pct}%` : '0%', height:'100%', background:'var(--ok)', transition:`width 0.8s cubic-bezier(0.4, 0.8, 0.4, 1) ${0.3 + idx*0.08}s`}}/>
                </div>
              </div>
            );
          })}
        </div>

        {/* Out sinks (top 4) */}
        <div>
          <div className="label" style={{marginBottom:8, display:'flex', alignItems:'center', gap:5}}>
            <span style={{width:6, height:6, borderRadius:'50%', background:'var(--ink)'}}/> Where it went
          </div>
          {outflows.slice(0, 4).map((o, idx) => {
            const pct = Math.round((o.v / totalOut) * 100);
            return (
              <div key={o.k} style={{marginBottom:10, opacity: drawn ? 1 : 0, transition:`opacity 0.4s ease ${0.5 + idx*0.06}s`}}>

<script>

  window.addEventListener('load', () => {

<div id="pwa-install-sheet" style="
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:99999;
  background:var(--surface,#fff); border-radius:22px 22px 0 0;
  box-shadow:0 -4px 32px rgba(0,0,0,0.14); padding:0 0 env(safe-area-inset-bottom,16px);
  font-family:'Geist',system-ui,sans-serif;
">
  <div style="width:36px;height:4px;border-radius:2px;background:var(--line,rgba(0,0,0,0.12));margin:12px auto 0;"></div>
  <div style="padding:20px 24px 24px;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
      <div style="width:48px;height:48px;border-radius:12px;background:#0F8A5F;display:grid;place-items:center;flex-shrink:0;">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><text x="4" y="20" fill="white" font-size="18" font-weight="700" font-family="Geist,system-ui">G</text></svg>
      </div>
      <div>
        <div style="font-size:17px;font-weight:700;color:var(--ink,#131313);">Add Gexpense to Home Screen</div>
        <div style="font-size:13px;color:var(--ink-3,#6B6B66);margin-top:2px;">Install for fast, app-like access</div>
      </div>
    </div>
    <div id="pwa-steps" style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;"></div>
    <button id="pwa-dismiss" style="
      width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line,rgba(0,0,0,0.1));
      background:transparent;font-size:15px;font-weight:600;color:var(--ink-2,#3D3D3B);
      cursor:pointer;font-family:inherit;
    ">Maybe Later</button>
  </div>
</div>
<div id="pwa-scrim" style="display:none;position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,0.4);"></div>

<script>
(function() {
  var DISMISSED_KEY = 'gx_install_dismissed';
  var sheet = document.getElementById('pwa-install-sheet');
  var scrim = document.getElementById('pwa-scrim');
  var stepsEl = document.getElementById('pwa-steps');
  var btn = document.getElementById('pwa-dismiss');

  // Don't show if standalone (already installed) or dismissed
  if (window.matchMedia('(display-mode: standalone)').matches) return;
  if (window.navigator.standalone) return;
  if (sessionStorage.getItem(DISMISSED_KEY)) return;

  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isAndroid = /Android/i.test(ua);
  if (!isIOS && !isAndroid) return;

  function makeStep(num, icon, text) {
    return '<div style="display:flex;align-items:flex-start;gap:12px;">'
      + '<div style="width:28px;height:28px;border-radius:50%;background:var(--brand-50,rgba(15,138,95,0.10));'
      + 'color:#0F8A5F;font-size:13px;font-weight:700;display:grid;place-items:center;flex-shrink:0;">' + num + '</div>'
      + '<div style="padding-top:4px;">'
      + '<div style="font-size:14px;font-weight:600;color:var(--ink,#131313);">' + icon + '</div>'
      + '<div style="font-size:13px;color:var(--ink-3,#6B6B66);margin-top:2px;">' + text + '</div>'
      + '</div></div>';
  }

  var steps = '';
  if (isIOS) {
    steps += makeStep('1', 'Tap the Share button ⬆', 'The box-with-arrow icon at the bottom of Safari');
    steps += makeStep('2', 'Scroll down and tap "Add to Home Screen"', 'Look for the + icon in the share sheet');
    steps += makeStep('3', 'Tap "Add" in the top-right corner', 'Gexpense will appear on your home screen');
  } else {
    steps += makeStep('1', 'Tap the menu button ⋮', 'Three dots in the top-right corner of Chrome');
    steps += makeStep('2', 'Tap "Add to Home screen" or "Install app"', 'Usually near the top of the menu');
    steps += makeStep('3', 'Tap "Add" or "Install" to confirm', 'Gexpense will appear on your home screen');
  }
  stepsEl.innerHTML = steps;

  function close() {
    sessionStorage.setItem(DISMISSED_KEY, '1');
    sheet.style.display = 'none';
    scrim.style.display = 'none';
  }

  btn.addEventListener('click', close);
  scrim.addEventListener('click', close);

  // Android: use native install prompt if available
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    // Replace steps with native prompt button
    stepsEl.innerHTML = '<div style="font-size:14px;color:var(--ink-2,#3D3D3B);">Your browser supports one-tap installation.</div>';
    btn.textContent = 'Install App';
    btn.style.background = '#0F8A5F';
    btn.style.color = '#fff';
    btn.style.border = 'none';
    btn.removeEventListener('click', close);
    btn.addEventListener('click', function() {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function() { close(); });
    });
  });

  // Show after short delay so the app has rendered
  setTimeout(function() {
    sheet.style.display = 'block';
    scrim.style.display = 'block';
    sheet.style.transform = 'translateY(100%)';
    sheet.style.transition = 'transform 0.35s cubic-bezier(0.4,0,0.2,1)';
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        sheet.style.transform = 'translateY(0)';
      });
    });
  }, 1800);
})();
</script>

</body>
</html>
