<html lang="en">
<head>

<style id="tokens">
/* Gexpense Hi-Fi — design tokens */
@keyframes tickerFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes spin { to { transform: rotate(360deg); } }
.ticker-msg { animation: tickerFade 0.45s cubic-bezier(0.4,0.8,0.4,1); }
:root {
  /* brand */
  --brand: #0F8A5F;
  --brand-600: #0B6E4B;
  --brand-700: #095636;
  --brand-50: #E6F4EE;
  --brand-100: #C7E7D8;
  --brand-soft: rgba(15, 138, 95, 0.10);
  --brand-glow: 0 0 0 4px rgba(15, 138, 95, 0.18);

  /* surfaces — light */
  --bg: #F7F7F4;
  --surface: #FFFFFF;
  --surface-2: #F2F2EE;
  --surface-3: #ECECE7;
  --line: rgba(20, 20, 18, 0.08);
  --line-strong: rgba(20, 20, 18, 0.16);

  /* ink */
  --ink: #131313;
  --ink-2: #3D3D3B;
  --ink-3: #6B6B66;
  --ink-4: #A1A19A;
  --ink-5: #C9C9C2;
  --paper: #FFFFFF;

  /* state */
  --ok: #0F8A5F;
  --warn: #C77A0F;
  --err: #C0392B;
  --info: #1F6FEB;

  /* radii */
  --r-sm: 8px;
  --r: 12px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;

  /* shadow */
  --sh-1: 0 1px 2px rgba(20,20,18,0.04), 0 1px 1px rgba(20,20,18,0.04);
  --sh-2: 0 4px 14px rgba(20,20,18,0.06), 0 1px 2px rgba(20,20,18,0.04);
  --sh-3: 0 18px 40px rgba(20,20,18,0.10), 0 4px 10px rgba(20,20,18,0.06);

  /* type */
  --font-sans: 'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono: 'Geist Mono', 'JetBrains Mono', ui-monospace, monospace;
  --font-display: 'Geist', 'Inter', system-ui, sans-serif;
}

[data-theme="dark"] {
  --bg: #0B0B0C;
  --surface: #141416;
  --surface-2: #1B1B1E;
  --surface-3: #232327;
  --line: rgba(255,255,255,0.07);
  --line-strong: rgba(255,255,255,0.14);

  --ink: #F4F4F1;
  --ink-2: #D4D4CF;
  --ink-3: #9C9C95;
  --ink-4: #6E6E68;
  --ink-5: #3F3F3B;
  --paper: #131313;

  --brand: #2DBF87;
  --brand-600: #25A372;
  --brand-700: #1E8A5F;
  --brand-50: rgba(45, 191, 135, 0.12);
  --brand-100: rgba(45, 191, 135, 0.22);
  --brand-soft: rgba(45, 191, 135, 0.14);

  --sh-1: 0 1px 2px rgba(0,0,0,0.4);
  --sh-2: 0 4px 14px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.4);
  --sh-3: 0 18px 40px rgba(0,0,0,0.55), 0 4px 10px rgba(0,0,0,0.4);
}

/* base */
* { box-sizing: border-box; }
.app, .app * { font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
.mono { font-family: var(--font-mono); }

/* phone canvas */
.phone {
  width: 390px;
  height: 844px;
  background: var(--bg);
  color: var(--ink);
  border-radius: 48px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--sh-3), inset 0 0 0 1px var(--line);
  display: flex; flex-direction: column;
  transition: background 0.32s cubic-bezier(0.4,0.8,0.4,1), color 0.32s cubic-bezier(0.4,0.8,0.4,1);
}
.phone *, .phone *::before, .phone *::after {
  transition: background-color 0.32s cubic-bezier(0.4,0.8,0.4,1), border-color 0.32s cubic-bezier(0.4,0.8,0.4,1), color 0.32s cubic-bezier(0.4,0.8,0.4,1);
}
.phone .scroll {
  flex: 1; overflow-y: auto;
  padding-bottom: 110px;
  scroll-behavior: smooth;
}
.phone .scroll::-webkit-scrollbar { display: none; }

/* status bar */
.statusbar {
  height: 44px;
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 24px;
  font-family: var(--font-sans);
  font-size: 14px; font-weight: 600;
  color: var(--ink);
  flex-shrink: 0;
  position: relative; z-index: 5;
}
.statusbar .icons { display: flex; gap: 5px; align-items: center; }

/* shared building blocks */
.card {
  background: var(--surface);
  border-radius: var(--r-md);
  box-shadow: var(--sh-1);
  border: 1px solid var(--line);
}

.label {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-3);
  font-weight: 500;
}

.h1 { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.15; }
.h3 { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.body { font-size: 14px; line-height: 1.4; color: var(--ink-2); }
.small { font-size: 12px; color: var(--ink-3); }
.tabular { font-variant-numeric: tabular-nums; }

.btn {
  appearance: none; border: none; cursor: pointer;
  font-family: var(--font-sans); font-weight: 600;
  border-radius: 999px; padding: 12px 18px; font-size: 14px;
  transition: transform 0.15s ease, background 0.2s ease, box-shadow 0.2s ease;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 4px 14px rgba(15,138,95,0.25); }
.btn-primary:hover { background: var(--brand-600); }
.btn-ghost { background: var(--surface-2); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-3); }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 500;
  background: var(--surface-2); color: var(--ink-2);
  border: 1px solid var(--line);
  cursor: pointer; user-select: none;
  transition: background 0.15s ease, color 0.15s ease;
}
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip.brand { background: var(--brand-50); color: var(--brand); border-color: transparent; }
.chip.brand.on { background: var(--brand); color: #fff; }

.toggle {
  width: 44px; height: 26px; border-radius: 999px;
  background: var(--surface-3); position: relative; cursor: pointer;
  transition: background 0.2s ease;
  flex-shrink: 0;
}
.toggle::after {
  content: ''; position: absolute; top: 3px; left: 3px;
  width: 20px; height: 20px; border-radius: 50%;
  background: #fff; box-shadow: var(--sh-1);
  transition: left 0.22s cubic-bezier(0.4, 0.8, 0.4, 1);
}
.toggle.on { background: var(--brand); }
.toggle.on::after { left: 21px; }

.divider { height: 1px; background: var(--line); margin: 12px 0; }

/* category swatches */
.cat {
  width: 40px; height: 40px;
  border-radius: 12px;
  display: grid; place-items: center;
  flex-shrink: 0;
  font-size: 18px;
}
.cat-food   { background: #FEEAD7; color: #B6510D; }
.cat-travel { background: #DCEAFB; color: #1F4FA8; }
.cat-shop   { background: #EDE3FB; color: #5530A8; }
.cat-bills  { background: #E0F2EE; color: #0B6E4B; }
.cat-coffee { background: #F1E4D5; color: #6B4220; }
.cat-grocery{ background: #E5F1D8; color: #4F7218; }
.cat-subs   { background: #FAE0E6; color: #A02446; }
.cat-fuel   { background: #F4E2D7; color: #8C3A14; }
.cat-health { background: #DCEEE7; color: #1A6B53; }
.cat-rent   { background: #E5E5E0; color: #2A2A28; }

[data-theme="dark"] .cat-food   { background: rgba(254,234,215,0.10); color: #F0B583; }
[data-theme="dark"] .cat-travel { background: rgba(220,234,251,0.10); color: #84B0EE; }
[data-theme="dark"] .cat-shop   { background: rgba(237,227,251,0.10); color: #B79BEE; }
[data-theme="dark"] .cat-bills  { background: rgba(224,242,238,0.10); color: var(--brand); }
[data-theme="dark"] .cat-coffee { background: rgba(241,228,213,0.10); color: #C9A37C; }
[data-theme="dark"] .cat-grocery{ background: rgba(229,241,216,0.10); color: #B6CC85; }
[data-theme="dark"] .cat-subs   { background: rgba(250,224,230,0.10); color: #E08FA1; }
[data-theme="dark"] .cat-fuel   { background: rgba(244,226,215,0.10); color: #D49574; }
[data-theme="dark"] .cat-health { background: rgba(220,238,231,0.10); color: #83C2AE; }
[data-theme="dark"] .cat-rent   { background: rgba(229,229,224,0.10); color: var(--ink-2); }

/* badges */
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 8px; border-radius: 999px;
  font-family: var(--font-mono); font-size: 10px; font-weight: 600;
  letter-spacing: 0.04em; text-transform: uppercase;
}
.badge::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor;
}
.badge.ok    { background: rgba(15,138,95,0.10);  color: var(--ok); }
.badge.warn  { background: rgba(199,122,15,0.12); color: var(--warn); }
.badge.err   { background: rgba(192,57,43,0.10);  color: var(--err); }
.badge.idle  { background: var(--surface-2);     color: var(--ink-3); }
.badge.info  { background: rgba(31,111,235,0.10); color: var(--info); }

/* bottom nav */
.tabbar {
  position: absolute; left: 0; right: 0; bottom: 0;
  height: 92px;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter: blur(20px);
  border-top: 1px solid var(--line);
  display: flex; align-items: flex-start; justify-content: space-around;
  padding: 10px 12px 0;
  z-index: 10;
}
.tab {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 6px 0;
  color: var(--ink-4);
  cursor: pointer; user-select: none;
  font-size: 10px; font-weight: 500;
  transition: color 0.15s ease;
}
.tab.active { color: var(--ink); }
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tab.active svg { stroke: var(--brand); }
.tab.active span { color: var(--brand); }

.fab-tab {
  position: relative;
  display: flex; align-items: center; justify-content: center;
  flex: 0 0 auto; width: 52px; padding: 0;
}
.fab {
  width: 52px; height: 52px; border-radius: 50%;
  background: var(--brand); color: #fff;
  display: grid; place-items: center;
  box-shadow: 0 8px 22px rgba(15,138,95,0.4), 0 2px 4px rgba(15,138,95,0.3);
  transform: translateY(-12px);
  cursor: pointer;
  transition: transform 0.18s cubic-bezier(0.4, 0.8, 0.4, 1), box-shadow 0.2s;
  border: none;
}
.fab:hover { transform: translateY(-15px) scale(1.04); }
.fab:active { transform: translateY(-10px) scale(0.96); }

/* sheet */
.scrim {
  position: absolute; inset: 0;
  background: rgba(10,10,8,0.32);
  backdrop-filter: blur(2px);
  z-index: 20;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease;
}
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: var(--surface);
  border-radius: 28px 28px 0 0;
  z-index: 21;
  transform: translateY(100%);
  transition: transform 0.42s cubic-bezier(0.22, 1.2, 0.36, 1);
  box-shadow: 0 -10px 40px rgba(0,0,0,0.18);
  max-height: 90%;
  display: flex; flex-direction: column;
}
.sheet.open { transform: translateY(0); }
.sheet .grabber {
  width: 38px; height: 5px; border-radius: 3px;
  background: var(--ink-5);
  margin: 8px auto;
  flex-shrink: 0;
}

/* full-screen overlay (slides up over base screen) */
.overlay-screen {
  position: absolute; inset: 0;
  background: var(--bg);
  z-index: 25;
  transform: translateY(100%);
  transition: transform 0.32s cubic-bezier(0.32, 0.72, 0.2, 1);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.overlay-screen.open { transform: translateY(0); }

/* toast */
.toast {
  position: absolute; left: 50%; bottom: 110px;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 999px;
  font-size: 13px; font-weight: 500;
  display: flex; align-items: center; gap: 8px;
  z-index: 30;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s ease, transform 0.32s cubic-bezier(0.22, 1.2, 0.36, 1);
  box-shadow: var(--sh-3);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast .check {
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--brand); color: #fff;
  display: grid; place-items: center; font-size: 11px;
}

/* keypad (used in quick-add) */
.keypad {
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; padding: 10px 18px 14px;
}
.key {
  height: 52px; border-radius: 14px;
  background: var(--surface-2);
  font-size: 22px; font-weight: 500;
  display: grid; place-items: center;
  cursor: pointer; user-select: none;
  border: none; color: var(--ink);
  font-family: var(--font-sans);
  transition: background 0.12s, transform 0.1s;
}
.key:active { background: var(--surface-3); transform: scale(0.95); }

/* progress bar */
.progress {
  height: 8px; border-radius: 999px; background: var(--surface-3);
  overflow: hidden;
}
.progress > i {
  display: block; height: 100%;
  background: linear-gradient(90deg, var(--brand), color-mix(in srgb, var(--brand) 70%, white));
  border-radius: 999px;
  transition: width 1.2s cubic-bezier(0.4, 0.8, 0.4, 1);
}

/* monogram */
.monogram {
  width: 32px; height: 32px;
  border-radius: 9px;
  background: var(--ink); color: var(--bg);
  display: grid; place-items: center;
  font-weight: 700; font-size: 14px; letter-spacing: -0.02em;
  font-family: var(--font-display);
}
.monogram.brand { background: var(--brand); color: #fff; }

/* anim */
@keyframes fade-up {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}
.fade-up { animation: fade-up 0.5s cubic-bezier(0.4, 0.8, 0.4, 1) both; }
.fade-up-1 { animation-delay: 0.05s; }
.fade-up-2 { animation-delay: 0.12s; }
.fade-up-3 { animation-delay: 0.20s; }
.fade-up-4 { animation-delay: 0.28s; }
.fade-up-5 { animation-delay: 0.36s; }
.fade-up-6 { animation-delay: 0.44s; }
.fade-up-7 { animation-delay: 0.52s; }

@keyframes draw {
  to { stroke-dashoffset: 0; }
}

/* lucide-ish icons via CSS */
.ico { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

</style>
<style>
  body { margin:0; background: #E8E8E3; font-family: 'Geist', system-ui, sans-serif; }
  [data-app-theme="dark"] body, body[data-app-theme="dark"] { background: #050505; }
  .stage {
    min-height: 100vh;
    display: flex; align-items: flex-start; justify-content: center;
    padding: 28px 16px 60px;
    box-sizing: border-box;
    gap: 36px;
    flex-wrap: wrap;
  }
  .panel { display:flex; flex-direction: column; align-items: center; gap: 14px; }
  .panel-label {
    font-family: 'Geist', sans-serif;
    font-size: 12px; font-weight: 500;
    color: #6B6B66;
    letter-spacing: 0.04em; text-transform: uppercase;
  }
  .top {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 16px 24px;
    display:flex; justify-content: space-between; align-items: center;
    pointer-events: none;
    z-index: 50;
  }
  .top > * { pointer-events: auto; }
  .brand-pill {
    display:flex; align-items:center; gap: 10px;
    padding: 8px 14px 8px 8px;
    background: #fff;
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    font-family: 'Geist', sans-serif;
  }
  .brand-pill .mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: #0F8A5F; color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 13px;
  }
  .brand-pill .name { font-weight: 600; font-size: 14px; color: #131313; }
  .brand-pill .ver { font-family: 'Geist Mono', monospace; font-size: 11px; color: #6B6B66; padding-left: 8px; border-left: 1px solid rgba(0,0,0,0.08); margin-left:4px; }

  @keyframes blink { 50% { opacity: 0; } }

/* =============================================================
     Theme transition — cinematic lightsaber sequence (1500ms)
     0–120ms    Hilt materializes at click point
     120–330ms  Hilt glides to bottom-left as blade ignites horizontally
     330–480ms  Hold horizontal at bottom — peak bloom + camera shake
     480–1200ms Horizontal upward sweep — bottom→top, paints new theme behind
     1200–1350ms Blade retracts into hilt at top-left
     1350–1500ms Hilt fades out
     Theme state flips at 1200ms (sweep complete).
     Waypoints (--toLeftX, --toBotY, --toTopOnlyY) are computed in JS
     from click coords + frame bbox and passed as CSS vars.
     ============================================================= */
  .saber-stage {
    position: absolute; inset: 0; z-index: 9000;
    pointer-events: none; overflow: hidden; border-radius: inherit;
  }

  /* === Reveal band — new theme paints upward behind the blade === */
  .saber-reveal-band {
    position: absolute; inset: 0;
    background: var(--wipe);
    clip-path: inset(100% 0 0 0);
    will-change: clip-path;
    animation: revealBand 1500ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
  }
  @keyframes revealBand {
    /* hidden through ignite, hold, down-translate, bottom anticipation */
    0%, 52%   { clip-path: inset(100% 0 0 0); opacity: 1; }
    /* upward sweep — band top rises from bottom to top */
    86%       { clip-path: inset(0% 0 0 0); opacity: 1; }
    /* hold fully-covered while underlying UI cross-fades */
    92%       { clip-path: inset(0% 0 0 0); opacity: 1; }
    /* dissolve the overlay so the cross-faded new theme bleeds through */
    100%      { clip-path: inset(0% 0 0 0); opacity: 0; }
  }

  /* === Saber rig — wraps hilt + blade, drives positional choreography === */
  .saber-rig {
    position: absolute;
    left: var(--cx, 50%); top: var(--cy, 50%);
    width: 0; height: 0;
    transform-origin: 0 0;
    opacity: 0;
    will-change: transform, opacity;
    animation: rigJourney 1500ms linear forwards;
  }
  @keyframes rigJourney {
    /* Phase 1 (0–8%): hilt materializes IN PLACE at the right edge,
       click-Y level. Spring overshoot on scale, no translation drift. */
      0% { opacity: 0; transform: translate(var(--toRightX), 0) rotate(0deg) scale(0.35);
           animation-timing-function: cubic-bezier(0.34, 1.4, 0.6, 1); }
      6% { opacity: 1; transform: translate(var(--toRightX), 0) rotate(0deg) scale(1.12); }
      8% { opacity: 1; transform: translate(var(--toRightX), 0) rotate(0deg) scale(1);
           animation-timing-function: cubic-bezier(0.35, 0.85, 0.3, 1); }
    /* Phase 2 (8–22%): beam FORMS — blade extends leftward from emitter
       across the full screen width. Rig stays put; only scaleX of blade animates. */
     22% { opacity: 1; transform: translate(var(--toRightX), 0) rotate(0deg) scale(1);
           animation-timing-function: cubic-bezier(0.4, 0, 0.5, 1); }
    /* Phase 3 (22–30%): hold horizontal — peak bloom moment */
     30% { opacity: 1; transform: translate(var(--toRightX), 0) rotate(0deg) scale(1);
           animation-timing-function: cubic-bezier(0.5, 0, 0.4, 1); }
    /* Phase 4 (30–46%): translate DOWN to bottom (still horizontal).
       Slight forward lean (+2°) sells the downward weight. */
     38% { transform: translate(var(--toRightX), calc(var(--toBotY) * 0.5)) rotate(2deg) scale(1);
           animation-timing-function: cubic-bezier(0.4, 0, 0.5, 1); }
     46% { transform: translate(var(--toRightX), var(--toBotY)) rotate(0.5deg) scale(1);
           animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
    /* Phase 5 (46–52%): anticipation hold at bottom, settles to neutral */
     52% { transform: translate(var(--toRightX), var(--toBotY)) rotate(0deg) scale(1);
           animation-timing-function: cubic-bezier(0.3, 0, 0.4, 1); }
    /* Phase 6 (52–86%): sweep UP to top — leading-edge lean (-3°) shows
       the blade slicing into upward motion; new theme reveals behind it. */

<script>
// Silence harmless ResizeObserver loop warnings (multiple channels — they
// arrive via window error event, console.error, and onerror inconsistently).
// Also wrap ResizeObserver itself with a rAF-debounce so the loop never
// fires "undelivered notifications" in the first place.
(() => {
  const RE = /ResizeObserver loop/;
  const isRO = (msg) => typeof msg === 'string' && RE.test(msg);
  window.addEventListener('error', (e) => {
    if (isRO(e.message) || isRO(e.error?.message)) {
      e.stopImmediatePropagation();
      e.preventDefault();
      return false;
    }
  }, true);
  window.onerror = (msg, src, line, col, err) => {
    if (isRO(msg) || isRO(err?.message)) return true;
  };
  const origErr = console.error;
  console.error = function(...args) {
    if (args.length && isRO(String(args[0]))) return;
    return origErr.apply(this, args);
  };
  const NativeRO = window.ResizeObserver;
  if (NativeRO) {
    window.ResizeObserver = class extends NativeRO {
      constructor(cb) {
        let raf = 0;
        super((entries, observer) => {
          if (raf) cancelAnimationFrame(raf);
          raf = requestAnimationFrame(() => { raf = 0; try { cb(entries, observer); } catch {} });
        });
      }
    };
  }
})();
</script>

<script type="text/babel" data-presets="react">
/* Gexpense — Money Flow (simple, at-a-glance) */
const { useState: useStateMF, useEffect: useEffectMF } = React;

const MoneyFlow = () => {
  const [drawn, setDrawn] = useStateMF(false);
  const [period, setPeriod] = useStateMF('Mo'); // 30d | Mo | Yr
  useEffectMF(() => { const t = setTimeout(() => setDrawn(true), 200); return () => clearTimeout(t); }, []);
  // re-trigger bar animation when period changes
  useEffectMF(() => { setDrawn(false); const t = setTimeout(() => setDrawn(true), 60); return () => clearTimeout(t); }, [period]);

  const data = {
    '30d': {
      label: 'last 30 days',
      totalIn: 153100, totalOut: 42180,
      incomes: [
        { k: 'Salary',    v: 142500, sub: 'Acme Corp' },
        { k: 'Freelance', v: 8400,   sub: 'Notion · contract' },
        { k: 'Cashback',  v: 2200,   sub: 'CRED rewards' },
      ],
      outflows: [
        { k: 'Food',          v: 13500, c: '#E07A5F' },
        { k: 'Rent',          v: 10000, c: 'var(--brand)' },
        { k: 'Travel',        v: 8400,  c: '#3D8FB7' },
        { k: 'Shopping',      v: 5900,  c: '#9B6BBF' },
        { k: 'Subscriptions', v: 3200,  c: '#D8A047' },
        { k: 'Other',         v: 1180,  c: 'var(--ink-3)' },
      ],
    },
    'Mo': {
      label: 'April · so far',
      totalIn: 153100, totalOut: 42180,
      incomes: [
        { k: 'Salary',    v: 142500, sub: 'Acme Corp' },
        { k: 'Freelance', v: 8400,   sub: 'Notion · contract' },
        { k: 'Cashback',  v: 2200,   sub: 'CRED rewards' },
      ],
      outflows: [
        { k: 'Food',          v: 13500, c: '#E07A5F' },
        { k: 'Rent',          v: 10000, c: 'var(--brand)' },
        { k: 'Travel',        v: 8400,  c: '#3D8FB7' },
        { k: 'Shopping',      v: 5900,  c: '#9B6BBF' },
        { k: 'Subscriptions', v: 3200,  c: '#D8A047' },
        { k: 'Other',         v: 1180,  c: 'var(--ink-3)' },
      ],
    },
    'Yr': {
      label: '2026 · YTD',
      totalIn: 612400, totalOut: 184820,
      incomes: [
        { k: 'Salary',    v: 570000, sub: 'Acme Corp · 4 mo' },
        { k: 'Freelance', v: 33600,  sub: 'Notion + Linear' },
        { k: 'Cashback',  v: 8800,   sub: 'CRED + Cred Pay' },
      ],
      outflows: [
        { k: 'Rent',          v: 40000, c: 'var(--brand)' },
        { k: 'Food',          v: 52400, c: '#E07A5F' },
        { k: 'Travel',        v: 38600, c: '#3D8FB7' },
        { k: 'Shopping',      v: 21400, c: '#9B6BBF' },
        { k: 'Subscriptions', v: 12800, c: '#D8A047' },
        { k: 'Other',         v: 19620, c: 'var(--ink-3)' },
      ],
    },
  };
  const { label: periodLabel, totalIn, totalOut, incomes, outflows } = data[period];
  const totalSaved = totalIn - totalOut;
  const savedPct = Math.round((totalSaved / totalIn) * 100);
  const spentPct = 100 - savedPct;

  return (
    <div className="card fade-up fade-up-3" style={{padding:18, marginBottom:14}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:14}}>
        <div>
          <div className="label">Money flow · {periodLabel}</div>

          <Chip active={period==='Yr'} onClick={() => setPeriod('Yr')}>Yr</Chip>
        </div>
      </div>

      {/* In → Out totals */}
      <div style={{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14}}>
        <div>
          <div className="label" style={{color:'var(--ok)', display:'flex', alignItems:'center', gap:5}}>

        <div style={{textAlign:'right'}}>
          <div className="label" style={{color:'var(--err)', display:'flex', alignItems:'center', gap:5, justifyContent:'flex-end'}}>
            Money out <Icon name="arrowDn" size={11} stroke={2.5}/>
          </div>
          <div className="tabular" style={{fontSize:18, fontWeight:600, marginTop:2}}>₹{totalOut.toLocaleString('en-IN')}</div>
        </div>
      </div>

      {/* Single split bar — Saved | Spent */}
      <div style={{position:'relative', height:36, borderRadius:10, overflow:'hidden', display:'flex', background:'var(--surface-2)'}}>
        <div style={{
          width: drawn ? `${savedPct}%` : '0%',
          background: 'var(--ok)',
          transition: 'width 1.0s cubic-bezier(0.4, 0.8, 0.4, 1)',
          display:'flex', alignItems:'center', paddingLeft:12, color:'#fff', fontSize:12, fontWeight:600
        }}>
          {drawn && savedPct >= 18 && <span>Saved {savedPct}%</span>}
        </div>
        <div style={{
          width: drawn ? `${spentPct}%` : '0%',
          background: 'var(--ink)',
          transition: 'width 1.0s cubic-bezier(0.4, 0.8, 0.4, 1) 0.1s',
          display:'flex', alignItems:'center', justifyContent:'flex-end', paddingRight:12, color:'#fff', fontSize:12, fontWeight:600
        }}>
          {drawn && spentPct >= 14 && <span>Spent {spentPct}%</span>}
        </div>
      </div>
      <div style={{display:'flex', justifyContent:'space-between', marginTop:6, padding:'0 2px'}}>
        <span className="small mono tabular" style={{color:'var(--ok)'}}>₹{(totalSaved/1000).toFixed(1)}k saved</span>
        <span className="small mono tabular" style={{color:'var(--ink-2)'}}>₹{(totalOut/1000).toFixed(1)}k spent</span>
      </div>

      {/* Top sources & sinks */}
      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginTop:18, paddingTop:14, borderTop:'1px solid var(--line)'}}>
        {/* In sources */}
        <div>
          <div className="label" style={{marginBottom:8, display:'flex', alignItems:'center', gap:5}}>
            <span style={{width:6, height:6, borderRadius:'50%', background:'var(--ok)'}}/> Where it came from
          </div>
          {incomes.map((i, idx) => {
            const pct = Math.round((i.v / totalIn) * 100);
            return (
              <div key={i.k} style={{marginBottom:10, opacity: drawn ? 1 : 0, transition:`opacity 0.4s ease ${0.3 + idx*0.08}s`}}>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginBottom:3}}>
                  <span style={{fontSize:12, fontWeight:600}}>{i.k}</span>
                  <span className="mono tabular" style={{fontSize:11, color:'var(--ink-2)'}}>₹{(i.v/1000).toFixed(1)}k</span>
                </div>
                <div style={{height:4, borderRadius:2, background:'var(--surface-2)', overflow:'hidden'}}>
                  <div style={{width: drawn ? `${pct}%` : '0%', height:'100%', background:'var(--ok)', transition:`width 0.8s cubic-bezier(0.4, 0.8, 0.4, 1) ${0.3 + idx*0.08}s`}}/>
                </div>
              </div>
            );
          })}
        </div>

        {/* Out sinks (top 4) */}
        <div>
          <div className="label" style={{marginBottom:8, display:'flex', alignItems:'center', gap:5}}>
            <span style={{width:6, height:6, borderRadius:'50%', background:'var(--ink)'}}/> Where it went
          </div>
          {outflows.slice(0, 4).map((o, idx) => {
            const pct = Math.round((o.v / totalOut) * 100);
            return (
              <div key={o.k} style={{marginBottom:10, opacity: drawn ? 1 : 0, transition:`opacity 0.4s ease ${0.5 + idx*0.06}s`}}>

<script type="text/babel" data-presets="react">
// ============================================================
// UNIVERSAL FILTER BAR — shared by Activity, Insights, etc.
// ============================================================
// Usage:
//   const f = useFilters({ time:'month', type:'all', cats:[] });
//   <FilterBar filters={f} groups={ACTIVITY_GROUPS}/>
//   const visible = applyFilters(rows, f.values);
// ============================================================

const { useState: useFState, useEffect: useFEffect, useMemo: useFMemo } = React;

// ----- shared option sets -----
const FILTER_TIME    = [['today','Today'],['week','Week'],['month','Month'],['90d','90d'],['year','Year']];
const FILTER_TYPE    = [['all','All'],['expense','Out'],['income','In']];
const FILTER_CATS    = [['food','Food'],['travel','Travel'],['bills','Bills'],['shop','Shop'],['subs','Subs'],['fuel','Fuel'],['grocery','Grocery'],['coffee','Coffee']];
const FILTER_ACCOUNTS = [['cards','Cards','card'],['upi','UPI','zap'],['cash','Cash','wallet']];
const FILTER_SOURCES  = [['gmail','Gmail','mail'],['sms','SMS','zap'],['manual','Manual','edit']];

// ----- the hook -----
function useFilters(initial = {}) {
  const [values, setValues] = useFState({
    time: 'month',
    type: 'all',
    cats: [],
    amountMin: '',
    amountMax: '',
    accounts: [],
    sources: [],
    dateFrom: '',
    dateTo: '',
    ...initial,
  });
  const set = (key, val) => setValues(v => ({ ...v, [key]: val }));
  const toggleArr = (key, k) => setValues(v => ({ ...v, [key]: v[key].includes(k) ? v[key].filter(x=>x!==k) : [...v[key], k] }));
  const reset = () => setValues({
    time: 'month', type: 'all', cats: [],
    amountMin: '', amountMax: '', accounts: [], sources: [], dateFrom: '', dateTo: ''
  });
  // counts
  const customCount = (values.amountMin?1:0) + (values.amountMax?1:0)
    + values.accounts.length + values.sources.length
    + (values.dateFrom?1:0) + (values.dateTo?1:0);
  const activeCount = (values.time !== 'month' ? 1 : 0)
    + (values.type !== 'all' ? 1 : 0)
    + values.cats.length
    + customCount;
  return { values, set, toggleArr, reset, customCount, activeCount, replace: setValues };
}

// ----- universal filter function -----
// row: { amount, category, source, account, date(JS Date), type:'expense'|'income' }
function rowMatches(row, f) {
  if (f.type !== 'all' && row.type !== f.type) return false;
  if (f.cats.length && !f.cats.includes(row.category)) return false;
  if (f.amountMin && row.amount < Number(f.amountMin)) return false;
  if (f.amountMax && row.amount > Number(f.amountMax)) return false;
  if (f.accounts.length && !f.accounts.includes(row.account)) return false;
  if (f.sources.length && !f.sources.includes((row.source || '').toLowerCase())) return false;
  // time bucket — synthetic; assumes data has dayOffset (0 = today, increasing into past)
  if (f.time !== 'month' && row.dayOffset !== undefined) {
    const limits = { today: 0, week: 7, month: 30, '90d': 90, year: 365 };
    if (row.dayOffset > limits[f.time]) return false;
  }
  // explicit date range
  if (f.dateFrom && row.date && row.date < new Date(f.dateFrom)) return false;
  if (f.dateTo && row.date && row.date > new Date(f.dateTo)) return false;
  return true;
}

// ----- the bar -----
const FilterBar = ({ filters, groups = ['time','type','cats'], onMore }) => {
  const f = filters;

      {showGroup('type') && FILTER_TYPE.filter(([k]) => k !== 'all').map(([k,l]) => (

      ))}
      {showGroup('cats') && (showGroup('time') || showGroup('type')) && <span style={{width:1, background:'var(--line-strong)', flexShrink:0, margin:'4px 6px', alignSelf:'stretch'}}/>}
      {showGroup('cats') && FILTER_CATS.slice(0,5).map(([k,l]) => (

      ))}
      <button onClick={onMore} className="chip" style={{border:'1px dashed var(--line-strong)', background:'transparent', flexShrink:0, fontWeight:600, gap:5, cursor:'pointer'}}>
        <Icon name="filter" size={11} stroke={2.2}/>
        More{f.customCount > 0 ? ` · ${f.customCount}` : ''}
      </button>
      {f.activeCount > 0 && (
        <button onClick={f.reset} className="chip" style={{background:'transparent', color:'var(--ink-3)', border:'none', flexShrink:0, fontWeight:500, gap:4, cursor:'pointer'}}>
          <Icon name="x" size={10} stroke={2.4}/>
          Clear
        </button>
      )}
    </div>
  );
};

              <input type="date" value={f.values.dateFrom} onChange={(e) => f.set('dateFrom', e.target.value)} style={{width:'100%', border:'none', background:'transparent', fontFamily:'inherit', fontSize:13, color:'var(--ink)', outline:'none'}}/>
            </div>

            </div>

              <Chip key={l} onClick={() => { f.set('amountMin', mn?String(mn):''); f.set('amountMax', mx?String(mx):''); }}>{l}</Chip>

<script type="text/babel" data-presets="react">
/* Gexpense Hi-Fi — usePullToRefresh hook
   Used by Dashboard + Transactions (and any future scroll surface).
   Returns { scrollRef, bind, pullY, refreshing, contentTransform }. */
window.usePullToRefresh = function usePullToRefresh({
  enabled = true,
  onRefresh = null,
  threshold = 60,
  maxPull = 90,
  duration = 1400,
} = {}) {
  const [pullY, setPullY] = React.useState(0);
  const [refreshing, setRefreshing] = React.useState(false);
  const startY = React.useRef(null);
  const scrollRef = React.useRef(null);

  const handleStart = (e) => {
    if (!enabled || refreshing) return;
    if (scrollRef.current && scrollRef.current.scrollTop === 0) {
      startY.current = e.touches ? e.touches[0].clientY : e.clientY;
    }
  };
  const handleMove = (e) => {
    if (!enabled || startY.current == null || refreshing) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    const dy = y - startY.current;
    if (dy > 0) {
      setPullY(Math.min(maxPull, dy * 0.55));
      e.preventDefault?.();
    }
  };
  const handleEnd = () => {
    if (!enabled) { setPullY(0); startY.current = null; return; }
    if (pullY > threshold && !refreshing) {
      setRefreshing(true);
      setPullY(56);
      const finish = () => { setRefreshing(false); setPullY(0); };
      try {
        const r = onRefresh && onRefresh();
        if (r && typeof r.then === 'function') {
          r.then(() => setTimeout(finish, Math.max(200, duration - 400)))
           .catch(() => setTimeout(finish, duration));
        } else {
          setTimeout(finish, duration);
        }
      } catch {
        setTimeout(finish, duration);
      }
    } else {
      setPullY(0);
    }
    startY.current = null;
  };

  const bind = enabled ? {
    onTouchStart: handleStart,
    onTouchMove: handleMove,
    onTouchEnd: handleEnd,
    onPointerDown: handleStart,
    onPointerMove: (e) => { if (e.pressure > 0 || e.buttons === 1) handleMove(e); },
    onPointerUp: handleEnd,
  } : {};

  const contentTransform = {
    transform: `translateY(${pullY}px)`,
    transition: (pullY === 0 || refreshing)
      ? 'transform 280ms cubic-bezier(0.2, 0.8, 0.2, 1)'
      : 'none',
  };

  return { scrollRef, bind, pullY, refreshing, contentTransform };
};

window.PullIndicator = function PullIndicator({ pullY, refreshing, label = 'Pull to refresh' }) {
  return (
    <div style={{position:'absolute', top:0, left:0, right:0, height: pullY, display:'flex', alignItems:'center', justifyContent:'center', overflow:'hidden', pointerEvents:'none', zIndex:2}}>
      <div style={{display:'flex', alignItems:'center', gap:8, color:'var(--ink-3)', opacity: pullY > 8 ? 1 : 0, transition:'opacity 200ms'}}>
        <Icon name="refresh" size={14} style={{
          transform: refreshing ? 'rotate(0deg)' : `rotate(${pullY * 4}deg)`,
          animation: refreshing ? 'spin 0.9s linear infinite' : 'none',
          transition: refreshing ? 'none' : 'transform 80ms'
        }}/>
        <span className="small mono" style={{fontWeight:500}}>
          {refreshing ? 'Refreshing…' : pullY > 60 ? 'Release to refresh' : label}
        </span>
      </div>
    </div>
  );
};

// ============================================================
// SwipeableRow — reveal actions by horizontal drag (left & right)
//   actionsLeft  → pinned to row's left edge,  revealed by swiping right
//   actionsRight → pinned to row's right edge, revealed by swiping left
//   Tap-while-open closes; tap-while-closed runs onTap.
// ============================================================
window.SwipeableRow = function SwipeableRow({
  actionsLeft = [],
  actionsRight = [],
  children,
  onTap,
  actionWidth = 76,
}) {
  const [x, setX] = React.useState(0);
  const [dragging, setDragging] = React.useState(false);
  const startX = React.useRef(null);
  const startY = React.useRef(null);
  const axis = React.useRef(null); // 'x' | 'y' | null
  const settled = React.useRef(0);
  const leftW = actionsLeft.length * actionWidth;
  const rightW = actionsRight.length * actionWidth;

  const onStart = (e) => {
    const t = e.touches ? e.touches[0] : e;
    startX.current = t.clientX;
    startY.current = t.clientY;
    axis.current = null;
  };
  const onMove = (e) => {
    if (startX.current == null) return;
    const t = e.touches ? e.touches[0] : e;
    const dx = t.clientX - startX.current;
    const dy = t.clientY - startY.current;
    if (!axis.current) {
      if (Math.abs(dx) < 7 && Math.abs(dy) < 7) return;
      axis.current = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if (axis.current !== 'x') return;
    let nx = dx + settled.current;
    if (nx > leftW + 24) nx = leftW + 24;
    if (nx < -(rightW + 24)) nx = -(rightW + 24);
    if (!actionsLeft.length && nx > 0) nx = 0;
    if (!actionsRight.length && nx < 0) nx = 0;
    setX(nx);
    setDragging(true);
  };
  const onEnd = () => {
    if (startX.current == null) return;
    let target = settled.current;
    if (axis.current === 'x') {
      const xCur = x;
      if (xCur > leftW * 0.5 && leftW > 0) target = leftW;
      else if (xCur < -rightW * 0.5 && rightW > 0) target = -rightW;
      else target = 0;
    }
    setX(target);
    settled.current = target;
    setDragging(false);
    startX.current = null;
    startY.current = null;
    axis.current = null;
  };

  const close = () => { setX(0); settled.current = 0; };

  const handleTap = (e) => {
    if (settled.current !== 0) {
      e.stopPropagation();
      e.preventDefault?.();
      close();
      return;
    }
    if (onTap) onTap(e);
  };

  const renderActions = (actions, side) => (
    <div style={{position:'absolute', top:0, bottom:0, [side]:0, display:'flex', overflow:'hidden', zIndex:0}}>
      {actions.map((a, i) => (
        <button
          key={i}
          onClick={(e) => { e.stopPropagation(); close(); a.onClick && a.onClick(); }}
          style={{
            width: actionWidth,
            background: a.bg || 'var(--ink-2)',
            color: a.fg || '#fff',
            border:'none', cursor:'pointer',
            display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:4,
            fontFamily:'inherit', fontSize:11, fontWeight:600,
          }}
        >
          {a.icon && <Icon name={a.icon} size={16}/>}
          {a.label}
        </button>
      ))}
    </div>
  );

  return (
    <div style={{position:'relative', overflow:'hidden'}}>
      {actionsLeft.length > 0 && renderActions(actionsLeft, 'left')}
      {actionsRight.length > 0 && renderActions(actionsRight, 'right')}
      <div
        style={{
          transform: `translateX(${x}px)`,
          transition: dragging ? 'none' : 'transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1)',
          position:'relative',
          zIndex: 1,
          touchAction: 'pan-y',
        }}
        onTouchStart={onStart}
        onTouchMove={onMove}
        onTouchEnd={onEnd}
        onPointerDown={(e) => { if (e.pointerType === 'mouse' && e.button !== 0) return; onStart(e); }}
        onPointerMove={(e) => { if (e.buttons === 1 || (e.pressure ?? 0) > 0) onMove(e); }}
        onPointerUp={onEnd}
        onPointerCancel={onEnd}
        onClick={handleTap}
      >
        {children}
      </div>
    </div>
  );
};
</script>

<script type="text/babel" data-presets="react">
/* Gexpense Hi-Fi — Tweaks: persistent in-prototype controls.
   The JSON between EDITMODE markers is the canonical default — host rewrites it
   when the user changes a value. Keys must stay JSON-valid. */
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "gestures": {
    "pullToRefresh": true
  },
  "demo": {
    "showSyncedTimestamp": true
  }
}/*EDITMODE-END*/;

window.useTweaks = function useTweaks(initial = TWEAK_DEFAULTS) {
  const [tweaks, setTweaks] = React.useState(initial);
  const [visible, setVisible] = React.useState(false);

  React.useEffect(() => {
    const onMsg = (e) => {
      const m = e && e.data;
      if (!m || typeof m !== 'object') return;
      if (m.type === '__activate_edit_mode') setVisible(true);
      else if (m.type === '__deactivate_edit_mode') setVisible(false);
    };
    window.addEventListener('message', onMsg);
    // Announce availability AFTER listener is attached.
    try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch {}
    return () => window.removeEventListener('message', onMsg);
  }, []);

  // Host merges edits at the TOP level only. For dotted paths we mutate the
  // nested value and post the whole top-level key so the merge replaces it.
  const setTweak = React.useCallback((pathOrObj, value) => {
    if (typeof pathOrObj === 'string') {
      const segs = pathOrObj.split('.');
      setTweaks(prev => {
        const next = { ...prev };
        let cur = next;
        for (let i = 0; i < segs.length - 1; i++) {
          cur[segs[i]] = { ...(cur[segs[i]] || {}) };
          cur = cur[segs[i]];
        }
        cur[segs[segs.length - 1]] = value;
        const topKey = segs[0];
        try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [topKey]: next[topKey] } }, '*'); } catch {}
        return next;
      });
    } else {
      setTweaks(prev => {
        const next = { ...prev, ...pathOrObj };
        try { window.parent.postMessage({ type: '__edit_mode_set_keys', edits: pathOrObj }, '*'); } catch {}
        return next;
      });
    }
  }, []);

  const close = React.useCallback(() => {
    setVisible(false);
    try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch {}
  }, []);

  return { tweaks, setTweak, visible, close };
};

const TwkToggle = ({ on, onClick }) => (
  <div role="switch" aria-checked={on} className={'twk-toggle' + (on ? ' on' : '')} onClick={onClick}/>
);

window.TweaksPanel = function TweaksPanel({ tweaks, setTweak, visible, onClose }) {

                  <div className="tabular" style={{fontWeight:600, fontSize:14}}>−₹{r[4].toLocaleString('en-IN')}</div>
                </div>
                <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginTop:2}}>
                  <div className="small" style={{whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis'}}>{r[2]}</div>
                  <div className="small mono">{r[3]}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
        </React.Fragment>
        )}
      </div>
    </div>
  );
};

const Transactions = ({ filterPreset = null, onClearPreset = () => {}, onTxOpen = () => {}, onSearch = () => {}, pullEnabled = true, showSyncedTimestamp = true }) => {
  const filters = useFilters({
    time: filterPreset === 'this-month' ? 'month' : 'month',
    type: filterPreset === 'this-month' ? 'all' : 'all',
  });
  const [showMore, setShowMore] = useState(false);
  const [staggerKey, setStaggerKey] = useState(0);
  const [deletedKeys, setDeletedKeys] = useState(() => new Set());
  const restore = (key) => setDeletedKeys(s => { const n = new Set(s); n.delete(key); return n; });
  const [syncedAt, setSyncedAt] = useState(() => Date.now() - 2 * 60 * 1000); // "2m ago"
  const [, force] = useState(0);
  useEffect(() => { const t = setInterval(() => force(n => n + 1), 30 * 1000); return () => clearInterval(t); }, []);
  const syncedLabel = (() => {
    const s = Math.round((Date.now() - syncedAt) / 1000);
    if (s < 5) return 'just now';
    if (s < 60) return s + 's ago';
    const m = Math.round(s / 60);
    return m + 'm ago';
  })();

  const ptr = usePullToRefresh({
    enabled: pullEnabled,
    duration: 1200,
    onRefresh: () => {
      setSyncedAt(Date.now());
      setStaggerKey(k => k + 1);
    },
  });

  // base data — each row has all fields needed by the universal filter
  // dayOffset: days back from today (0=today, 1=yesterday)
  const allRows = [
    { day:'Today',         dayOffset: 0, items: [
      { category:'food',    merchant:'Swiggy',      note:'Dinner — Toit',          time:'9:12 PM', amount:420,    source:'gmail', account:'cards', type:'expense' },
      { category:'travel',  merchant:'Uber',        note:'Indiranagar → HSR',      time:'3:40 PM', amount:186,    source:'sms',   account:'upi',   type:'expense' },
    ]},
    { day:'Yesterday',     dayOffset: 1, items: [
      { category:'grocery', merchant:'BigBasket',   note:'Weekly stock-up',        time:'7:20 PM', amount:1240,   source:'gmail', account:'cards', type:'expense' },
      { category:'subs',    merchant:'Spotify Family', note:'Auto-renew',          time:'12:00 AM', amount:199,   source:'gmail', account:'cards', type:'expense' },
    ]},
    { day:'Tue · Apr 22',  dayOffset: 3, items: [
      { category:'bills',   merchant:'Airtel',      note:'Postpaid · auto-paid',   time:'5:30 PM', amount:599,    source:'gmail', account:'cards', type:'expense' },
      { category:'fuel',    merchant:'Shell',       note:'MG Rd · Card ••42',      time:'8:15 AM', amount:1200,   source:'sms',   account:'cards', type:'expense' },
      { category:'coffee',  merchant:'Blue Tokai',  note:'Morning latte',          time:'7:50 AM', amount:359,    source:'gmail', account:'upi',   type:'expense' },
    ]},
    { day:'Mon · Apr 21',  dayOffset: 4, items: [
      { category:'food',    merchant:'Zomato',      note:'Lunch — Burma Burma',    time:'1:08 PM', amount:480,    source:'gmail', account:'upi',   type:'expense' },
    ]},
    { day:'Fri · Apr 18',  dayOffset: 7, items: [
      { category:'shop',    merchant:'Decathlon',   note:'Running shoes',          time:'6:42 PM', amount:4290,   source:'gmail', account:'cards', type:'expense' },
      { category:'food',    merchant:'Toit',        note:'Friday pints',           time:'10:20 PM', amount:1850,  source:'sms',   account:'cards', type:'expense' },
    ]},
    { day:'Wed · Apr 16',  dayOffset: 9, items: [
      { category:'travel',  merchant:'IndiGo',      note:'BLR → BOM',              time:'11:00 AM', amount:6480,  source:'gmail', account:'cards', type:'expense' },
    ]},
    { day:'Mon · Mar 31',  dayOffset: 35, items: [
      { category:'income',  merchant:'Salary · Acme Corp', note:'Direct deposit · HDFC ••1042', time:'9:30 AM', amount:142500, source:'gmail', account:'cards', type:'income' },
    ]},
    { day:'Fri · Mar 28',  dayOffset: 38, items: [
      { category:'income',  merchant:'Freelance · Notion review', note:'UPI from rohan@okhdfc', time:'2:14 PM', amount:8400, source:'sms', account:'upi', type:'income' },
    ]},
    { day:'Wed · Mar 26',  dayOffset: 40, items: [
      { category:'income',  merchant:'Cashback · CRED', note:'Rewards credit',     time:'11:02 AM', amount:2200,  source:'gmail', account:'cards', type:'income' },
    ]},
  ];

  // apply filters
  const groups = allRows
    .map(g => ({ ...g, items: g.items.filter(r => rowMatches({ ...r, dayOffset: g.dayOffset }, filters.values)) }))
    .filter(g => g.items.length > 0);

  const totalShown = groups.reduce((acc, g) => acc + g.items.length, 0);
  const sumExp = groups.reduce((acc, g) => acc + g.items.filter(r => r.type==='expense').reduce((a,r)=>a+r.amount,0), 0);
  const sumInc = groups.reduce((acc, g) => acc + g.items.filter(r => r.type==='income').reduce((a,r)=>a+r.amount,0), 0);

  const presets = [
    ['Eating out · this week', { time:'week', type:'expense', cats:['food','coffee'] }],
    ['Big purchases · this month', { time:'month', type:'expense', cats:[], amountMin:'2000' }],
    ['Subscriptions only', { type:'expense', cats:['subs'] }],
    ['Income this month', { time:'month', type:'income', cats:[] }],
  ];

  return (
    <div className="scroll" data-screen-label="03 Transactions" ref={ptr.scrollRef} {...ptr.bind}>
      <PullIndicator pullY={ptr.pullY} refreshing={ptr.refreshing}/>
      <div key={staggerKey} style={{padding:'8px 22px 0', ...ptr.contentTransform}}>
        <div className="fade-up fade-up-1" style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: 16}}>
          <div>
            <div className="h2">Activity</div>
            {showSyncedTimestamp && (
              <div className="small mono" style={{marginTop:2, color:'var(--ink-3)', display:'flex', alignItems:'center', gap:6, whiteSpace:'nowrap'}}>
                <span style={{width:6, height:6, borderRadius:'50%', background:'var(--ok)', display:'inline-block', flexShrink:0}}/>
                <span>Synced {syncedLabel}</span>
              </div>
            )}
          </div>
          <div style={{display:'flex', gap:8}}>
            <button onClick={() => window.__openSearch && window.__openSearch()} className="btn-ghost btn" style={{padding:'8px', borderRadius:'50%', width:36, height:36, display:'grid', placeItems:'center'}}><Icon name="search" size={16}/></button>
            <button onClick={() => setShowMore(true)} className="btn-ghost btn" style={{padding:'8px', borderRadius:'50%', width:36, height:36, display:'grid', placeItems:'center', position:'relative'}}>
              <Icon name="filter" size={16}/>
              {filters.activeCount > 0 && (
                <span style={{position:'absolute', top:6, right:6, minWidth:14, height:14, padding:'0 3px', borderRadius:99, background:'var(--brand)', color:'#fff', fontSize:9, fontWeight:700, display:'grid', placeItems:'center', lineHeight:1, fontFamily:'var(--font-mono)'}}>{filters.activeCount}</span>
              )}
            </button>
          </div>
        </div>

        {filterPreset === 'this-month' && (
          <div className="card fade-up fade-up-1" style={{padding:'10px 14px', marginBottom:12, background:'var(--brand-soft)', border:'1px solid color-mix(in srgb, var(--brand) 22%, transparent)', display:'flex', alignItems:'center', gap:10}}>
            <div style={{width:28, height:28, borderRadius:8, background:'var(--brand)', color:'#fff', display:'grid', placeItems:'center', flexShrink:0}}>
              <Icon name="filter" size={14}/>
            </div>
            <div style={{flex:1, minWidth:0}}>
              <div style={{fontSize:13, fontWeight:600, color:'var(--ink)'}}>April expenses · late-March income</div>
              <div className="small" style={{marginTop:1}}>Showing this month's spend & last week of March income</div>
            </div>
            <button className="btn-ghost btn" onClick={onClearPreset} style={{padding:'6px 10px', fontSize:11, fontWeight:600, color:'var(--brand)'}}>Clear</button>
          </div>
        )}

        {/* summary tile — driven by filtered totals */}
        {(() => {
          const t = filters.values.type;
          const heroLabel = t === 'income' ? 'Income' : t === 'expense' ? 'Spent' : 'Net';
          const heroValue = t === 'income' ? sumInc : t === 'expense' ? sumExp : Math.abs(sumInc - sumExp);
          const heroSign = t === 'income' ? '+' : t === 'expense' ? '−' : (sumInc > sumExp ? '+' : sumExp > sumInc ? '−' : '');
          const heroColor = t === 'income' || (t === 'all' && sumInc > sumExp) ? 'var(--ok)' : 'var(--ink)';
          // stats row — appears only when meaningful
          const stats = [];
          if (t === 'all') {
            if (sumExp > 0) stats.push({ label:'Spent', value:'−₹' + sumExp.toLocaleString('en-IN'), color:'var(--ink-2)' });
            if (sumInc > 0) stats.push({ label:'Income', value:'+₹' + sumInc.toLocaleString('en-IN'), color:'var(--ok)' });
          } else if (t === 'expense') {
            const avg = totalShown ? Math.round(sumExp / totalShown) : 0;
            if (avg) stats.push({ label:'Avg / tx', value:'₹' + avg.toLocaleString('en-IN'), color:'var(--ink-2)' });
          } else if (t === 'income') {
            const avg = totalShown ? Math.round(sumInc / totalShown) : 0;
            if (avg) stats.push({ label:'Avg / tx', value:'₹' + avg.toLocaleString('en-IN'), color:'var(--ink-2)' });
          }
          stats.push({ label:'Transactions', value: String(totalShown), color:'var(--ink-2)' });

          return (
            <div className="card fade-up fade-up-2" style={{padding:'16px 18px', marginBottom:14}}>
              {/* hero */}
              <div className="label">{heroLabel}</div>
              <div className="tabular" style={{fontSize: 30, fontWeight: 600, letterSpacing:'-0.02em', marginTop:4, color: heroColor, lineHeight: 1.1}}>
                {heroSign}₹<CounterUp value={heroValue}/>
              </div>
              {/* supporting stats — evenly spaced grid */}
              {stats.length > 0 && (
                <div style={{
                  display:'grid',
                  gridTemplateColumns: `repeat(${stats.length}, 1fr)`,
                  gap: 10,
                  marginTop: 14,
                  paddingTop: 12,
                  borderTop: '1px solid var(--line)',
                }}>
                  {stats.map((s, i) => (
                    <div key={s.label} style={{
                      textAlign: i === 0 ? 'left' : i === stats.length - 1 ? 'right' : 'center',
                      minWidth: 0,
                    }}>
                      <div className="label" style={{fontSize: 10}}>{s.label}</div>
                      <div className="tabular" style={{
                        fontSize: 14,
                        fontWeight: 600,
                        marginTop: 3,
                        color: s.color,
                        whiteSpace: 'nowrap',
                        overflow: 'hidden',
                        textOverflow: 'ellipsis',
                      }}>{s.value}</div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })()}

        {/* universal filter bar */}
        <div className="fade-up fade-up-3" style={{marginBottom:14}}>
          <FilterBar filters={filters} onMore={() => setShowMore(true)}/>
        </div>

        {groups.length === 0 && (
          <div className="card fade-up fade-up-3" style={{padding:'30px 18px', textAlign:'center', color:'var(--ink-3)'}}>
            <Icon name="filter" size={20}/>
            <div style={{marginTop:8, fontWeight:600, color:'var(--ink-2)'}}>No transactions match</div>
            <div className="small" style={{marginTop:2}}>Try clearing some filters</div>
            <button onClick={filters.reset} className="btn btn-ghost" style={{marginTop:12, padding:'8px 14px', fontSize:12, fontWeight:600, color:'var(--brand)'}}>Reset filters</button>
          </div>
        )}

        {groups.map((g, gi) => {
          const dayTotal = g.items.reduce((a,r)=>a+r.amount,0);
          const isIncomeDay = g.items.every(r => r.type === 'income');
          return (
            <div key={g.day} className={`fade-up fade-up-${(gi%5)+3}`} style={{marginBottom:18}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', padding:'4px 4px 8px'}}>
                <div style={{fontSize:13, fontWeight:600, color:'var(--ink-2)'}}>{g.day}</div>
                <div className="mono small tabular" style={{color: isIncomeDay ? 'var(--ok)' : 'var(--ink-2)'}}>
                  {isIncomeDay ? '+' : ''}₹{dayTotal.toLocaleString('en-IN')}
                </div>
              </div>
              <div className="card" style={{padding:'4px 0', overflow:'hidden'}}>
                {g.items.map((r, i) => {
                  const isIncome = r.type === 'income';
                  const txKey = `tx_${gi}_${i}_${r.merchant}`;
                  if (deletedKeys.has(txKey)) return null;
                  const txData = { merchant:r.merchant, note:r.note, time:r.time, amount:r.amount, category:r.category, categoryLabel:r.category[0].toUpperCase()+r.category.slice(1), source:r.source[0].toUpperCase()+r.source.slice(1), sourceDetail:r.source+' receipt', dateLong:g.day, account:'HDFC ••1042', id:txKey, type:r.type, aiTags:isIncome?[]:['Auto-categorized'] };
                  return (
                    <SwipeableRow
                      key={txKey}
                      onTap={() => onTxOpen(txData)}
                      actionsLeft={[
                        { label:'Categorize', icon:'sparkle', bg:'var(--brand)',  fg:'#fff', onClick: () => onTxOpen(txData) },
                      ]}
                      actionsRight={[
                        { label:'Split',  icon:'split', bg:'#1F4FA8', fg:'#fff', onClick: () => onTxOpen(txData) },
                        { label:'Delete', icon:'trash', bg:'var(--err)', fg:'#fff', onClick: () => {
                          setDeletedKeys(s => new Set([...s, txKey]));
                          window.__toast && window.__toast(`Deleted · ${r.merchant}`, () => restore(txKey));
                        }},
                      ]}
                    >
                      <div style={{display:'flex', alignItems:'center', gap:12, padding:'12px 16px', borderBottom: i<g.items.length-1 ? '1px solid var(--line)' : 'none', background:'var(--surface)', cursor:'pointer'}}>
                        <CatIcon kind={r.category}/>
                        <div style={{flex:1, minWidth:0}}>
                          <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', gap:8}}>
                            <div style={{fontWeight:600, fontSize:14}}>{r.merchant}</div>
                            <div className="tabular" style={{fontWeight:600, fontSize:14, color: isIncome ? 'var(--ok)' : 'var(--ink)'}}>
                              {isIncome ? '+' : '−'}₹{r.amount.toLocaleString('en-IN')}
                            </div>
                          </div>
                          <div style={{display:'flex', justifyContent:'space-between', alignItems:'baseline', marginTop:2}}>
                            <div className="small">{r.note}</div>
                            <div className="small mono" style={{display:'flex', alignItems:'center', gap:6}}>
                              <span>{r.time}</span>
                              <span style={{fontSize:9, padding:'1px 6px', borderRadius:4, background:'var(--surface-2)', color:'var(--ink-3)'}}>{r.source[0].toUpperCase()+r.source.slice(1)}</span>
                            </div>
                          </div>
                        </div>
                      </div>
                    </SwipeableRow>
                  );
                })}
              </div>
            </div>
          );
        })}

        <div style={{height:30}}/>
      </div>

      <FilterSheet open={showMore} onClose={() => setShowMore(false)} filters={filters} presets={presets}/>
    </div>
  );
};

const SplitSheet = ({ tx, onClose, onApply }) => {

              <div style={{flex:1, minWidth:0}}>
                <input value={p.who} onChange={(e) => setParts(parts.map((x, j) => j === i ? {...x, who: e.target.value} : x))} style={{border:'none', background:'transparent', fontFamily:'inherit', fontSize:14, fontWeight:600, outline:'none', width:'100%'}}/>
              </div>
              <div style={{display:'flex', alignItems:'center', gap:6, padding:'6px 10px', borderRadius:8, background:'var(--surface-2)', border:'1px solid var(--line)'}}>
                <span className="small">₹</span>
                <input value={p.amount} onChange={(e) => setParts(parts.map((x, j) => j === i ? {...x, amount: e.target.value.replace(/[^\d]/g, '')} : x))} inputMode="numeric" style={{border:'none', background:'transparent', fontFamily:'inherit', fontSize:14, fontWeight:600, outline:'none', width:60, textAlign:'right'}}/>
              </div>
            </div>
          ))}
          <button onClick={() => setParts([...parts, { who: `Person ${parts.length+1}`, amount: 0 }])} className="btn btn-ghost" style={{width:'100%', padding:10, marginTop:4, borderStyle:'dashed', border:'1px dashed var(--line-strong)'}}>+ Add person</button>

        </div>
        <div style={{padding:'4px 22px 8px'}}>
          <button onClick={onApply} disabled={remaining !== 0} className="btn btn-primary" style={{width:'100%', padding:12, opacity: remaining === 0 ? 1 : 0.5}}>Apply split</button>
        </div>
      </div>
    </>
  );
};

const CategoryDetail = ({ cat, onBack }) => {

  return (
    <div className="scroll" data-screen-label="11 Category Detail">

          <div className="h2" style={{marginTop:14}}>{cat.name}</div>
          <div className="tabular" style={{fontSize:36, fontWeight:600, letterSpacing:'-0.02em', marginTop:10}}>₹{cat.spent.toLocaleString('en-IN')}</div>
          <div className="small mono" style={{marginTop:2}}>
            of {editMode
              ? <>₹<input inputMode="numeric" value={budget} onChange={(e) => setBudget(Number(e.target.value.replace(/[^\d]/g,'')) || 0)} className="tabular mono" style={{width:80, padding:'1px 6px', border:'1px solid var(--line)', borderRadius:6, fontFamily:'inherit', fontSize:12, background:'var(--surface-2)'}}/></>
              : `₹${budget.toLocaleString('en-IN')}`} this month · <span style={{color: cat.spent > budget ? 'var(--err)' : 'var(--ok)'}}>{cat.spent > budget ? 'over' : 'on track'}</span>

        <div className="card fade-up fade-up-3" style={{padding:14, marginBottom:14}}>
          <div className="progress" style={{height:8, marginBottom:14}}>
            <i style={{width:`${Math.min(100, (cat.spent/budget)*100)}%`, background: cat.spent > budget ? 'var(--err)' : undefined}}/>

          <div className="label" style={{marginBottom:8}}>12-month trend</div>
          <svg viewBox={`0 0 ${w} ${h}`} width="100%" style={{height:80}}>
            <path d={linePath} fill="none" stroke="var(--brand)" strokeWidth="2" strokeLinecap="round"/>
            {xy.map((p,i) => i === xy.length-1 && <circle key={i} cx={p[0]} cy={p[1]} r="4" fill="var(--brand)"/>)}
          </svg>
        </div>

        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:8, marginBottom:18}}>

              <CatIcon kind={cat.k}/>

const SmartInsight = ({ kind = 'subs', onBack, onAction = () => {} }) => {
  const d = SI_DATA[kind] || SI_DATA.subs;
  const max = Math.max(...d.trend.map(v => Math.abs(v))) * 1.15;
  const w = 320, h = 70, padX = 4, padY = 8;
  const step = (w - padX*2) / (d.trend.length - 1);
  const pts = d.trend.map((v, i) => [padX + i * step, h - padY - (Math.abs(v)/max)*(h - padY*2)]);
  const linePath = 'M' + pts.map(p => p.map(n=>n.toFixed(1)).join(',')).join(' L');
  const areaPath = linePath + ` L${pts[pts.length-1][0].toFixed(1)},${h-padY} L${pts[0][0].toFixed(1)},${h-padY} Z`;
  const lastPt = pts[pts.length-1];

  const otherKinds = Object.keys(SI_DATA).filter(k => k !== kind);

  return (
    <div className="scroll" data-screen-label={`Smart insight · ${d.eyebrow}`} style={{background:'var(--bg)'}}>

        {/* header */}

          </div>

            <Icon name="external" size={15}/>
          </button>
        </div>

        {/* hero */}

          <div style={{display:'flex', alignItems:'center', gap:6, marginBottom:8}}>
            <span style={{display:'inline-flex', alignItems:'center', gap:4, padding:'3px 9px', borderRadius:99, background:'color-mix(in srgb, var(--surface) 70%, transparent)', border:'1px solid color-mix(in srgb, var(--ink) 8%, transparent)', fontFamily:'var(--font-mono)', fontSize:10, fontWeight:600, color: d.accent, letterSpacing:'0.04em', textTransform:'uppercase'}}>
              <Icon name="sparkle" size={10}/>
              {d.confidence} confidence
            </span>
            <span className="small mono" style={{color:'var(--ink-3)'}}>· generated 2m ago</span>
          </div>
          <div style={{fontSize:22, fontWeight:600, lineHeight:1.22, letterSpacing:'-0.01em'}}>{d.title}</div>
          <div className="small" style={{color:'var(--ink-2)', marginTop:4, marginBottom:14}}>{d.subtitle}</div>

          {/* sparkline */}
          <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{display:'block'}}>
            <defs>
              <linearGradient id={`si-grad-${kind}`} x1="0" x2="0" y1="0" y2="1">
                <stop offset="0%" stopColor={d.accent} stopOpacity="0.32"/>
                <stop offset="100%" stopColor={d.accent} stopOpacity="0"/>
              </linearGradient>
            </defs>
            <path d={areaPath} fill={`url(#si-grad-${kind})`} style={{opacity:0, animation:'mrFadeIn 600ms 200ms forwards'}}/>
            <path d={linePath} fill="none" stroke={d.accent} strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"
              style={{strokeDasharray:600, strokeDashoffset:600, animation:'mrDraw 700ms 100ms forwards'}}/>
            {lastPt && <circle cx={lastPt[0]} cy={lastPt[1]} r="3.5" fill={d.accent} style={{opacity:0, animation:'mrFadeIn 300ms 700ms forwards'}}/>}

          <div style={{marginTop:8, display:'flex', alignItems:'center', gap:8}}>
            <span style={{padding:'2px 8px', borderRadius:99, background:`color-mix(in srgb, ${d.deltaColor} 14%, transparent)`, color: d.deltaColor, fontFamily:'var(--font-mono)', fontSize:11, fontWeight:600}}>{d.delta}</span>
          </div>
        </div>

        {/* reasoning */}
        <div className="card fade-up fade-up-3" style={{padding:16, marginBottom:12}}>

                style={{

                  cursor:'pointer',
                }}
              >
                <span style={{display:'flex', alignItems:'center', gap:10}}>
                  {a.icon && <Icon name={a.icon} size={14}/>}
                  {a.label}
                </span>
                <Icon name="chevron" size={13} style={{opacity:0.6}}/>
              </button>
            );
          })}
        </div>

        {/* sources */}
        <div className="card fade-up fade-up-5" style={{padding:0, marginBottom:12, overflow:'hidden'}}>
          <div className="label" style={{fontSize:10, padding:'14px 16px 6px'}}>{d.sourcesLabel}</div>
          {d.sources.map((s, i, a) => {
            const isDelta = s.kind === 'delta';
            const amtColor = isDelta ? (s.amt < 0 ? 'var(--ok)' : 'var(--warn)') : 'var(--ink)';
            const amtPrefix = isDelta ? (s.amt < 0 ? '−' : '+') : '';
            return (
              <div key={s.name} style={{display:'flex', alignItems:'center', gap:12, padding:'12px 16px', borderTop: i === 0 ? 'none' : '1px solid var(--line)', cursor:'pointer'}}>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{display:'flex', alignItems:'center', gap:6}}>
                    <div style={{fontSize:13.5, fontWeight:600}}>{s.name}</div>
                    {s.badge && <Badge tone={s.badge === 'unused' ? 'err' : 'warn'}>{s.badge}</Badge>}
                  </div>
                  <div className="small mono" style={{color:'var(--ink-3)', marginTop:2}}>{s.sub}</div>
                </div>
                <div className="tabular" style={{fontSize:13.5, fontWeight:600, color: amtColor}}>{amtPrefix}₹{Math.abs(s.amt).toLocaleString('en-IN')}</div>
                <Icon name="chevron" size={13} style={{color:'var(--ink-4)'}}/>
              </div>
            );
          })}
        </div>

        {/* related */}
        <div className="label" style={{fontSize:10, padding:'6px 4px 8px'}}>Related insights</div>
        <div className="fade-up fade-up-6" style={{display:'flex', gap:10, overflowX:'auto', marginBottom:18, paddingBottom:6, scrollbarWidth:'none'}}>
          {otherKinds.map(k => {
            const r = SI_DATA[k];
            return (
              <div key={k} onClick={() => window.__openInsight && window.__openInsight(k)} style={{minWidth:220, padding:14, borderRadius:12, background: r.bg, border:`1px solid color-mix(in srgb, ${r.accent} 22%, transparent)`, cursor:'pointer'}}>
                <div className="label" style={{fontSize:10, color: r.accent, marginBottom:6}}>{r.eyebrow}</div>
                <div style={{fontSize:13, fontWeight:600, lineHeight:1.35}}>{r.title}</div>
              </div>
            );
          })}
        </div>

        {/* footer controls */}
        <div className="fade-up fade-up-7" style={{display:'flex', justifyContent:'space-between', gap:8, padding:'10px 4px 30px', flexWrap:'wrap'}}>
          <button onClick={() => onAction({kind:'feedback', value:'unhelpful'}, d)} className="btn btn-ghost" style={{padding:'8px 12px', fontSize:11.5, fontWeight:600, color:'var(--ink-3)', display:'flex', alignItems:'center', gap:6}}>
            <Icon name="x" size={11}/> Not useful
          </button>
          <button onClick={() => onAction({kind:'mute'}, d)} className="btn btn-ghost" style={{padding:'8px 12px', fontSize:11.5, fontWeight:600, color:'var(--ink-3)', display:'flex', alignItems:'center', gap:6}}>
            <Icon name="bell" size={11}/> Mute {d.eyebrow.toLowerCase()} insights
          </button>
          <button onClick={() => onAction({kind:'why'}, d)} className="btn btn-ghost" style={{padding:'8px 12px', fontSize:11.5, fontWeight:600, color:'var(--ink-3)', display:'flex', alignItems:'center', gap:6}}>
            <Icon name="sparkle" size={11}/> Why am I seeing this?
          </button>
        </div>
      </div>
    </div>
  );
};

// ============================================================
// CounterUp — animate a number from 0 to target on mount
// ============================================================
const CounterUp = ({ value, format = (n) => n.toLocaleString('en-IN'), prefix = '', suffix = '', dur = 900, className = '', style = {} }) => {
  const [n, setN] = useStateV3(0);
  const ref = useRefV3({ start: 0, target: value, t0: 0 });
  useEffectV3(() => {
    ref.current = { start: 0, target: value, t0: performance.now() };
    let raf;
    const tick = (now) => {
      const t = Math.min(1, (now - ref.current.t0) / dur);
      const e = 1 - Math.pow(1 - t, 3); // easeOutCubic
      setN(Math.round(ref.current.target * e));
      if (t < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [value]);
  return <span className={`tabular ${className}`} style={style}>{prefix}{format(n)}{suffix}</span>;
};

// ---- mini chart primitives (used inside slides) ----
const MRSparkline = ({ data, highlight, max, w = 320, h = 56 }) => {
  const m = max || Math.max(...data) * 1.1;
  const bw = (w - 4) / data.length;
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{display:'block'}}>
      {data.map((v, i) => {
        const bh = (v / m) * (h - 6);
        const x = 2 + i * bw;
        const y = h - bh - 2;
        const active = i === highlight;
        return (
          <g key={i}>
            <rect x={x + bw*0.18} y={y} width={bw * 0.64} height={bh}
              fill={active ? 'var(--ink)' : 'color-mix(in srgb, var(--ink) 18%, transparent)'}
              rx={2}/>
            {active && (
              <circle cx={x + bw*0.5} cy={y - 5} r={2.4} fill="var(--ink)"/>
            )}
          </g>
        );
      })}
    </svg>
  );
};

const MRTrajectory = ({ actual, projected }) => {
  const all = [...actual, ...projected];
  const max = Math.max(...all) * 1.1;
  const w = 320, h = 100, padX = 6, padY = 8;
  const step = (w - padX*2) / (all.length - 1);
  const pts = all.map((v, i) => [padX + i * step, h - padY - (v/max)*(h-padY*2)]);
  const actualPath = 'M' + pts.slice(0, actual.length).map(p => p.map(n=>n.toFixed(1)).join(',')).join(' L');
  const projPath = 'M' + pts.slice(actual.length - 1).map(p => p.map(n=>n.toFixed(1)).join(',')).join(' L');
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{display:'block'}}>
      <path d={actualPath} fill="none" stroke="var(--ink)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"
        style={{strokeDasharray: 800, strokeDashoffset: 800, animation:'mrDraw 900ms 100ms forwards'}}/>
      <path d={projPath} fill="none" stroke="var(--brand)" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="4 4"
        style={{opacity:0, animation:'mrFadeIn 600ms 900ms forwards'}}/>
      {pts[actual.length - 1] && (
        <circle cx={pts[actual.length-1][0]} cy={pts[actual.length-1][1]} r="4" fill="var(--ink)"
          style={{opacity:0, animation:'mrFadeIn 400ms 800ms forwards'}}/>
      )}
    </svg>
  );
};

          <span className="label" style={{fontSize:10}}>Weekly pace · April → May</span>
          <span className="small mono" style={{color:'var(--ink-3)'}}>actual · projected</span>
        </div>
        <MRTrajectory actual={[11200, 23000, 35900, 48700, 54180]} projected={[54180, 65400, 77000, 88200, 102680]}/>

      <div style={{display:'flex', gap:14, marginTop:18, paddingTop:14, borderTop:'1px solid var(--line)'}}>

    { bg: 'linear-gradient(160deg, color-mix(in srgb, #E07A5F 22%, var(--bg)) 0%, var(--bg) 50%)',       chip: 'Where it went', Content: SlideCategory },
    { bg: 'linear-gradient(160deg, color-mix(in srgb, var(--ok) 18%, var(--bg)) 0%, var(--bg) 50%)',     chip: 'Goals',         Content: SlideGoals },
    { bg: 'linear-gradient(160deg, color-mix(in srgb, var(--err) 16%, var(--bg)) 0%, var(--bg) 50%)',    chip: 'Subscriptions', Content: SlideSubs },

  const [paused, setPaused] = useStateV3(false);
  const refKey = useRefV3(0);

  const s = slides[idx];
  const Content = s.Content;
  return (

        @keyframes progFill { from { width: 0%; } to { width: 100%; } }
        @keyframes barGrow { from { width: 0%; } }
        @keyframes mrDraw { to { stroke-dashoffset: 0; } }
        @keyframes mrFadeIn { to { opacity: 1; } }
      `}</style>
    </div>
  );
};

// ============================================================
// Coachmarks — guided first-run tour
// ============================================================
const Coachmarks = ({ steps, onDone }) => {
  const [i, setI] = useStateV3(0);
  const [rect, setRect] = useStateV3(null);

  useEffectV3(() => {
    const step = steps[i];
    if (!step) return;
    const find = () => {
      const phone = document.querySelector('.phone.app');
      const el = document.querySelector(step.selector);
      if (!phone || !el) return null;
      const pr = phone.getBoundingClientRect();
      const er = el.getBoundingClientRect();
      return {
        top: er.top - pr.top - 6,
        left: er.left - pr.left - 6,
        width: er.width + 12,
        height: er.height + 12,
      };
    };
    const r = find();
    if (r) setRect(r);
    // re-measure shortly after to catch any layout settle
    const t = setTimeout(() => { const r2 = find(); if (r2) setRect(r2); }, 80);
    return () => clearTimeout(t);
  }, [i]);

  if (!steps || !steps[i]) return null;
  const step = steps[i];
  if (!rect) return null;

  // place bubble above or below cutout depending on position
  const placeBelow = rect.top < 200;
  const bubbleStyle = placeBelow
    ? { top: rect.top + rect.height + 14, left: 18, right: 18 }
    : { bottom: 'calc(100% - ' + rect.top + 'px + 14px)', left: 18, right: 18, top: 'auto' };
  // simplify: compute from phone height
  const bs = placeBelow
    ? { top: rect.top + rect.height + 14, left: Math.max(14, Math.min(rect.left, 134)), maxWidth: 260 }
    : { top: Math.max(60, rect.top - 14 - 130), left: Math.max(14, Math.min(rect.left, 134)), maxWidth: 260 };

  return (
    <React.Fragment>
      <div className="coachmark-scrim" onClick={() => setI(i+1 < steps.length ? i+1 : onDone())}/>
      <div className="coachmark-hole" style={{top: rect.top, left: rect.left, width: rect.width, height: rect.height}}/>
      <div className="coachmark-bubble" style={bs}>
        <div className="step">Step {i+1} of {steps.length}</div>
        <div className="title">{step.title}</div>
        <div className="body">{step.body}</div>
        <div className="actions">
          <button className="skip" onClick={onDone}>Skip tour</button>
          <button className="next" onClick={() => i+1 < steps.length ? setI(i+1) : onDone()}>{i+1 < steps.length ? 'Next' : 'Got it'}</button>
        </div>
      </div>
    </React.Fragment>
  );
};

Object.assign(window, { CounterUp, Skeleton, QuickActions, ReceiptCapture, MonthlyReview, Coachmarks });
</script>
