<script type="text/babel" data-presets="react">
/* Gexpense Hi-Fi — App shell (clickable prototype) */
const { useState: useStateA, useEffect: useEffectA, useRef: useRefA } = React;

// ============================================================
// ThemeTransition — cinematic lightsaber sequence
//   Renders the full overlay: hilt + blade rig, reveal mask layers,
//   sparks, shockwaves, electric arcs. All animation timing lives in
//   CSS keyframes; this component just sets up CSS vars + waypoints.
// ============================================================
const ThemeTransition = ({ dir, origin }) => {
  // Jedi (toLight) = clean blue/cyan plasma; Sith (toDark) = crimson
  const saberColor = dir === 'toDark' ? '#FF3838' : '#7FE0FF';
  const wipeColor  = dir === 'toDark' ? '#0B0B0C' : '#F7F7F4';

  const fw = (origin && origin.w) || 390;
  const fh = (origin && origin.h) || 844;
  const cx = (origin && origin.x != null) ? origin.x : fw/2;
  const cy = (origin && origin.y != null) ? origin.y : fh/2;

  // Waypoints — translations relative to click point.
  // Hilt parks at the RIGHT edge at click-Y; rig only moves vertically after that.
  const margin = 22;
  const toRightX  = (fw - margin) - cx;
  const toBotY    = fh - cy + 24;
  const toTopOnlyY = -cy + margin;

  const sparks = React.useMemo(() => Array.from({length: 16}, () => {
    const angle = Math.random() * Math.PI * 2;
    const dist  = 70 + Math.random() * 150;
    return {
      sx: Math.cos(angle) * dist,
      sy: Math.sin(angle) * dist,
      delay: Math.random() * 120,
      size: 2 + Math.random() * 3.5,
    };
  }), []);
  const arcs = React.useMemo(() => Array.from({length: 5}, () => ({
    // Arcs spit toward the blade direction (leftward from hilt)
    rot: 150 + Math.random() * 60,
    delay: Math.random() * 100,
    len: 28 + Math.random() * 36,
  })), []);

  const stageStyle = {
    '--cx': `${cx}px`,
    '--cy': `${cy}px`,
    '--saber': saberColor,
    '--wipe': wipeColor,
    '--toRightX': `${toRightX}px`,
    '--toBotY': `${toBotY}px`,
    '--toTopOnlyY': `${toTopOnlyY}px`,
  };

  return (
    <div aria-hidden className="saber-stage" style={stageStyle}>
      {/* Reveal band — new theme paints upward behind the blade */}
      <div className="saber-reveal-band"/>

      {/* Saber rig: bloom + blade + hilt, all moving as one */}
      <div className="saber-rig">
        <div className="saber-trail"/>
        <div className="saber-bloom"/>
        <div className="saber-blade ghost-2 ghost"/>
        <div className="saber-blade ghost"/>
        <div className="saber-blade"/>
        {arcs.map((a, i) => (
          <div key={'a'+i} className="saber-arc" style={{
            position: 'absolute',
            left: 4, top: -0.75,
            width: `${a.len}px`,
            transform: `rotate(${a.rot}deg)`,
            animationDelay: `${a.delay}ms`,
          }}/>
        ))}
        <div className="saber-hilt"/>
      </div>

      {/* Origin spark + shockwaves at click point */}
      <div className="saber-origin"/>
      <div className="saber-shockwave"/>
      <div className="saber-shockwave s2"/>

      {/* Sparks shooting outward */}
      {sparks.map((s, i) => (
        <div key={i} className="saber-spark" style={{
          '--sx': `${s.sx}px`, '--sy': `${s.sy}px`,
          width: s.size, height: s.size,
          animationDelay: `${s.delay}ms`,
        }}/>
      ))}
    </div>
  );
};

const App = () => {
  const [theme, setTheme] = useStateA('light');
  const [themeTrans, setThemeTrans] = useStateA(null); // null | { dir: 'toDark'|'toLight' }
  const themeRef = useRefA(theme);
  useEffectA(() => { themeRef.current = theme; }, [theme]);

  // Cinematic lightsaber theme swap — origin-aware visuals + layered audio
  const triggerTheme = (next, evt) => {
    if (themeTrans) return; // ignore during animation
    if (!next || (typeof next === 'object' && next.clientX != null)) {
      if (next && typeof next === 'object' && next.clientX != null) evt = next;
      next = themeRef.current === 'dark' ? 'light' : 'dark';
    }
    if (next === themeRef.current) return;
    const dir = next === 'dark' ? 'toDark' : 'toLight';

    // Resolve click origin + frame dims (relative to .phone wrapper)
    let origin = null;
    try {
      const target = evt && (evt.currentTarget || evt.target);
      let frame = null;
      let r = null;
      if (evt && typeof evt.clientX === 'number' && target && target.closest) {
        frame = target.closest('.phone, .frame');
        if (frame) {
          const fr = frame.getBoundingClientRect();
          origin = { x: evt.clientX - fr.left, y: evt.clientY - fr.top, w: fr.width, h: fr.height };
        }
      }
      if (!origin) {
        const el = document.querySelector('[data-theme-toggle]') ||
                   document.querySelector('.toggle.on, .toggle');
        if (el) {
          frame = el.closest('.phone, .frame');
          const r2 = el.getBoundingClientRect();
          if (frame) {
            const fr = frame.getBoundingClientRect();
            origin = { x: r2.left + r2.width/2 - fr.left, y: r2.top + r2.height/2 - fr.top, w: fr.width, h: fr.height };
          }
        }
      }
      if (!origin && document.querySelector('.phone')) {
        const fr = document.querySelector('.phone').getBoundingClientRect();
        origin = { x: fr.width/2, y: fr.height/2, w: fr.width, h: fr.height };
      }
    } catch (e) {}

    // ===========================================================
    // Layered cinematic audio (1500ms total, sync'd to visual phases)
    //
    //   0–120ms     Tap click + sub thump + EM charge-up
    //   120–270ms   Hilt assembly: magnetic lock ping + plasma charge
    //   270–450ms   Plasma ignition sweep + crackle, hum fades in
    //   270–1500ms  Sustained plasma hum (Jedi: clean / Sith: unstable)
    //   330–690ms   Downward whoosh (lower triad descends)
    //   780–1290ms  Upward sweep: ascending tonal bloom (triad rises)
    //   1290–1500ms Plasma collapse + soft confirmation chime
    // ===========================================================
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) {
        const ctx = new AC();
        const t = ctx.currentTime;
        const isDark = dir === 'toDark';

        // Master bus
        const master = ctx.createGain();
        master.gain.value = 0.26;
        master.connect(ctx.destination);
        const mfilt = ctx.createBiquadFilter();
        mfilt.type = 'lowpass';
        mfilt.frequency.value = 9000;
        mfilt.Q.value = 0.4;
        mfilt.connect(master);

        const noiseBuf = (dur, amp = 0.6) => {
          const buf = ctx.createBuffer(1, Math.max(1, ctx.sampleRate * dur), ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * amp;
          return buf;
        };

        // -------- 1. TAP CLICK + THUMP + EM CHARGE (0–120ms) --------
        // crisp click — high-passed noise burst
        {
          const buf = ctx.createBuffer(1, ctx.sampleRate * 0.04, ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (d.length * 0.15));
          const src = ctx.createBufferSource(); src.buffer = buf;
          const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2200;
          const g = ctx.createGain(); g.gain.value = 0.22;
          src.connect(hp).connect(g).connect(mfilt);
          src.start(t);
        }
        // low thump — sub sine pulse
        {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(80, t);
          osc.frequency.exponentialRampToValueAtTime(42, t + 0.09);
          g.gain.setValueAtTime(0, t);
          g.gain.linearRampToValueAtTime(0.48, t + 0.005);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
          osc.connect(g).connect(mfilt);
          osc.start(t); osc.stop(t + 0.14);
        }
        // EM charge-up — bandpassed noise rising in pitch
        {
          const src = ctx.createBufferSource(); src.buffer = noiseBuf(0.1, 0.4);
          const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 6;
          bp.frequency.setValueAtTime(400, t + 0.04);
          bp.frequency.exponentialRampToValueAtTime(1800, t + 0.13);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0, t + 0.04);
          g.gain.linearRampToValueAtTime(0.14, t + 0.09);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
          src.connect(bp).connect(g).connect(mfilt);
          src.start(t + 0.04);
        }

        // -------- 2. HILT ASSEMBLY (120–270ms) --------
        // magnetic lock ping
        {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(2400, t + 0.13);
          osc.frequency.exponentialRampToValueAtTime(820, t + 0.24);
          g.gain.setValueAtTime(0, t + 0.13);
          g.gain.linearRampToValueAtTime(0.07, t + 0.135);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
          osc.connect(g).connect(mfilt);
          osc.start(t + 0.13); osc.stop(t + 0.27);
        }
        // plasma charging — bandpass-swept saw pair (rising)
        {
          const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.detune.value = -12;
          const o2 = ctx.createOscillator(); o2.type = 'sawtooth'; o2.detune.value = +12;
          const startF = isDark ? 60 : 90, endF = isDark ? 130 : 200;
          o1.frequency.setValueAtTime(startF, t + 0.13);
          o1.frequency.exponentialRampToValueAtTime(endF, t + 0.27);
          o2.frequency.setValueAtTime(startF * 1.5, t + 0.13);
          o2.frequency.exponentialRampToValueAtTime(endF * 1.5, t + 0.27);
          const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2;
          bp.frequency.setValueAtTime(280, t + 0.13);
          bp.frequency.exponentialRampToValueAtTime(1200, t + 0.27);
          const g = ctx.createGain();
          g.gain.setValueAtTime(0, t + 0.13);
          g.gain.linearRampToValueAtTime(0.10, t + 0.22);
          g.gain.linearRampToValueAtTime(0.14, t + 0.27);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.36);
          o1.connect(bp); o2.connect(bp);
          bp.connect(g).connect(mfilt);
          o1.start(t + 0.13); o2.start(t + 0.13);
          o1.stop(t + 0.37); o2.stop(t + 0.37);
        }

        // -------- 3. IGNITION SWEEP (270–450ms) --------
        {
          const osc = ctx.createOscillator();
          const bp = ctx.createBiquadFilter();
          const g = ctx.createGain();
          bp.type = 'bandpass'; bp.Q.value = 3;
          osc.type = 'sawtooth';
          if (isDark) {
            osc.frequency.setValueAtTime(1100, t + 0.27);
            osc.frequency.exponentialRampToValueAtTime(180, t + 0.5);
            bp.frequency.setValueAtTime(2200, t + 0.27);
            bp.frequency.exponentialRampToValueAtTime(620, t + 0.5);
          } else {
            osc.frequency.setValueAtTime(240, t + 0.27);
            osc.frequency.exponentialRampToValueAtTime(1500, t + 0.5);
            bp.frequency.setValueAtTime(600, t + 0.27);
            bp.frequency.exponentialRampToValueAtTime(2600, t + 0.5);
          }
          g.gain.setValueAtTime(0, t + 0.27);
          g.gain.linearRampToValueAtTime(0.40, t + 0.31);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
          osc.connect(bp).connect(g).connect(mfilt);
          osc.start(t + 0.27); osc.stop(t + 0.6);
        }
        // crackle layer during ignition
        {
          const buf = ctx.createBuffer(1, ctx.sampleRate * 0.4, ctx.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) {
            const env = Math.exp(-(((i - d.length * 0.1) / (d.length * 0.3)) ** 2));
            d[i] = (Math.random() * 2 - 1) * env * (Math.random() > 0.72 ? 1 : 0.18);
          }
          const src = ctx.createBufferSource(); src.buffer = buf;
          const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 2400;
          const g = ctx.createGain(); g.gain.value = 0.08;
          src.connect(hp).connect(g).connect(mfilt);
          src.start(t + 0.28);
        }

        // -------- 4. SUSTAINED PLASMA HUM (270–1500ms) --------
        const humBase = isDark ? 78 : 138;
        const humA = ctx.createOscillator();
        const humB = ctx.createOscillator();
        const humC = ctx.createOscillator();
        const humG = ctx.createGain();
        const humFilt = ctx.createBiquadFilter();
        humFilt.type = 'lowpass'; humFilt.Q.value = 4;
        humA.type = 'sawtooth'; humA.frequency.value = humBase;
        humB.type = isDark ? 'square' : 'sawtooth';
        humB.frequency.value = humBase * 1.5;
        humB.detune.value = isDark ? -22 : -8;
        humC.type = 'triangle'; humC.frequency.value = humBase * 2;
        humC.detune.value = isDark ? +18 : +5;

        // vibrato — faster/wider for dark side (unstable)
        const vib = ctx.createOscillator();
        const vibAmp = ctx.createGain();
        vib.frequency.value = isDark ? 7.4 : 5.5;
        vibAmp.gain.value = isDark ? 9 : 4;
        vib.connect(vibAmp);
        vibAmp.connect(humA.frequency); vibAmp.connect(humB.frequency); vibAmp.connect(humC.frequency);

        humG.gain.setValueAtTime(0, t + 0.27);
        humG.gain.linearRampToValueAtTime(0.18, t + 0.42);
        humG.gain.linearRampToValueAtTime(0.18, t + 1.28);
        humG.gain.linearRampToValueAtTime(0.06, t + 1.45);
        humG.gain.exponentialRampToValueAtTime(0.001, t + 1.62);
        humFilt.frequency.setValueAtTime(isDark ? 400 : 600, t + 0.27);
        humFilt.frequency.exponentialRampToValueAtTime(isDark ? 900 : 1600, t + 0.42);
        humFilt.frequency.exponentialRampToValueAtTime(isDark ? 600 : 1100, t + 1.1);
        humFilt.frequency.exponentialRampToValueAtTime(220, t + 1.6);
        humA.connect(humFilt); humB.connect(humFilt); humC.connect(humFilt);
        humFilt.connect(humG).connect(mfilt);
        humA.start(t + 0.27); humB.start(t + 0.27); humC.start(t + 0.27); vib.start(t + 0.27);
        humA.stop(t + 1.65); humB.stop(t + 1.65); humC.stop(t + 1.65); vib.stop(t + 1.65);

        // -------- 5. DOWNWARD WHOOSH (330–690ms) — descending air-pressure --------
        {
          const osc = ctx.createOscillator();
          const bp = ctx.createBiquadFilter();
          const g = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(900, t + 0.45);
          osc.frequency.exponentialRampToValueAtTime(160, t + 0.7);
          bp.type = 'bandpass'; bp.Q.value = 3;
          bp.frequency.setValueAtTime(1800, t + 0.45);
          bp.frequency.exponentialRampToValueAtTime(420, t + 0.7);
          g.gain.setValueAtTime(0, t + 0.45);
          g.gain.linearRampToValueAtTime(0.22, t + 0.5);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.74);
          osc.connect(bp).connect(g).connect(mfilt);
          osc.start(t + 0.45); osc.stop(t + 0.75);
        }
        // sub thump on arrival at bottom (~690ms)
        {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(80, t + 0.69);
          osc.frequency.exponentialRampToValueAtTime(36, t + 0.86);
          g.gain.setValueAtTime(0, t + 0.69);
          g.gain.linearRampToValueAtTime(0.42, t + 0.71);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.94);
          osc.connect(g).connect(mfilt);
          osc.start(t + 0.69); osc.stop(t + 0.95);
        }

        // -------- 6. UPWARD SWEEP (780–1290ms) — rising harmonic bloom --------
        {
          // Triad rising — major (Jedi) or minor w/ tritone (Sith)
          const baseFreq = isDark ? 110 : 220;
          const intervals = isDark ? [1, 1.5, 1.78] : [1, 1.25, 1.5];
          intervals.forEach((iv, idx) => {
            const osc = ctx.createOscillator();
            const g = ctx.createGain();
            osc.type = 'sine';
            const start = t + 0.78 + idx * 0.05;
            osc.frequency.setValueAtTime(baseFreq * iv * 0.55, start);
            osc.frequency.exponentialRampToValueAtTime(baseFreq * iv, t + 1.29);
            g.gain.setValueAtTime(0, start);
            g.gain.linearRampToValueAtTime(0.05, t + 1.05);
            g.gain.linearRampToValueAtTime(0.075, t + 1.29);
            g.gain.exponentialRampToValueAtTime(0.001, t + 1.5);
            osc.connect(g).connect(mfilt);
            osc.start(start); osc.stop(t + 1.51);
          });
        }

        // -------- 7. RETRACT + CONFIRMATION (1290–1500ms) --------
        // collapse — descending saw
        {
          const osc = ctx.createOscillator();
          const bp = ctx.createBiquadFilter();
          const g = ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(820, t + 1.29);
          osc.frequency.exponentialRampToValueAtTime(80, t + 1.46);
          bp.type = 'bandpass'; bp.Q.value = 2;
          bp.frequency.setValueAtTime(1500, t + 1.29);
          bp.frequency.exponentialRampToValueAtTime(320, t + 1.46);
          g.gain.setValueAtTime(0, t + 1.29);
          g.gain.linearRampToValueAtTime(0.17, t + 1.32);
          g.gain.exponentialRampToValueAtTime(0.001, t + 1.49);
          osc.connect(bp).connect(g).connect(mfilt);
          osc.start(t + 1.29); osc.stop(t + 1.5);
        }
        // confirmation chime — soft sine ding signalling completion
        {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = isDark ? 320 : 560;
          g.gain.setValueAtTime(0, t + 1.40);
          g.gain.linearRampToValueAtTime(0.085, t + 1.43);
          g.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
          osc.connect(g).connect(mfilt);
          osc.start(t + 1.40); osc.stop(t + 1.61);
        }

        setTimeout(() => { try { ctx.close(); } catch {} }, 1800);
      }
    } catch (e) {}

    setThemeTrans({ dir, origin });

    // Camera shake hooks — subtle frame jitter at ignition + slash impact
    const shakeAt = (delay, cls) => setTimeout(() => {
      const phone = document.querySelector('.phone');
      if (!phone) return;
      phone.classList.add(cls);
      setTimeout(() => phone.classList.remove(cls), cls === 'phone-shake' ? 280 : 220);
    }, delay);
    shakeAt(330, 'phone-shake');           // blade ignition
    shakeAt(690, 'phone-shake-slash');     // arrival at bottom

    // Cross-fade window: enable smooth color transitions on every element
    // inside the phone so the moment of setTheme() looks like a 500ms
    // dissolve, not a hard swap. Cleared after colors settle.
    const phone = document.querySelector('.phone');
    if (phone) {
      // engage transitions ~50ms before the theme attribute flips so the
      // first frame of the new theme is already animating
      setTimeout(() => phone.classList.add('theme-flipping'), 1240);
      setTimeout(() => phone.classList.remove('theme-flipping'), 1900);
    }
    // Theme attribute flip — overlay is fully covering at this moment
    setTimeout(() => setTheme(next), 1290);
    // Clean up overlay after blade retracts + hilt fades
    setTimeout(() => setThemeTrans(null), 1620);
  };
  useEffectA(() => { window.__toggleTheme = (e) => triggerTheme(undefined, e); }, []);
  const [screen, setScreen] = useStateA('home'); // home | transactions | insights | settings | onboarding
  const [sheet, setSheet] = useStateA(false);
  const [toast, setToast] = useStateA('');
  const [aiMode, setAiMode] = useStateA(false);
  const [budgetsMode, setBudgetsMode] = useStateA(false);
  const [txPreset, setTxPreset] = useStateA(null);

  // Tweaks — gestures, demo controls. Toolbar toggle activates panel.
  const { tweaks, setTweak, visible: tweaksVisible, close: closeTweaks } = useTweaks();
  const pullEnabled = !!(tweaks.gestures && tweaks.gestures.pullToRefresh);
  const showSyncedTs = !!(tweaks.demo && tweaks.demo.showSyncedTimestamp);

  // Modal/detail stack — pushed on top of base screen
  const [overlay, setOverlay] = useStateA(null); // { kind, data }
  // Sheet state for AI explain
  const [aiExplain, setAiExplain] = useStateA(null);

  // Empty state mode (toggled per screen)
  const [emptyMode, setEmptyMode] = useStateA(false);

  // First-run coachmarks after onboarding completes
  const [showCoach, setShowCoach] = useStateA(false);

  useEffectA(() => {
    document.documentElement.setAttribute('data-theme', theme);
  }, [theme]);

  const onAdd = () => setSheet(true);
  const closeSheet = () => setSheet(false);
  const [toastUndo, setToastUndo] = useStateA(null);
  const toastTimer = useRefA(null);
  const showToast = (msg, undo) => {
    if (toastTimer.current) clearTimeout(toastTimer.current);
    setToast(msg);
    setToastUndo(undo ? { fn: undo } : null);
    toastTimer.current = setTimeout(() => { setToast(''); setToastUndo(null); }, undo ? 4200 : 2200);
  };
  const onSave = ({amount}) => {
    setSheet(false);
    showToast(amount ? `Saved ₹${amount}` : 'Saved expense');
  };

  // ===== overlay nav =====
  const openTx = (tx) => setOverlay({ kind:'tx', data: tx });
  const openGoal = (goal) => setOverlay({ kind:'goal', data: goal });
  const openCategory = (cat) => setOverlay({ kind:'category', data: cat });
  useEffectA(() => { window.__openSearch = () => setOverlay({ kind:'search' }); window.__openAddGoal = () => setOverlay({ kind:'addGoal' }); window.__openProfile = () => setOverlay({ kind:'profile' }); window.__openMonthlyReview = () => setOverlay({ kind:'monthlyReview' }); window.__openMonthly = () => setOverlay({ kind:'monthly' }); window.__openReceipt = () => setOverlay({ kind:'receipt' }); window.__openAddProvider = () => setOverlay({ kind:'addProvider' }); window.__openInsight = (k) => setOverlay({ kind:'insight', data:{ insightKind:k } }); window.__quickExport = (fmt) => showToast(`Exported · ${fmt.toUpperCase()} · last 12 months`); window.__toast = (msg, undo) => showToast(msg, undo); window.__replayCoach = () => { setScreen('home'); setTimeout(() => setShowCoach(true), 200); }; }, []);
  const closeOverlay = () => setOverlay(null);

  // Onboarding mode
  if (screen === 'onboarding') {
    return (
      <div className="phone app" style={{background:'var(--bg)'}}>
        <StatusBar/>
        <Onboarding onDone={() => { setScreen('home'); showToast('Welcome to Gexpense'); setTimeout(() => setShowCoach(true), 600); }}/>
        {themeTrans && <ThemeTransition dir={themeTrans.dir} origin={themeTrans.origin}/>}
      </div>
    );
  }

  // Empty mode
  if (emptyMode) {
    return (
      <div className="phone app" style={{background:'var(--bg)'}}>
        <StatusBar/>
        <div style={{position:'absolute', top:42, right:18, zIndex:30}}>
          <button onClick={() => setEmptyMode(false)} className="btn btn-ghost" style={{padding:'6px 10px', fontSize:11, fontWeight:600, background:'var(--surface)', border:'1px solid var(--line)'}}>← Exit</button>
        </div>
        <EmptyState kind={emptyMode} onAction={(a) => {
          if (a === 'connect') { setEmptyMode(false); setScreen('onboarding'); }
          else if (a === 'add') { setEmptyMode(false); setSheet(true); }
          else { setEmptyMode(false); }
        }}/>
        <TabBar active={screen} onChange={() => {}} onAdd={() => {}}/>
      </div>
    );
  }

  // Render base screen
  const renderScreen = () => {
    if (screen === 'home') return <Dashboard pullEnabled={pullEnabled} onAdd={onAdd} onNavigate={(s, preset) => {
      if (s === 'tx') return openTx(preset);
      if (s === 'inbox') return setOverlay({ kind:'inbox' });
      if (s === 'settings' && preset === 'ai') { setScreen('settings'); setAiMode(true); setBudgetsMode(false); return; }
      if (s === 'settings' && preset === 'budgets') { setScreen('settings'); setBudgetsMode(true); setAiMode(false); return; }
      setScreen(s);
      if (preset !== undefined && typeof preset === 'string' && s === 'transactions') setTxPreset(preset);
    }}/>;
    if (screen === 'transactions') return <Transactions pullEnabled={pullEnabled} showSyncedTimestamp={showSyncedTs} filterPreset={txPreset} onClearPreset={() => setTxPreset(null)} onTxOpen={openTx}/>;
    if (screen === 'insights') return <Insights onCategoryOpen={openCategory} onAIExplain={setAiExplain}/>;
    if (screen === 'settings') {
      if (aiMode) return <div onClick={(e) => { if (e.target.closest('.small') && e.target.textContent.includes('Settings')) setAiMode(false); }}><SettingsAI/></div>;
      if (budgetsMode) return <Budgets onBack={() => setBudgetsMode(false)} onGoalOpen={openGoal} onCategoryOpen={openCategory} onAddBudget={() => setOverlay({ kind:'addBudget' })}/>;
      return <SettingsWrapper
        theme={theme} onTheme={triggerTheme}
        onAi={() => setAiMode(true)}
        onBudgets={() => setBudgetsMode(true)}
        onOnboarding={() => setScreen('onboarding')}
        onEmpty={(k) => setEmptyMode(k)}
        onBank={() => setOverlay({ kind:'bank' })}
        onMonthly={() => setOverlay({ kind:'monthly' })}
        onNotifs={() => setOverlay({ kind:'notifs' })}
        onExport={() => setOverlay({ kind:'export' })}
        onPrivacy={() => setOverlay({ kind:'privacy' })}
        onRecurring={() => setOverlay({ kind:'recurring' })}
      />;
    }
    return null;
  };

  return (
    <div className="phone app" style={{background:'var(--bg)'}}>
      <StatusBar/>
      {renderScreen()}
      <TabBar active={screen} onChange={(s) => { setScreen(s); if (s === 'settings') { setAiMode(false); setBudgetsMode(false); } if (s !== 'transactions') setTxPreset(null); }} onAdd={onAdd} onAddLong={() => setOverlay({ kind:'quickActions' })}/>

      {/* Quick add */}
      <div className={`scrim ${sheet ? 'open' : ''}`} onClick={closeSheet}/>
      <QuickAddSheet open={sheet} onClose={closeSheet} onSave={onSave}/>

      {/* Overlay screens (slide up from bottom, full surface) */}
      {overlay && (
        <div className="overlay-screen open">
          {overlay.kind === 'tx' && <TxDetail tx={overlay.data} onBack={closeOverlay} onSaved={(m) => { closeOverlay(); showToast(m); }} onDeleted={() => { closeOverlay(); showToast('Deleted', () => showToast('Restored')); }}/>}
          {overlay.kind === 'goal' && <GoalDetail goal={overlay.data} onBack={closeOverlay}/>}
          {overlay.kind === 'category' && <CategoryDetail cat={overlay.data} onBack={closeOverlay}/>}
          {overlay.kind === 'addBudget' && <AddBudget onBack={closeOverlay} onSave={(name) => { closeOverlay(); showToast(`Budget added · ${name}`); }}/>}
          {overlay.kind === 'bank' && <BankAccounts onBack={closeOverlay}/>}
          {overlay.kind === 'monthly' && <MonthlyBudget onBack={closeOverlay} onSave={(amt) => { closeOverlay(); showToast(`Budget set · ₹${amt.toLocaleString('en-IN')}`); }}/>}
          {overlay.kind === 'notifs' && <NotificationsSettings onBack={closeOverlay}/>}
          {overlay.kind === 'export' && <ExportData onBack={closeOverlay} onExport={(label) => { closeOverlay(); showToast(`Exported · ${label}`); }}/>}
          {overlay.kind === 'privacy' && <PrivacyData onBack={closeOverlay} onDeleteAccount={() => { closeOverlay(); showToast('Account scheduled for deletion'); }}/>}
          {overlay.kind === 'recurring' && <Recurring onBack={closeOverlay}/>}
          {overlay.kind === 'addGoal' && <AddGoal onBack={closeOverlay} onSave={(g) => { closeOverlay(); showToast(`Goal · ${g.name}`); }}/>}
          {overlay.kind === 'search' && <SearchTxs onBack={closeOverlay} onTxOpen={openTx}/>}
          {overlay.kind === 'inbox' && <NotificationsInbox onBack={closeOverlay} onTxOpen={openTx}/>}
          {overlay.kind === 'profile' && <ProfileEdit onBack={closeOverlay} onSave={() => { closeOverlay(); showToast('Profile updated'); }}/>}
          {overlay.kind === 'receipt' && <ReceiptCapture onBack={closeOverlay} onSave={(f) => { closeOverlay(); showToast(`Saved ₹${f.amount} · ${f.merchant.split('·')[0].trim()}`); }}/>}
          {overlay.kind === 'monthlyReview' && <MonthlyReview onBack={closeOverlay}/>}
          {overlay.kind === 'addProvider' && <AddProvider onBack={closeOverlay} onAdd={(p) => { closeOverlay(); showToast(`Added · ${p.vendor}`); }}/>}
          {overlay.kind === 'insight' && <SmartInsight kind={overlay.data?.insightKind || 'subs'} onBack={closeOverlay} onAction={(a, ins) => {
            if (a.kind === 'feedback') { closeOverlay(); showToast('Thanks · we\'ll tune this'); }
            else if (a.kind === 'mute') { closeOverlay(); showToast(`Muted · ${ins.eyebrow} insights for 30 days`); }
            else if (a.kind === 'why') { showToast('Tap a step in "How we got this" for details'); }
            else { closeOverlay(); showToast(a.label); }
          }}/>}
        </div>
      )}

      {/* Quick actions menu — long-press FAB */}
      {overlay && overlay.kind === 'quickActions' && (
        <QuickActions
          onClose={closeOverlay}
          onPick={(k) => {
            closeOverlay();
            if (k === 'scan') setOverlay({ kind:'receipt' });
            else if (k === 'recurring') setOverlay({ kind:'recurring' });
            else if (k === 'split') showToast('Split with friends · coming soon');
            else if (k === 'manual') setSheet(true);
          }}
        />
      )}

      {/* Coachmarks after onboarding handoff */}
      {showCoach && (
        <Coachmarks
          steps={[
            { selector: '.fab', title: 'Add an expense', body: 'Tap once to log manually. Long-press for scan, recurring, or split.' },
            { selector: '[data-bell]', title: 'Your inbox', body: 'New auto-extracted expenses and weekly insights land here.' },
            { selector: '[data-ai-ticker]', title: 'AI insights', body: 'Rotating tips watching your spend — tap "Why?" to see the receipts behind any insight.' },
            { selector: '[data-sync-pill]', title: 'Auto-syncing', body: 'Gexpense fetches new transactions from Gmail & SMS in the background. Tap to refresh now.' },
          ]}
          onDone={() => setShowCoach(false)}
        />
      )}

      {/* AI Explain sheet */}
      {aiExplain && <AIExplain insight={aiExplain} onClose={() => setAiExplain(null)}/>}

      <div className={`toast ${toast ? 'show' : ''}`}>
        <span className="check"><Icon name="check" size={11} stroke={3}/></span>
        {toast || 'Saved'}
        {toastUndo && (
          <button onClick={() => { toastUndo.fn(); setToast(''); setToastUndo(null); }} style={{marginLeft:10, padding:'2px 8px', borderRadius:99, border:'1px solid color-mix(in srgb, var(--bg) 30%, transparent)', background:'transparent', color:'var(--bg)', fontFamily:'inherit', fontSize:12, fontWeight:600, cursor:'pointer'}}>Undo</button>
        )}
      </div>

      <TweaksPanel tweaks={tweaks} setTweak={setTweak} visible={tweaksVisible} onClose={closeTweaks}/>

      {themeTrans && <ThemeTransition dir={themeTrans.dir} origin={themeTrans.origin}/>}
    </div>
  );
};

<div id="pwa-install-sheet" style="
  display:none; position:fixed; bottom:0; left:0; right:0; z-index:99999;
  background:var(--surface,#fff); border-radius:22px 22px 0 0;
  box-shadow:0 -4px 32px rgba(0,0,0,0.14); padding:0 0 env(safe-area-inset-bottom,16px);
  font-family:'Geist',system-ui,sans-serif;
">
  <div style="width:36px;height:4px;border-radius:2px;background:var(--line,rgba(0,0,0,0.12));margin:12px auto 0;"></div>
  <div style="padding:20px 24px 24px;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:18px;">
      <div style="width:48px;height:48px;border-radius:12px;background:#0F8A5F;display:grid;place-items:center;flex-shrink:0;">
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none"><text x="4" y="20" fill="white" font-size="18" font-weight="700" font-family="Geist,system-ui">G</text></svg>
      </div>
      <div>
        <div style="font-size:17px;font-weight:700;color:var(--ink,#131313);">Add Gexpense to Home Screen</div>
        <div style="font-size:13px;color:var(--ink-3,#6B6B66);margin-top:2px;">Install for fast, app-like access</div>
      </div>
    </div>
    <div id="pwa-steps" style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;"></div>
    <button id="pwa-dismiss" style="
      width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line,rgba(0,0,0,0.1));
      background:transparent;font-size:15px;font-weight:600;color:var(--ink-2,#3D3D3B);
      cursor:pointer;font-family:inherit;
    ">Maybe Later</button>
  </div>
</div>
<div id="pwa-scrim" style="display:none;position:fixed;inset:0;z-index:99998;background:rgba(0,0,0,0.4);"></div>

<script>
(function() {
  var DISMISSED_KEY = 'gx_install_dismissed';
  var sheet = document.getElementById('pwa-install-sheet');
  var scrim = document.getElementById('pwa-scrim');
  var stepsEl = document.getElementById('pwa-steps');
  var btn = document.getElementById('pwa-dismiss');

  // Don't show if standalone (already installed) or dismissed
  if (window.matchMedia('(display-mode: standalone)').matches) return;
  if (window.navigator.standalone) return;
  if (sessionStorage.getItem(DISMISSED_KEY)) return;

  var ua = navigator.userAgent;
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  var isAndroid = /Android/i.test(ua);
  if (!isIOS && !isAndroid) return;

  function makeStep(num, icon, text) {
    return '<div style="display:flex;align-items:flex-start;gap:12px;">'
      + '<div style="width:28px;height:28px;border-radius:50%;background:var(--brand-50,rgba(15,138,95,0.10));'
      + 'color:#0F8A5F;font-size:13px;font-weight:700;display:grid;place-items:center;flex-shrink:0;">' + num + '</div>'
      + '<div style="padding-top:4px;">'
      + '<div style="font-size:14px;font-weight:600;color:var(--ink,#131313);">' + icon + '</div>'
      + '<div style="font-size:13px;color:var(--ink-3,#6B6B66);margin-top:2px;">' + text + '</div>'
      + '</div></div>';
  }

  var steps = '';
  if (isIOS) {
    steps += makeStep('1', 'Tap the Share button ⬆', 'The box-with-arrow icon at the bottom of Safari');
    steps += makeStep('2', 'Scroll down and tap "Add to Home Screen"', 'Look for the + icon in the share sheet');
    steps += makeStep('3', 'Tap "Add" in the top-right corner', 'Gexpense will appear on your home screen');
  } else {
    steps += makeStep('1', 'Tap the menu button ⋮', 'Three dots in the top-right corner of Chrome');
    steps += makeStep('2', 'Tap "Add to Home screen" or "Install app"', 'Usually near the top of the menu');
    steps += makeStep('3', 'Tap "Add" or "Install" to confirm', 'Gexpense will appear on your home screen');
  }
  stepsEl.innerHTML = steps;

  function close() {
    sessionStorage.setItem(DISMISSED_KEY, '1');
    sheet.style.display = 'none';
    scrim.style.display = 'none';
  }

  btn.addEventListener('click', close);
  scrim.addEventListener('click', close);

  // Android: use native install prompt if available
  var deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault();
    deferredPrompt = e;
    // Replace steps with native prompt button
    stepsEl.innerHTML = '<div style="font-size:14px;color:var(--ink-2,#3D3D3B);">Your browser supports one-tap installation.</div>';
    btn.textContent = 'Install App';
    btn.style.background = '#0F8A5F';
    btn.style.color = '#fff';
    btn.style.border = 'none';
    btn.removeEventListener('click', close);
    btn.addEventListener('click', function() {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function() { close(); });
    });
  });

  // Show after short delay so the app has rendered
  setTimeout(function() {
    sheet.style.display = 'block';
    scrim.style.display = 'block';
    sheet.style.transform = 'translateY(100%)';
    sheet.style.transition = 'transform 0.35s cubic-bezier(0.4,0,0.2,1)';
    requestAnimationFrame(function() {
      requestAnimationFrame(function() {
        sheet.style.transform = 'translateY(0)';
      });
    });
  }, 1800);
})();
</script>

</body>
