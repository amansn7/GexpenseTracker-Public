name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: expense
          POSTGRES_PASSWORD: expense
          POSTGRES_DB: expense_tracker
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://expense:expense@localhost:5432/expense_tracker
      GOOGLE_CLIENT_ID: test
      GOOGLE_CLIENT_SECRET: test
      SECRET_KEY: test-secret-test-secret-test-secret-32
      TESTING: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v --tb=short --ignore=tests/test_llm_client.py

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff lint
        run: ruff check app/ tests/

      - name: Run ruff format check
        run: ruff format --check app/ tests/

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy type check
        run: mypy app/config.py app/database.py app/crypto.py app/csrf.py app/jwt_utils.py app/rate_limiter.py app/alerts.py app/url_utils.py app/workers/queue.py app/classifier/groq_rate_limiter.py --ignore-missing-imports --no-error-summary --follow-imports=skip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run security audit
        run: pip-audit -r requirements.txt

      - name: Install coverage
        run: pip install pytest-cov

      - name: Run tests with coverage
        run: pytest -v --tb=short --ignore=tests/test_llm_client.py --cov=app --cov-report=term-missing --cov-fail-under=60
