<!doctype html>
<html lang="en" data-theme="paper">
<script>try{var t=localStorage.getItem("mf_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MoneyFlow — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css?v=10">
<script src="/static/vendor/three.min.js"></script>
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Geist',system-ui,sans-serif; font-size:14px; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .wrap { max-width:380px; width:100%; padding:48px 40px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 32px -8px rgba(0,0,0,0.08); position:relative; z-index:1; }
  h1 { font-family:'Fraunces',serif; font-size:40px; font-weight:400; letter-spacing:-0.03em; margin:0 0 8px; }
  .tagline { font-size:14px; color:var(--ink-3); margin:0 0 40px; }
  .btn { display:inline-flex; align-items:center; gap:10px; padding:12px 24px; background:var(--ink); color:var(--paper); border:none; border-radius:8px; font-size:14px; font-family:'Geist',sans-serif; font-weight:500; cursor:pointer; text-decoration:none; transition:opacity 120ms; }
  .btn:hover { opacity:0.85; }
  .btn svg { flex-shrink:0; }
  .footer { margin-top:48px; font-size:12px; color:var(--ink-3); }
  @media (max-width:480px){ .wrap { padding:28px 20px; } }
  .tgl { position:fixed; bottom:20px; right:20px; z-index:2; width:36px; height:36px; border-radius:999px; background:var(--card); border:1px solid var(--line); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink-2); padding:0; box-shadow:0 2px 8px rgba(0,0,0,0.08); transition:transform 400ms cubic-bezier(.34,1.56,.64,1); }
  .tgl:hover { transform:scale(1.1); }
  .tgl:active { transform:scale(0.86); }
</style>
</head>
<body>
<div id="bg" style="position:fixed;inset:0;pointer-events:none;z-index:0"></div>
<button class="tgl" id="tgl" aria-label="Toggle theme">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="overflow:visible">
    <defs>
      <mask id="tgl-mask">
        <rect x="0" y="0" width="100%" height="100%" fill="white" />
        <circle id="tgl-mc" cx="33" cy="0" r="9" fill="black" style="transition:cx 400ms cubic-bezier(.34,1.56,.64,1),cy 400ms cubic-bezier(.34,1.56,.64,1)" />
      </mask>
    </defs>
    <circle id="tgl-body" cx="12" cy="12" r="5" fill="currentColor" stroke="none" mask="url(#tgl-mask)" style="transition:r 400ms cubic-bezier(.34,1.56,.64,1)" />
    <g id="tgl-rays" opacity="1" style="transition:opacity 400ms cubic-bezier(.34,1.56,.64,1),transform 400ms cubic-bezier(.34,1.56,.64,1);transform-origin:12px 12px">
      <line x1="12" y1="1" x2="12" y2="3" />
      <line x1="12" y1="21" x2="12" y2="23" />
      <line x1="1" y1="12" x2="3" y2="12" />
      <line x1="21" y1="12" x2="23" y2="12" />
      <line x1="5.64" y1="5.64" x2="4.22" y2="4.22" />
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
      <line x1="5.64" y1="18.36" x2="4.22" y2="19.78" />
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
    </g>
  </svg>
</button>
<div class="wrap">
  <h1>MoneyFlow</h1>
  <p class="tagline">Your inbox for money.</p>
  <a class="btn" href="/api/auth/google">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
      <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
      <path d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
    </svg>
    Sign in with Google
  </a>
  <p class="footer">Self-hosted · your data stays local</p>
</div>
<script>
(function(){
  var el=document.getElementById("bg"),html=document.documentElement,tgl=document.getElementById("tgl");
  var mc=document.getElementById("tgl-mc"),bodyEl=document.getElementById("tgl-body"),rays=document.getElementById("tgl-rays");
  var SEP=150,AX=40,AY=60;

  function dark(){return html.getAttribute("data-theme")==="midnight";}
  function bgHex(){return dark()?0x14120e:0xf6f3ec;}
  function dotRGB(){return dark()?[200,200,200]:[0,0,0];}

  var scene=new THREE.Scene(),fog=new THREE.Fog(bgHex(),2000,10000);
  scene.fog=fog;
  var camera=new THREE.PerspectiveCamera(60,window.innerWidth/window.innerHeight,1,10000);
  camera.position.set(0,355,1220);
  var renderer=new THREE.WebGLRenderer({alpha:true,antialias:true});
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.setClearColor(fog.color,0);
  el.appendChild(renderer.domElement);

  var pos=[],col=[],dc=dotRGB();
  for(var ix=0;ix<AX;ix++)for(var iy=0;iy<AY;iy++){
    pos.push(ix*SEP-(AX*SEP)/2,0,iy*SEP-(AY*SEP)/2);
    col.push(dc[0],dc[1],dc[2]);
  }
  var geo=new THREE.BufferGeometry();
  geo.setAttribute("position",new THREE.Float32BufferAttribute(pos,3));
  var colorAttr=new THREE.Float32BufferAttribute(col,3);
  geo.setAttribute("color",colorAttr);
  var mat=new THREE.PointsMaterial({size:8,vertexColors:true,transparent:true,opacity:0.8,sizeAttenuation:true});
  var pts=new THREE.Points(geo,mat);
  scene.add(pts);

  var count=0,frame;

  function animate(){
    frame=requestAnimationFrame(animate);
    var p=geo.attributes.position.array,i=0;
    for(var ix=0;ix<AX;ix++)for(var iy=0;iy<AY;iy++){
      var idx=i*3;
      p[idx+1]=Math.sin((ix+count)*0.3)*50+Math.sin((iy+count)*0.5)*50;
      i++;
    }
    geo.attributes.position.needsUpdate=true;
    renderer.render(scene,camera);
    count+=0.1;
  }

  function onResize(){
    camera.aspect=window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth,window.innerHeight);
  }
  window.addEventListener("resize",onResize);

  var _atCtx=null,_atBuf=null,_atLast=0;
  function tick(){
    var now=performance.now();
    if(now-_atLast<80)return;
    _atLast=now;
    try{
      if(!_atCtx)_atCtx=new(window.AudioContext||window.webkitAudioContext)();
      if(_atCtx.state==="suspended")_atCtx.resume();
      var ac=_atCtx;
      if(!_atBuf||_atBuf.sampleRate!==ac.sampleRate){
        var rate=ac.sampleRate,len=Math.floor(rate*0.006),buf=ac.createBuffer(1,len,rate),ch=buf.getChannelData(0);
        for(var i=0;i<len;i++){var t=i/len;ch[i]=(Math.sin(2*Math.PI*3400*t)*0.6+(Math.random()*2-1)*0.4)*Math.pow(1-t,3);}
        _atBuf=buf;
      }
      var src=ac.createBufferSource(),gain=ac.createGain();
      src.buffer=_atBuf;gain.gain.value=0.08;
      src.connect(gain);gain.connect(ac.destination);
      src.start();
    }catch(e){}
  }

  function updateTheme(){
    var d=dark(),dc2=dotRGB(),ca=colorAttr.array;
    for(var j=0;j<ca.length;j+=3){ca[j]=dc2[0];ca[j+1]=dc2[1];ca[j+2]=dc2[2];}
    colorAttr.needsUpdate=true;
    fog.color.setHex(bgHex());
    renderer.setClearColor(fog.color,0);
    mc.style.setProperty("cx",d?"17":"33");
    mc.style.setProperty("cy",d?"8":"0");
    bodyEl.style.setProperty("r",d?"9":"5");
    rays.style.opacity=d?"0":"1";
    rays.style.transform=d?"scale(0) rotate(-30deg)":"scale(1) rotate(0deg)";
  }

  tgl.onclick=function(){var n=dark()?"paper":"midnight";html.setAttribute("data-theme",n);localStorage.setItem("mf_theme",n);tick();};
  var obs=new MutationObserver(updateTheme);
  obs.observe(html,{attributes:true,attributeFilter:["data-theme"]});
  updateTheme();
  animate();
})();
</script>
</body>
</html>
