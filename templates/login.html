<script nonce="{{ request.state.nonce }}">
(function(){
  var btn = document.getElementById("passkey-btn");
  if (!window.PublicKeyCredential) {
    btn.style.display = "none";
    return;
  }
  btn.addEventListener("click", async function() {
    btn.disabled = true;
    btn.querySelector("span").textContent = "Checking your device…";
    try {
      var begin = await fetch("/api/auth/passkey/login/begin", { method: "POST" });
      if (!begin.ok) throw new Error("Failed to start");
      var opts = await begin.json();
      var challengeRaw = opts.challenge_b64.replace(/-/g, "+").replace(/_/g, "/");
      while (challengeRaw.length % 4) challengeRaw += "=";
      var credential = await navigator.credentials.get({
        publicKey: {
          challenge: Uint8Array.from(atob(challengeRaw), function(c){return c.charCodeAt(0);}).buffer,
          allowCredentials: opts.options.allowCredentials || [],
          timeout: opts.options.timeout || 60000,
          userVerification: opts.options.userVerification || "required",
          rpId: opts.options.rpId
        }
      });
      if (!credential) throw new Error("No credential returned");
      var comp = await fetch("/api/auth/passkey/login/complete", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          credential: {
            id: credential.id,
            rawId: arrayToBase64(new Uint8Array(credential.rawId)),
            type: credential.type,
            response: {
              authenticatorData: arrayToBase64(new Uint8Array(credential.response.authenticatorData)),
              clientDataJSON: arrayToBase64(new Uint8Array(credential.response.clientDataJSON)),
              signature: arrayToBase64(new Uint8Array(credential.response.signature)),
              userHandle: credential.response.userHandle ? arrayToBase64(new Uint8Array(credential.response.userHandle)) : null
            }
          },
          challenge_b64: opts.challenge_b64,
          challenge_sig: opts.challenge_sig
        })
      });
      if (!comp.ok) {
        var err = await comp.json();
        throw new Error(err.detail || "Verification failed");
      }
      var data = await comp.json();
      if (data.google_connected) {
        window.location.href = "/";
      } else {
        document.getElementById("passkey-section").style.display = "none";
        document.getElementById("google-section").style.display = "block";
      }
    } catch(e) {
      console.error("Passkey login failed:", e);
      btn.querySelector("span").textContent = "Try again";
      btn.disabled = false;
    }
  });
  function arrayToBase64(arr) {
    var bin = "";
    for (var i = 0; i < arr.length; i++) bin += String.fromCharCode(arr[i]);
    return btoa(bin);
  }
})();
</script>
