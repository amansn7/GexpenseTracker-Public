<!doctype html>
<html lang="en" data-theme="paper">
<script>try{var t=localStorage.getItem("mf_theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>MoneyFlow — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Geist:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css?v=10">
<style>
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--paper); color:var(--ink); font-family:'Geist',system-ui,sans-serif; font-size:14px; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .wrap { max-width:380px; width:100%; padding:48px 40px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:12px; box-shadow:0 8px 32px -8px rgba(0,0,0,0.08); position:relative; z-index:1; }
  h1 { font-family:'Fraunces',serif; font-size:40px; font-weight:400; letter-spacing:-0.03em; margin:0 0 8px; }
  .tagline { font-size:14px; color:var(--ink-3); margin:0 0 40px; }
  .btn { display:inline-flex; align-items:center; gap:10px; padding:12px 24px; background:var(--ink); color:var(--paper); border:none; border-radius:8px; font-size:14px; font-family:'Geist',sans-serif; font-weight:500; cursor:pointer; text-decoration:none; transition:opacity 120ms; }
  .btn:hover { opacity:0.85; }
  .btn svg { flex-shrink:0; }
  .footer { margin-top:48px; font-size:12px; color:var(--ink-3); }
  .tgl { position:fixed; bottom:20px; right:20px; z-index:2; width:36px; height:36px; border-radius:999px; background:var(--card); border:1px solid var(--line); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--ink-2); padding:0; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
</style>
</head>
<body>
<canvas id="bg" style="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0"></canvas>
<button class="tgl" id="tgl" aria-label="Toggle theme">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" id="tgl-svg"></svg>
</button>
<div class="wrap">
  <h1>MoneyFlow</h1>
  <p class="tagline">Your inbox for money.</p>
  <a class="btn" href="/api/auth/google">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
      <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 01-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
      <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
      <path d="M3.964 10.706A5.41 5.41 0 013.682 9c0-.593.102-1.17.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
      <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 7.294C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
    </svg>
    Sign in with Google
  </a>
  <p class="footer">Self-hosted · your data stays local</p>
</div>
<script>
(function(){
  var c=document.getElementById("bg"),ctx=c.getContext("2d"),SEP=60,frame,count=0,w,h,cols,rows,dots;
  var tgl=document.getElementById("tgl"),svg=document.getElementById("tgl-svg"),html=document.documentElement;

  function resize(){w=c.width=window.innerWidth;h=c.height=window.innerHeight;cols=Math.ceil(w/SEP)+1;rows=Math.ceil(h/SEP)+1;dots=[];for(var ix=0;ix<cols;ix++)for(var iy=0;iy<rows;iy++)dots.push({x:ix*SEP,y:iy*SEP});}
  function dark(){return html.getAttribute("data-theme")==="midnight";}
  function draw(){
    count+=0.04;
    ctx.clearRect(0,0,w,h);
    var isDark=dark();
    for(var i=0;i<dots.length;i++){
      var d=dots[i],wave=Math.sin((d.x+count*40)*0.008)*12+Math.sin((d.y+count*25)*0.006)*12,r=2+wave/8;
      ctx.beginPath();ctx.arc(d.x,d.y+wave,Math.max(0.5,r),0,Math.PI*2);
      ctx.fillStyle=isDark?"rgba(200,200,200,"+Math.min(0.5,0.15+wave/120)+")":"rgba(0,0,0,"+Math.min(0.5,0.08+wave/200)+")";
      ctx.fill();
    }
    frame=requestAnimationFrame(draw);
  }
  function updateIcon(){
    var d=dark();
    svg.innerHTML=d?'<circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>':'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
  }
  tgl.onclick=function(){var n=dark()?"paper":"midnight";html.setAttribute("data-theme",n);localStorage.setItem("mf_theme",n);updateIcon();};
  updateIcon();
  var obs=new MutationObserver(function(){updateIcon();});
  obs.observe(html,{attributes:true,attributeFilter:["data-theme"]});
  window.addEventListener("resize",resize);
  resize();draw();
})();
</script>
</body>
</html>
