{% extends "base.html" %}
{% block page_name %}review{% endblock %}
{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
  <h2 style="font-size:18px">Needs Review</h2>
  <div style="display:flex;align-items:center;gap:12px">
    <span id="review-count-label" style="font-size:13px;color:#555"></span>
    <button class="btn-primary" id="reprocess-all-btn" onclick="startReprocessAll()">↻ Reprocess All</button>
  </div>
</div>

<!-- Bulk reprocess progress bar -->
<div id="bulk-progress-wrap" style="display:none;margin-bottom:16px">
  <div class="glass" style="padding:14px 16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <span style="font-size:13px;font-weight:600;color:#ccc">Reprocessing queue…</span>
      <span id="bulk-progress-label" style="font-size:12px;color:#7c83fd"></span>
    </div>
    <div style="background:#1e1e32;border-radius:3px;height:6px;overflow:hidden">
      <div id="bulk-progress-bar" style="height:6px;background:linear-gradient(90deg,#7c83fd,#a78bfa);border-radius:3px;width:0%;transition:width .4s"></div>
    </div>
    <div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:#555">
      <span id="bulk-moved-out"></span>
      <span id="bulk-errors"></span>
    </div>
  </div>
</div>

<div id="review-list"></div>

<style>
  .review-card { margin-bottom: 14px; }
  .review-snippet {
    color: var(--muted); font-size: 13px; margin-bottom: 16px;
    line-height: 1.6; padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: var(--r-sm); border-left: 3px solid var(--border);
  }
  .label-btns { display: flex; gap: 8px; margin-bottom: 12px; }
  .label-btn {
    flex: 1; padding: 9px 0; border: 1px solid var(--border);
    border-radius: var(--r-sm); cursor: pointer; font-size: 13px;
    font-weight: 600; background: var(--bg-card); color: var(--muted);
    transition: all .15s;
  }
  .label-btn:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }
  .label-btn.active-expense { border-color: var(--red);   background: rgba(224,112,112,0.1); color: var(--red); }
  .label-btn.active-income  { border-color: var(--green); background: rgba(93,184,125,0.1);  color: var(--green); }
  .label-btn.active-ignore  { border-color: var(--muted); background: rgba(255,255,255,0.04); color: #888; }
  .field-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 12px; }
  .field-group { display: flex; flex-direction: column; gap: 4px; }
  .field-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  .amount-wrap { display: none; }
  .amount-wrap.visible { display: block; }
  .cat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .cat-chip {
    padding: 3px 10px; border-radius: 20px;
    border: 1px solid var(--border); background: transparent;
    color: var(--muted); cursor: pointer; font-size: 12px; transition: all .12s;
  }
  .cat-chip:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }
  .cat-chip.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
  .batch-banner {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--r-sm); padding: 10px 14px; margin-bottom: 12px;
    display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--muted);
  }
  .batch-btns { display: flex; gap: 8px; }
  .batch-btn {
    padding: 4px 12px; border-radius: var(--r-sm);
    border: 1px solid var(--border-act); background: transparent;
    color: var(--accent); cursor: pointer; font-size: 12px; transition: background .12s;
  }
  .batch-btn:hover { background: var(--accent-soft); }
  .ai-hint { font-size: 11px; color: var(--dim); margin-bottom: 8px; }

  /* Slide-out animation for confirmed cards */
  @keyframes cardOut {
    from { opacity: 1; transform: translateX(0); max-height: 400px; margin-bottom: 14px; }
    to   { opacity: 0; transform: translateX(60px); max-height: 0; margin-bottom: 0; overflow: hidden; }
  }
  .card-removing { animation: cardOut 250ms ease both; pointer-events: none; }

  /* Keyboard focus ring on cards */
  .review-card:focus-within .glass-header { border-color: rgba(124,131,253,0.3); }
</style>

<script>
const CATEGORIES = ['Food & Dining','Groceries','Rent','Transport','Travel','Shopping','Entertainment','Healthcare','Education','Subscriptions','Utilities','CC Payment','Transfers','Other'];

let _items = [];

function _esc(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function loadReview() {
  _items = await fetch('/api/review').then(r => r.json());
  const el = document.getElementById('review-list');
  const countEl = document.getElementById('review-count-label');
  if (!_items.length) {
    el.innerHTML = '<div style="color:#555;padding:40px;text-align:center">All clear — no emails need review.</div>';
    countEl.textContent = '';
    return;
  }
  countEl.textContent = `${_items.length} email${_items.length > 1 ? 's' : ''} to review`;
  el.innerHTML = _items.map(t => _renderCard(t)).join('');
}

function _renderCard(t) {
  const hasBatch = t.domain_count > 0 && t.email.sender_domain;
  const aiLabel = t.confidence > 0
    ? `AI classified as <strong>${t.label}</strong> (${Math.round(t.confidence * 100)}% confidence)`
    : 'No AI classification';
  const gmailHref = /^https?:\/\//.test(t.email.gmail_link || '') ? t.email.gmail_link : '#';

  return `<div class="glass review-card" id="review-${t.id}">
    <div class="glass-header">
      <div>
        <strong style="color:var(--text)">${_esc(t.email.subject || '(no subject)')}</strong>
        <span style="color:var(--muted);font-size:12px;margin-left:10px">${_esc(t.email.sender || '')}</span>
        <span style="color:var(--dim);font-size:12px;margin-left:8px">${t.email.received_at ? t.email.received_at.slice(0,10) : ''}</span>
      </div>
      <a href="${_esc(gmailHref)}" target="_blank" class="link" style="font-size:12px">Gmail ↗</a>
    </div>
    <div style="padding:14px 16px">
      ${t.email.body_snippet ? `<div class="review-snippet">${_esc(t.email.body_snippet)}</div>` : ''}
      <div class="ai-hint">${aiLabel}</div>

      ${hasBatch ? `<div class="batch-banner">
        <span>${t.domain_count} more from <code style="color:var(--accent)">${_esc(t.email.sender_domain)}</code></span>
        <div class="batch-btns">
          <button class="batch-btn" onclick="batchAction('ignore_domain','${_esc(t.email.sender_domain)}',null,'${t.id}')">Ignore all</button>
          <button class="batch-btn" onclick="batchAction('expense_domain','${_esc(t.email.sender_domain)}',null,'${t.id}')">Expense all</button>
        </div>
      </div>` : ''}

      <div style="margin-bottom:10px">
        <button type="button" class="btn-ghost" style="padding:5px 14px;font-size:12px" id="reprocess-${t.id}" onclick="reprocess('${t.id}')">↻ Reprocess</button>
        <span id="reprocess-msg-${t.id}" style="font-size:12px;margin-left:10px"></span>
      </div>

      <div class="label-btns">
        <button type="button" class="label-btn" id="lbl-expense-${t.id}" onclick="selectLabel('${t.id}','expense')">Expense</button>
        <button type="button" class="label-btn" id="lbl-income-${t.id}"  onclick="selectLabel('${t.id}','income')">Income</button>
        <button type="button" class="label-btn" id="lbl-ignore-${t.id}"  onclick="selectLabel('${t.id}','ignore')">Ignore</button>
      </div>

      <div class="cat-chips" id="chips-${t.id}">
        ${CATEGORIES.map(c => `<button type="button" class="cat-chip${t.category === c ? ' active' : ''}" onclick="selectCat('${t.id}','${c}')">${c}</button>`).join('')}
        <input type="text" id="custom-cat-${t.id}" placeholder="Custom…" style="width:100px;padding:3px 8px;font-size:12px" oninput="selectCat('${t.id}',this.value)">
      </div>

      <div class="field-row">
        <div class="field-group amount-wrap" id="amt-wrap-${t.id}">
          <label class="field-label">Amount (₹)</label>
          <input type="number" step="0.01" min="0" id="amt-${t.id}" value="${t.amount ?? ''}" style="width:160px" placeholder="0.00">
        </div>
        <div style="align-self:flex-end">
          <button class="btn-primary" onclick="submitCorrection('${t.id}')" id="submit-${t.id}" disabled>Confirm</button>
        </div>
      </div>
    </div>
  </div>`;
}

// State maps
const _labelState = {};
const _catState = {};

function selectLabel(id, label) {
  _labelState[id] = label;
  // Update button styles
  ['expense','income','ignore'].forEach(l => {
    const btn = document.getElementById(`lbl-${l}-${id}`);
    btn.className = 'label-btn' + (l === label ? ` active-${l}` : '');
  });
  // Show/hide amount
  const amtWrap = document.getElementById(`amt-wrap-${id}`);
  if (label === 'expense' || label === 'income') {
    amtWrap.classList.add('visible');
  } else {
    amtWrap.classList.remove('visible');
  }
  document.getElementById(`submit-${id}`).disabled = false;
}

function selectCat(id, cat) {
  _catState[id] = cat;
  document.querySelectorAll(`#chips-${id} .cat-chip`).forEach(btn => {
    btn.classList.toggle('active', btn.textContent === cat);
  });
}

async function submitCorrection(id) {
  const label = _labelState[id];
  if (!label) return;
  const amtEl = document.getElementById(`amt-${id}`);
  const body = { label };
  if (amtEl && amtEl.value) body.amount = parseFloat(amtEl.value);
  const cat = _catState[id];
  if (cat) body.category = cat;

  const btn = document.getElementById(`submit-${id}`);
  btn.textContent = 'Saving…'; btn.disabled = true;

  await fetch('/api/transactions/' + id, {
    method: 'PATCH',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  showToast('Saved', 'success');
  const cardEl = document.getElementById('review-' + id);
  cardEl.classList.add('card-removing');
  cardEl.addEventListener('animationend', function() {
    cardEl.remove();
    _items = _items.filter(t => t.id !== id);
    const countEl = document.getElementById('review-count-label');
    if (_items.length === 0) {
      document.getElementById('review-list').innerHTML = '<div style="color:var(--muted);padding:40px;text-align:center;font-size:14px">All clear ✓</div>';
      if (countEl) countEl.textContent = '';
    } else {
      if (countEl) countEl.textContent = `${_items.length} email${_items.length > 1 ? 's' : ''} to review`;
    }
  }, { once: true });
}

let _bulkPollTimer = null;

async function startReprocessAll() {
  const btn = document.getElementById('reprocess-all-btn');
  btn.disabled = true; btn.textContent = 'Starting…';

  const resp = await fetch('/api/review/reprocess-all', { method: 'POST' });
  const data = await resp.json();

  if (data.total === 0) {
    btn.disabled = false; btn.textContent = '↻ Reprocess All';
    return;
  }

  document.getElementById('bulk-progress-wrap').style.display = 'block';
  _pollBulkProgress();
}

async function _pollBulkProgress() {
  const p = await fetch('/api/review/reprocess-all/progress').then(r => r.json());
  const pct = p.total > 0 ? Math.round(p.done / p.total * 100) : 0;

  document.getElementById('bulk-progress-bar').style.width = pct + '%';
  document.getElementById('bulk-progress-label').textContent =
    `${p.done} / ${p.total} (${pct}%)`;

  if (p.moved_out > 0)
    document.getElementById('bulk-moved-out').textContent =
      `${p.moved_out} auto-confirmed`;
  if (p.errors > 0)
    document.getElementById('bulk-errors').textContent =
      `${p.errors} errors`;

  if (p.running) {
    _bulkPollTimer = setTimeout(_pollBulkProgress, 800);
  } else {
    // Done — reload the review list to reflect updated classifications
    const btn = document.getElementById('reprocess-all-btn');
    btn.textContent = '↻ Reprocess All'; btn.disabled = false;
    document.getElementById('bulk-progress-label').style.color = '#5db87d';
    document.getElementById('bulk-progress-label').textContent =
      `Done — ${p.done} processed, ${p.moved_out} auto-confirmed, ${p.errors} errors`;
    // Reload review list after a moment
    setTimeout(async () => {
      document.getElementById('bulk-progress-wrap').style.display = 'none';
      await loadReview();
    }, 2500);
  }
}

async function reprocess(id) {
  const btn = document.getElementById(`reprocess-${id}`);
  const msg = document.getElementById(`reprocess-msg-${id}`);
  btn.textContent = '↻ Processing…'; btn.disabled = true;
  msg.style.color = '#7c83fd'; msg.textContent = 'Calling rule engine + LLM…';

  try {
    const resp = await fetch(`/api/review/${id}/reprocess`, { method: 'POST' });
    if (!resp.ok) {
      const err = await resp.json();
      throw new Error(err.detail || 'Error');
    }
    const result = await resp.json();

    // Update the ai-hint line to show new classification
    const card = document.getElementById(`review-${id}`);
    const hint = card.querySelector('.ai-hint');
    if (hint) {
      const methodTag = result.classifier_method === 'llm' ? 'LLM' : 'Rule';
      hint.innerHTML = `Re-classified: <strong>${result.label}</strong> via ${methodTag} (${Math.round((result.confidence || 0) * 100)}% confidence)`;
      hint.style.color = '#7c83fd';
    }

    // Pre-select the returned label + pre-fill amount/category
    selectLabel(id, result.label);
    if (result.amount) {
      const amtEl = document.getElementById(`amt-${id}`);
      if (amtEl) amtEl.value = result.amount;
    }
    if (result.category) {
      selectCat(id, result.category);
      const customEl = document.getElementById(`custom-cat-${id}`);
      if (customEl && !CATEGORIES.includes(result.category)) customEl.value = result.category;
    }

    // If high-confidence auto result, show as auto-confirmed (still kept in review for user to confirm)
    msg.style.color = '#5db87d';
    msg.textContent = result.status === 'auto'
      ? `Auto-confirmed as ${result.label} — click Confirm to save`
      : `Classified as ${result.label} — review and confirm`;

    btn.textContent = '↻ Reprocess with rules + LLM';
    btn.disabled = false;
  } catch (e) {
    msg.style.color = '#e07070'; msg.textContent = e.message || 'Failed';
    btn.textContent = '↻ Reprocess with rules + LLM'; btn.disabled = false;
  }
  setTimeout(() => { msg.textContent = ''; }, 5000);
}

async function batchAction(action, domain, category, triggerId) {
  const label = action.replace('_domain','');
  if (!confirm(`Mark all ${_items.filter(t => t.email.sender_domain === domain).length + 1} emails from "${domain}" as ${label}?`)) return;
  const resp = await fetch('/api/review/batch', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ action, domain, category }),
  });
  if (resp.ok) {
    // Reload to get fresh list
    await loadReview();
  }
}

// Keyboard shortcuts: E=expense, I=income, S=ignore, Enter=confirm first pending card
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  const firstId = _items[0]?.id;
  if (!firstId) return;
  if (e.key === 'e' || e.key === 'E') { e.preventDefault(); selectLabel(firstId, 'expense'); }
  if (e.key === 'i' || e.key === 'I') { e.preventDefault(); selectLabel(firstId, 'income'); }
  if (e.key === 's' || e.key === 'S') { e.preventDefault(); selectLabel(firstId, 'ignore'); }
  if (e.key === 'Enter') {
    e.preventDefault();
    const btn = document.getElementById('submit-' + firstId);
    if (btn && !btn.disabled) btn.click();
  }
});

loadReview();
</script>
{% endblock %}
