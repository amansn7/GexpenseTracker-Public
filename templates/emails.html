{% extends "base.html" %}
{% block page_name %}emails{% endblock %}
{% block content %}

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
  <div>
    <div class="page-title">Gmail Inbox</div>
    <div class="page-sub" id="email-sub">Loading…</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="sel-count" style="font-size:12px;color:var(--muted)"></span>
    <button class="btn-ghost" id="btn-clear-sel" onclick="clearSel()" style="display:none;padding:5px 14px;font-size:12px">Clear</button>
    <button class="btn-ghost" id="btn-run-rules" onclick="runClassifier('rules')" style="display:none;padding:5px 14px;font-size:12px;border-color:var(--accent);color:var(--accent)">⚙ Run Rules</button>
    <button class="btn-ghost" id="btn-run-llm" onclick="runClassifier('llm')" style="display:none;padding:5px 14px;font-size:12px;border-color:var(--purple,#a78bfa);color:var(--purple,#a78bfa)">✦ Run LLM</button>
    <button class="btn-ghost" id="btn-retrain" onclick="retrainRules()" style="display:none;padding:5px 14px;font-size:12px;border-color:#f0c060;color:#f0c060">⟳ Retrain Rules</button>
  </div>
</div>

<!-- Filter bar -->
<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
  <select id="f-status" onchange="applyFilter()">
    <option value="">All</option>
    <option value="linked">Has transaction</option>
    <option value="unlinked">No transaction</option>
  </select>
  <select id="f-label" onchange="applyFilter()">
    <option value="">All labels</option>
    <option value="expense">Expense</option>
    <option value="income">Income</option>
    <option value="ignore">Ignore</option>
    <option value="needs_review">Needs review</option>
  </select>
  <input type="text" id="f-search" placeholder="Search subject / sender…" oninput="applyFilter()" style="width:220px">
  <select id="f-range" onchange="applyFilter()">
    <option value="">All time</option>
    <option value="week">This week</option>
    <option value="month">This month</option>
    <option value="year">This year</option>
  </select>
  <span id="filter-count" style="font-size:12px;color:var(--muted);margin-left:auto"></span>
</div>

<!-- Table -->
<div class="glass" style="padding:0;overflow:hidden">
  <table>
    <thead>
      <tr>
        <th style="width:32px;padding-left:14px">
          <input type="checkbox" id="chk-all" onchange="toggleAll(this.checked)" title="Select all visible">
        </th>
        <th style="width:130px">Received</th>
        <th>Subject</th>
        <th>Sender</th>
        <th style="width:90px">Label</th>
        <th style="width:90px;text-align:right">Amount</th>
        <th style="width:110px">Status</th>
        <th style="width:32px"></th>
      </tr>
    </thead>
    <tbody id="email-body"></tbody>
  </table>
</div>

<!-- Terminal output panel -->
<div id="terminal-panel" class="glass" style="display:none;margin-top:16px;padding:0;overflow:hidden">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.2)">
    <span style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:600">Output</span>
    <button onclick="document.getElementById('terminal-panel').style.display='none'" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;line-height:1">×</button>
  </div>
  <div id="terminal-body" style="padding:12px 16px;font-family:monospace;font-size:12px;line-height:1.7;max-height:300px;overflow-y:auto;background:rgba(0,0,0,0.15)"></div>
</div>

<style>
  tbody tr.data-row { cursor: pointer; }
  tbody tr.data-row.selected { background: rgba(124,131,253,0.08) !important; }
  tbody tr.data-row.selected td { border-bottom-color: rgba(124,131,253,0.15); }
  tbody tr.expanded-row td { padding: 0; border-bottom: 1px solid var(--border); }
  .expand-body {
    padding: 14px 20px 16px 60px;
    background: rgba(124,131,253,0.04);
    border-left: 3px solid var(--accent);
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 6px 12px;
    font-size: 12px;
  }
  .expand-key { color: var(--muted); text-transform: uppercase; letter-spacing: .4px; font-size: 10px; padding-top: 2px; }
  .expand-val { color: var(--text); line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .snippet-box { background: rgba(255,255,255,0.03); border-left: 3px solid var(--border); border-radius: var(--r-sm); padding: 8px 10px; font-size: 11px; color: var(--muted); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; width: 14px; height: 14px; }
  .status-pill { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; }
  .status-pill.linked   { background: rgba(93,184,125,0.12); color: var(--green); }
  .status-pill.unlinked { background: rgba(255,255,255,0.05); color: var(--muted); }
  /* Terminal action widget */
  .terminal-action {
    margin: 6px 0 8px 0; padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border-left: 2px solid rgba(124,131,253,0.4);
    border-radius: 0 4px 4px 0;
  }
  .ta-row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; flex-wrap: wrap; }
  .ta-row:last-child { margin-bottom: 0; }
  .ta-lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; width: 120px; flex-shrink: 0; }
  .ta-select, .ta-input {
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    color: var(--text); border-radius: var(--r-sm); padding: 3px 8px;
    font-size: 11px; font-family: monospace;
  }
  .ta-btn {
    background: rgba(124,131,253,0.12); border: 1px solid rgba(124,131,253,0.35);
    color: var(--accent); border-radius: var(--r-sm); padding: 3px 12px;
    font-size: 11px; cursor: pointer; font-family: monospace;
    transition: background .15s;
  }
  .ta-btn:hover:not(:disabled) { background: rgba(124,131,253,0.22); }
  .ta-btn:disabled { opacity: .45; cursor: default; }
  .ta-btn-llm { border-color: rgba(167,139,250,0.35); color: #a78bfa; background: rgba(167,139,250,0.08); }
  .ta-btn-llm:hover:not(:disabled) { background: rgba(167,139,250,0.18); }
  /* Terminal line colors */
  .t-start      { color: #7c83fd; font-weight: 600; }
  .t-processing { color: #e2e2f0; font-weight: 500; }
  .t-section    { color: #5a5a7a; margin-top: 2px; }
  .t-divider    { color: #2e2e4a; }
  .t-dim        { color: #5a5a7a; }
  .t-match      { color: #5db87d; }
  .t-income     { color: #7c83fd; }
  .t-result     { color: #5db87d; font-weight: 600; }
  .t-error      { color: #ff6b81; }
  .t-complete   { color: #f0c060; font-weight: 600; }
  .t-prompt     { color: #8888aa; font-style: italic; }
  .t-raw        { color: #f0c060; }
</style>

<script>
var _all = [];
var _visible = [];
var _selected = new Set();
var _expanded = null;   // currently expanded email id

async function loadEmails() {
  const tbody = document.getElementById('email-body');
  tbody.innerHTML = '<tr><td colspan="8" style="color:var(--muted);padding:24px;text-align:center">Loading…</td></tr>';
  try {
    _all = await fetch('/api/emails').then(r => r.json());
    document.getElementById('email-sub').textContent = _all.length + ' emails in DB';
    applyFilter();
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="8" style="color:var(--muted);padding:24px;text-align:center">Failed to load</td></tr>';
  }
}

function applyFilter() {
  const fStatus = document.getElementById('f-status').value;
  const fLabel  = document.getElementById('f-label').value;
  const fSearch = document.getElementById('f-search').value.toLowerCase();

  const fRange = document.getElementById('f-range').value;
  const now = new Date();
  let rangeStart = null;
  if (fRange === 'week') {
    rangeStart = new Date(now); rangeStart.setDate(now.getDate() - 7);
  } else if (fRange === 'month') {
    rangeStart = new Date(now.getFullYear(), now.getMonth(), 1);
  } else if (fRange === 'year') {
    rangeStart = new Date(now.getFullYear(), 0, 1);
  }

  _visible = _all.filter(e => {
    if (fStatus === 'linked'   && !e.txn_id) return false;
    if (fStatus === 'unlinked' && e.txn_id)  return false;
    if (fLabel && e.label !== fLabel)         return false;
    if (fSearch && !((e.subject||'').toLowerCase().includes(fSearch) || (e.sender||'').toLowerCase().includes(fSearch))) return false;
    if (rangeStart && e.received_at && new Date(e.received_at) < rangeStart) return false;
    return true;
  });

  document.getElementById('filter-count').textContent = _visible.length + ' shown';
  _expanded = null;
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('email-body');
  if (!_visible.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="color:var(--muted);padding:24px;text-align:center">No emails match</td></tr>';
    return;
  }

  const rows = [];
  _visible.forEach((e, i) => {
    const isLinked = !!e.txn_id;
    const lbl = e.label || '';
    const labelBadge = lbl
      ? `<span class="badge ${lbl === 'needs_review' ? 'review' : lbl}">${lbl === 'needs_review' ? 'review' : lbl}</span>`
      : '<span style="color:var(--dim)">—</span>';
    const statusPill = isLinked
      ? '<span class="status-pill linked">linked</span>'
      : '<span class="status-pill unlinked">no txn</span>';
    const checked = _selected.has(e.id) ? 'checked' : '';
    const selClass = _selected.has(e.id) ? ' selected' : '';
    const isExp = _expanded === e.id;
    const date = e.received_at ? e.received_at.slice(0,16).replace('T',' ') : '—';

    rows.push(`<tr class="data-row anim-row${selClass}" style="--i:${Math.min(i,30)}" data-id="${_esc(e.id)}" onclick="rowClick(event,'${_esc(e.id)}')">
      <td style="padding-left:14px" onclick="event.stopPropagation()">
        <input type="checkbox" ${checked} onchange="chkRow('${_esc(e.id)}',this.checked)">
      </td>
      <td style="color:var(--muted);font-size:12px;white-space:nowrap">${date}</td>
      <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${_esc(e.subject || '(no subject)')}</td>
      <td style="color:var(--muted);font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_esc(e.sender || '—')}</td>
      <td>${labelBadge}</td>
      <td style="text-align:right;font-weight:600;color:${lbl==='expense'?'var(--red)':lbl==='income'?'var(--green)':'var(--muted)'}">${e.amount != null ? '₹' + Number(e.amount).toLocaleString('en-IN') : '—'}</td>
      <td>${statusPill}</td>
      <td>${e.gmail_link ? `<a href="${_esc(e.gmail_link)}" target="_blank" class="link" style="font-size:11px" onclick="event.stopPropagation()">↗</a>` : ''}</td>
    </tr>`);

    if (isExp) {
      rows.push(_expandedRow(e));
    }
  });

  tbody.innerHTML = rows.join('');
  updateSelUI();
}

function _htmlDecode(s) {
  const d = document.createElement('div');
  d.innerHTML = s;
  return d.textContent;
}

function _expandedRow(e) {
  // body_text is clean plain text; body_snippet is HTML-encoded by Gmail — decode it
  const rawBody = e.body_text || (e.body_snippet ? _htmlDecode(e.body_snippet) : '') || '—';
  const txnBlock = e.txn_id ? `
    <div class="expand-key">Label</div><div class="expand-val"><span class="badge ${e.label === 'needs_review' ? 'review' : e.label}">${e.label}</span></div>
    <div class="expand-key">Amount</div><div class="expand-val">${e.amount != null ? '₹' + Number(e.amount).toLocaleString('en-IN') : '—'}</div>
    <div class="expand-key">Merchant</div><div class="expand-val">${_esc(e.merchant || '—')}</div>
    <div class="expand-key">Category</div><div class="expand-val">${_esc(e.category || '—')}</div>
    <div class="expand-key">Status</div><div class="expand-val">${_esc(e.status || '—')}</div>
  ` : `<div class="expand-key">Transaction</div><div class="expand-val" style="color:var(--muted)">None — not yet classified</div>`;

  return `<tr class="expanded-row">
    <td colspan="8">
      <div class="expand-body">
        <div class="expand-key">Subject</div><div class="expand-val">${_esc(e.subject || '—')}</div>
        <div class="expand-key">Sender</div><div class="expand-val">${_esc(e.sender || '—')}</div>
        <div class="expand-key">Received</div><div class="expand-val">${e.received_at ? e.received_at.replace('T',' ').slice(0,19) : '—'}</div>
        ${txnBlock}
        <div class="expand-key">Body</div><div class="expand-val"><div class="snippet-box">${_esc(rawBody)}</div></div>
        ${e.gmail_link ? `<div class="expand-key">Gmail</div><div class="expand-val"><a href="${_esc(e.gmail_link)}" target="_blank" class="link">Open in Gmail ↗</a></div>` : ''}
      </div>
    </td>
  </tr>`;
}

function rowClick(ev, id) {
  if (ev.target.tagName === 'INPUT' || ev.target.tagName === 'A') return;
  _expanded = (_expanded === id) ? null : id;
  renderTable();
}

function chkRow(id, on) {
  if (on) _selected.add(id); else _selected.delete(id);
  const row = document.querySelector(`tr[data-id="${id}"]`);
  if (row) row.classList.toggle('selected', on);
  updateSelUI();
}

function toggleAll(on) {
  _visible.forEach(e => { if (on) _selected.add(e.id); else _selected.delete(e.id); });
  renderTable();
}

function clearSel() {
  _selected.clear();
  renderTable();
}

function updateSelUI() {
  const n = _selected.size;
  document.getElementById('sel-count').textContent = n ? n + ' selected' : '';
  document.getElementById('btn-clear-sel').style.display  = n ? '' : 'none';
  document.getElementById('btn-run-rules').style.display  = n ? '' : 'none';
  document.getElementById('btn-run-llm').style.display    = n ? '' : 'none';
  document.getElementById('btn-retrain').style.display    = n ? '' : 'none';
  const chkAll = document.getElementById('chk-all');
  chkAll.indeterminate = n > 0 && n < _visible.length;
  chkAll.checked = _visible.length > 0 && n === _visible.length;
}

/* ── Classifier runner ────────────────────────────────────── */

async function runClassifier(method) {
  const ids = [..._selected];
  if (!ids.length) return;

  const panel = document.getElementById('terminal-panel');
  const body  = document.getElementById('terminal-body');
  panel.style.display = '';
  body.innerHTML = '';
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  const tlog = (msg, cls) => {
    const line = document.createElement('div');
    if (cls) line.className = 't-' + cls;
    line.textContent = msg;
    body.appendChild(line);
    body.scrollTop = body.scrollHeight;
  };

  // Disable buttons while running
  document.getElementById('btn-run-rules').disabled = true;
  document.getElementById('btn-run-llm').disabled   = true;

  try {
    const resp = await fetch('/api/emails/reclassify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email_ids: ids, method }),
    });

    if (!resp.ok) {
      tlog('✗ Server error: ' + resp.status, 'error');
      return;
    }

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const chunk of parts) {
        const line = chunk.trim();
        if (!line.startsWith('data: ')) continue;
        try {
          const d = JSON.parse(line.slice(6));
          if (d.type === 'action') {
            taction(d);
          } else {
            tlog(d.message, d.type || 'dim');
          }
        } catch {}
      }
    }

    // Reload emails + clear selection + refresh review badge
    _selected.clear();
    await loadEmails();
    if (typeof refreshReviewBadge === 'function') refreshReviewBadge();

  } catch (err) {
    tlog('✗ ' + err.message, 'error');
  } finally {
    document.getElementById('btn-run-rules').disabled = false;
    document.getElementById('btn-run-llm').disabled   = false;
  }
}

/* ── Retrain rules ────────────────────────────────────────── */

async function retrainRules() {
  const ids = [..._selected];
  if (!ids.length) return;

  const panel = document.getElementById('terminal-panel');
  const body  = document.getElementById('terminal-body');
  panel.style.display = '';
  body.innerHTML = '';
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

  _tlog(body, `▶ RETRAIN RULES from ${ids.length} selected email(s)`, 'start');
  _tlog(body, '─'.repeat(60), 'divider');

  document.getElementById('btn-retrain').disabled = true;

  try {
    const r = await fetch('/api/emails/retrain', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email_ids: ids }),
    });
    const data = await r.json();

    if (data.saved?.length) {
      _tlog(body, `\nSaved ${data.saved.length} rule(s):`, 'section');
      data.saved.forEach(s => {
        const action = s.was_existing ? 'updated' : 'created';
        const cat    = s.category ? ` / ${s.category}` : '';
        const subj   = s.subject ? `  ← "${s.subject.slice(0,60)}"` : '';
        _tlog(body, `  ✓ ${s.domain} → ${s.label}${cat}  [${action}]${subj}`, 'match');
      });
    }

    if (data.skipped?.length) {
      _tlog(body, `\nSkipped ${data.skipped.length}:`, 'section');
      data.skipped.forEach(s => {
        const subj = s.subject ? `"${s.subject.slice(0,50)}"` : s.id;
        _tlog(body, `  ✗ ${subj} — ${s.reason}`, 'dim');
      });
    }

    _tlog(body, `\n✓ Done — ${data.saved?.length || 0} rule(s) saved.`, 'complete');
    showToast(`${data.saved?.length || 0} rule(s) saved`, 'success');
    if (typeof refreshReviewBadge === 'function') refreshReviewBadge();

  } catch(e) {
    _tlog(body, '✗ ' + e.message, 'error');
  } finally {
    document.getElementById('btn-retrain').disabled = false;
  }
}

/* ── Terminal action widget ───────────────────────────────── */

function taction(d) {
  const body = document.getElementById('terminal-body');
  const wrap = document.createElement('div');
  wrap.className = 'terminal-action';
  wrap.dataset.emailId = d.email_id;
  wrap.dataset.txnId   = d.txn_id || '';
  wrap.dataset.domain  = d.domain || '';

  const LABELS = ['expense', 'income', 'ignore'];
  const opts = LABELS.map(l =>
    `<option value="${l}"${l === d.current_label ? ' selected' : ''}>${l}</option>`
  ).join('');

  const amtVal = d.current_amount != null ? d.current_amount : '';
  wrap.innerHTML = `
    <div class="ta-row">
      <span class="ta-lbl">Label</span>
      <select class="ta-select ta-label-sel">${opts}</select>
    </div>
    <div class="ta-row">
      <span class="ta-lbl">Merchant</span>
      <input class="ta-input ta-merchant-input" placeholder="merchant name" value="${_esc(d.current_merchant||'')}" style="width:200px">
    </div>
    <div class="ta-row">
      <span class="ta-lbl">Category</span>
      <input class="ta-input ta-cat-input" placeholder="e.g. Food, Travel, UPI Payment" value="${_esc(d.current_category||'')}" style="width:200px">
    </div>
    <div class="ta-row">
      <span class="ta-lbl">Amount (₹)</span>
      <input class="ta-input ta-amount-input" type="number" step="0.01" placeholder="0.00" value="${amtVal}" style="width:120px">
    </div>
    <div class="ta-row">
      <span class="ta-lbl"></span>
      <button class="ta-btn" onclick="applyLabelFix(this)">Apply + Save Rule</button>
      <span class="ta-status" style="font-size:11px;color:var(--muted)"></span>
    </div>
    <div class="ta-row">
      <span class="ta-lbl">Re-run LLM</span>
      <input class="ta-input ta-hint-input" placeholder="hint: e.g. this is a food delivery receipt" style="width:260px">
      <button class="ta-btn ta-btn-llm" onclick="rerunWithHint(this)">Re-run with hint</button>
    </div>`;

  body.appendChild(wrap);
  body.scrollTop = body.scrollHeight;
}

async function applyLabelFix(btn) {
  const w        = btn.closest('.terminal-action');
  const txnId    = w.dataset.txnId;
  const label    = w.querySelector('.ta-label-sel').value;
  const cat      = w.querySelector('.ta-cat-input').value.trim() || null;
  const merchant = w.querySelector('.ta-merchant-input').value.trim() || null;
  const amtRaw   = w.querySelector('.ta-amount-input').value.trim();
  const amount   = amtRaw !== '' ? parseFloat(amtRaw) : null;
  const status   = w.querySelector('.ta-status');

  if (!txnId) { status.textContent = '✗ no transaction id'; return; }

  btn.disabled = true;
  btn.textContent = 'Saving…';
  status.textContent = '';

  try {
    const r = await fetch(`/api/transactions/${txnId}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ label, category: cat, merchant, amount }),
    });
    if (r.ok) {
      btn.textContent = '✓ Saved';
      btn.style.color = 'var(--green)';
      status.style.color = 'var(--green)';
      const parts = [label, cat, merchant, amount != null ? '₹' + amount : null].filter(Boolean);
      status.textContent = `→ ${parts.join(' / ')} + domain rule saved`;
      showToast(`Saved: ${label}`, 'success');
      if (typeof refreshReviewBadge === 'function') refreshReviewBadge();
      _selected.clear();
      loadEmails();
    } else {
      throw new Error((await r.json()).detail || r.status);
    }
  } catch(e) {
    btn.textContent = '✗ Error';
    btn.disabled = false;
    status.style.color = 'var(--red)';
    status.textContent = e.message;
  }
}

async function rerunWithHint(btn) {
  const w       = btn.closest('.terminal-action');
  const emailId = w.dataset.emailId;
  const hint    = w.querySelector('.ta-hint-input').value.trim();
  if (!hint) {
    w.querySelector('.ta-hint-input').focus();
    return;
  }

  const termBody = document.getElementById('terminal-body');
  const sep = document.createElement('div');
  sep.className = 't-section';
  sep.textContent = `\n── Re-running with hint: "${hint}" ──`;
  termBody.appendChild(sep);
  termBody.scrollTop = termBody.scrollHeight;

  btn.disabled = true;
  btn.textContent = 'Running…';

  try {
    const resp = await fetch('/api/emails/reclassify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email_ids: [emailId], method: 'llm', hints: { [emailId]: hint } }),
    });

    const reader  = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const chunk of parts) {
        const line = chunk.trim();
        if (!line.startsWith('data: ')) continue;
        try {
          const d = JSON.parse(line.slice(6));
          if (d.type === 'action') taction(d);
          else _tlog(termBody, d.message, d.type || 'dim');
        } catch {}
      }
    }
    if (typeof refreshReviewBadge === 'function') refreshReviewBadge();
    loadEmails();
  } catch(e) {
    _tlog(termBody, '✗ ' + e.message, 'error');
  } finally {
    btn.textContent = 'Re-run with hint';
    btn.disabled = false;
  }
}

// Internal tlog that accepts a target element (used by rerunWithHint)
function _tlog(container, msg, cls) {
  const line = document.createElement('div');
  if (cls) line.className = 't-' + cls;
  line.textContent = msg;
  container.appendChild(line);
  container.scrollTop = container.scrollHeight;
}

loadEmails();
</script>
