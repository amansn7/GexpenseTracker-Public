{% extends "base.html" %}
{% block page_name %}emails{% endblock %}
{% block content %}

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
  <div>
    <div class="page-title">Gmail Inbox</div>
    <div class="page-sub" id="email-sub">Loading…</div>
  </div>
  <div style="display:flex;gap:8px;align-items:center">
    <span id="sel-count" style="font-size:12px;color:var(--muted)"></span>
    <button class="btn-ghost" id="btn-clear-sel" onclick="clearSel()" style="display:none;padding:5px 14px;font-size:12px">Clear</button>
  </div>
</div>

<!-- Filter bar -->
<div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center">
  <select id="f-status" onchange="applyFilter()">
    <option value="">All</option>
    <option value="linked">Has transaction</option>
    <option value="unlinked">No transaction</option>
  </select>
  <select id="f-label" onchange="applyFilter()">
    <option value="">All labels</option>
    <option value="expense">Expense</option>
    <option value="income">Income</option>
    <option value="ignore">Ignore</option>
    <option value="needs_review">Needs review</option>
  </select>
  <input type="text" id="f-search" placeholder="Search subject / sender…" oninput="applyFilter()" style="width:220px">
  <span id="filter-count" style="font-size:12px;color:var(--muted);margin-left:auto"></span>
</div>

<!-- Table -->
<div class="glass" style="padding:0;overflow:hidden">
  <table>
    <thead>
      <tr>
        <th style="width:32px;padding-left:14px">
          <input type="checkbox" id="chk-all" onchange="toggleAll(this.checked)" title="Select all visible">
        </th>
        <th style="width:130px">Received</th>
        <th>Subject</th>
        <th>Sender</th>
        <th style="width:90px">Label</th>
        <th style="width:90px;text-align:right">Amount</th>
        <th style="width:110px">Status</th>
        <th style="width:32px"></th>
      </tr>
    </thead>
    <tbody id="email-body"></tbody>
  </table>
</div>

<!-- Row detail panel (appears below table when 1 row selected) -->
<div id="detail-panel" class="glass" style="display:none;margin-top:16px;padding:18px 20px">
  <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px">Email Detail</div>
  <div id="detail-content"></div>
</div>

<style>
  tbody tr { cursor: pointer; }
  tbody tr.selected { background: rgba(124,131,253,0.08) !important; }
  tbody tr.selected td { border-bottom-color: rgba(124,131,253,0.15); }
  input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; width: 14px; height: 14px; }
  .status-pill {
    display: inline-block; padding: 2px 8px; border-radius: 20px;
    font-size: 10px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
  }
  .status-pill.linked   { background: rgba(93,184,125,0.12); color: var(--green); }
  .status-pill.unlinked { background: rgba(255,255,255,0.05); color: var(--muted); }
  .detail-row { display: flex; gap: 12px; margin-bottom: 8px; font-size: 13px; }
  .detail-key { color: var(--muted); width: 110px; flex-shrink: 0; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; padding-top: 1px; }
  .detail-val { color: var(--text); flex: 1; line-height: 1.5; }
  .snippet-box { background: rgba(255,255,255,0.03); border-left: 3px solid var(--border); border-radius: var(--r-sm); padding: 10px 12px; font-size: 12px; color: var(--muted); line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-height: 160px; overflow-y: auto; }
</style>

<script>
var _all = [];      // raw data from API
var _visible = [];  // after filter
var _selected = new Set();

async function loadEmails() {
  const tbody = document.getElementById('email-body');
  tbody.innerHTML = _skeletonRows(10, 8);
  try {
    _all = await fetch('/api/emails').then(r => r.json());
    document.getElementById('email-sub').textContent = _all.length + ' emails in DB';
    applyFilter();
  } catch(e) {
    tbody.innerHTML = '<tr><td colspan="8" style="color:var(--muted);padding:24px;text-align:center">Failed to load</td></tr>';
  }
}

function applyFilter() {
  const fStatus = document.getElementById('f-status').value;
  const fLabel  = document.getElementById('f-label').value;
  const fSearch = document.getElementById('f-search').value.toLowerCase();

  _visible = _all.filter(e => {
    if (fStatus === 'linked'   && !e.txn_id) return false;
    if (fStatus === 'unlinked' && e.txn_id)  return false;
    if (fLabel && e.label !== fLabel)         return false;
    if (fSearch && !((e.subject||'').toLowerCase().includes(fSearch) || (e.sender||'').toLowerCase().includes(fSearch))) return false;
    return true;
  });

  document.getElementById('filter-count').textContent = _visible.length + ' shown';
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('email-body');
  if (!_visible.length) {
    tbody.innerHTML = '<tr><td colspan="8" style="color:var(--muted);padding:24px;text-align:center">No emails match</td></tr>';
    return;
  }
  tbody.innerHTML = _visible.map((e, i) => {
    const isLinked = !!e.txn_id;
    const lbl = e.label || '';
    const labelBadge = lbl
      ? `<span class="badge ${lbl === 'needs_review' ? 'review' : lbl}">${lbl === 'needs_review' ? 'review' : lbl}</span>`
      : '<span style="color:var(--dim)">—</span>';
    const statusPill = isLinked
      ? '<span class="status-pill linked">linked</span>'
      : '<span class="status-pill unlinked">no txn</span>';
    const checked = _selected.has(e.id) ? 'checked' : '';
    const selClass = _selected.has(e.id) ? ' selected' : '';
    const date = e.received_at ? e.received_at.slice(0,16).replace('T',' ') : '—';
    return `<tr class="anim-row${selClass}" style="--i:${Math.min(i,30)}" data-id="${_esc(e.id)}" onclick="rowClick(event,'${_esc(e.id)}')">
      <td style="padding-left:14px" onclick="event.stopPropagation()">
        <input type="checkbox" ${checked} onchange="toggleRow('${_esc(e.id)}',this.checked)">
      </td>
      <td style="color:var(--muted);font-size:12px;white-space:nowrap">${date}</td>
      <td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)">${_esc(e.subject || '(no subject)')}</td>
      <td style="color:var(--muted);font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${_esc(e.sender || '—')}</td>
      <td>${labelBadge}</td>
      <td style="text-align:right;font-weight:600;color:${lbl==='expense'?'var(--red)':lbl==='income'?'var(--green)':'var(--muted)'}">${e.amount != null ? '₹' + Number(e.amount).toLocaleString('en-IN') : '—'}</td>
      <td>${statusPill}</td>
      <td>${e.gmail_link ? `<a href="${_esc(e.gmail_link)}" target="_blank" class="link" style="font-size:11px" onclick="event.stopPropagation()">↗</a>` : ''}</td>
    </tr>`;
  }).join('');
  updateSelUI();
}

function rowClick(ev, id) {
  // clicking anywhere on row (not checkbox) → show detail, toggle selection
  toggleRow(id, !_selected.has(id));
  // sync the checkbox
  const row = document.querySelector(`tr[data-id="${id}"]`);
  if (row) {
    const chk = row.querySelector('input[type=checkbox]');
    if (chk) chk.checked = _selected.has(id);
  }
}

function toggleRow(id, on) {
  if (on) _selected.add(id); else _selected.delete(id);
  const row = document.querySelector(`tr[data-id="${id}"]`);
  if (row) row.classList.toggle('selected', on);
  updateSelUI();
  updateDetail();
}

function toggleAll(on) {
  _visible.forEach(e => { if (on) _selected.add(e.id); else _selected.delete(e.id); });
  renderTable();
  updateDetail();
}

function clearSel() {
  _selected.clear();
  renderTable();
  updateDetail();
}

function updateSelUI() {
  const n = _selected.size;
  document.getElementById('sel-count').textContent = n ? n + ' selected' : '';
  document.getElementById('btn-clear-sel').style.display = n ? '' : 'none';
  // sync select-all checkbox
  const chkAll = document.getElementById('chk-all');
  chkAll.indeterminate = n > 0 && n < _visible.length;
  chkAll.checked = _visible.length > 0 && n === _visible.length;
}

function updateDetail() {
  const panel = document.getElementById('detail-panel');
  if (_selected.size !== 1) { panel.style.display = 'none'; return; }
  const id = [..._selected][0];
  const e = _all.find(x => x.id === id);
  if (!e) { panel.style.display = 'none'; return; }
  panel.style.display = '';
  document.getElementById('detail-content').innerHTML = `
    <div class="detail-row"><div class="detail-key">Subject</div><div class="detail-val">${_esc(e.subject || '—')}</div></div>
    <div class="detail-row"><div class="detail-key">Sender</div><div class="detail-val">${_esc(e.sender || '—')}</div></div>
    <div class="detail-row"><div class="detail-key">Received</div><div class="detail-val">${e.received_at ? e.received_at.replace('T',' ').slice(0,19) : '—'}</div></div>
    <div class="detail-row"><div class="detail-key">Gmail ID</div><div class="detail-val" style="font-size:11px;color:var(--muted)">${_esc(e.gmail_id)}</div></div>
    ${e.txn_id ? `
    <div class="detail-row"><div class="detail-key">Transaction</div><div class="detail-val">${_esc(e.txn_id)}</div></div>
    <div class="detail-row"><div class="detail-key">Label</div><div class="detail-val"><span class="badge ${e.label}">${e.label}</span></div></div>
    <div class="detail-row"><div class="detail-key">Category</div><div class="detail-val">${_esc(e.category || '—')}</div></div>
    <div class="detail-row"><div class="detail-key">Amount</div><div class="detail-val">${e.amount != null ? '₹' + Number(e.amount).toLocaleString('en-IN') : '—'}</div></div>
    <div class="detail-row"><div class="detail-key">Status</div><div class="detail-val">${_esc(e.status || '—')}</div></div>
    ` : '<div class="detail-row"><div class="detail-key">Transaction</div><div class="detail-val" style="color:var(--muted)">None — not yet classified</div></div>'}
    ${e.body_snippet ? `<div class="detail-row"><div class="detail-key">Snippet</div><div class="detail-val"><div class="snippet-box">${_esc(e.body_snippet)}</div></div></div>` : ''}
    ${e.gmail_link ? `<div class="detail-row"><div class="detail-key">Gmail</div><div class="detail-val"><a href="${_esc(e.gmail_link)}" target="_blank" class="link">Open in Gmail ↗</a></div></div>` : ''}
  `;
}

loadEmails();
</script>

{% endblock %}
