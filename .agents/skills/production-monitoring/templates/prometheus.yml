# =============================================================================
# Prometheus scrape configuration template
# Scrapes metrics from your application and common exporters
# =============================================================================

global:
  scrape_interval: 15s        # Default scrape interval
  evaluation_interval: 15s    # Rule evaluation interval
  scrape_timeout: 10s         # Timeout per scrape

# Alert rules
rule_files:
  - "alert_rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

# Scrape targets
scrape_configs:
  # ---------------------------------------------------------------------------
  # Application metrics
  # ---------------------------------------------------------------------------
  - job_name: "api"
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - "api:8000"
        labels:
          service: "api"
          environment: "production"

  # ---------------------------------------------------------------------------
  # PostgreSQL (via postgres_exporter)
  # ---------------------------------------------------------------------------
  - job_name: "postgres"
    static_configs:
      - targets:
          - "postgres-exporter:9187"
        labels:
          service: "postgres"

  # ---------------------------------------------------------------------------
  # Redis (via redis_exporter)
  # ---------------------------------------------------------------------------
  - job_name: "redis"
    static_configs:
      - targets:
          - "redis-exporter:9121"
        labels:
          service: "redis"

  # ---------------------------------------------------------------------------
  # Node exporter (host metrics)
  # ---------------------------------------------------------------------------
  - job_name: "node"
    static_configs:
      - targets:
          - "node-exporter:9100"

  # ---------------------------------------------------------------------------
  # Prometheus self-monitoring
  # ---------------------------------------------------------------------------
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

